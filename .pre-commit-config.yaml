# Quick local guards (full SOTA gates run in CI openapi-contract job).
repos:
  - repo: local
    hooks:
      - id: check-legacy-processor-config
        name: SOTA legacy config guard
        entry: python3 scripts/check_legacy_processor_config.py
        language: system
        pass_filenames: false
      - id: validate-pipeline-golden-quick
        name: Golden Gate (synthetic)
        entry: bash -c 'cd app/processor && PYTHONPATH=src:../.. python3 -m pytest tests/test_pipeline_golden_gate.py tests/test_scoring_engine.py -q'
        language: system
        pass_filenames: false
