site_name: BirdLense Hub
site_description: Documentation for the BirdLense Hub bird-monitoring stack
site_url: https://gfermoto.github.io/BirdLense-Hub/
repo_url: https://github.com/Gfermoto/BirdLense-Hub
repo_name: Gfermoto/BirdLense-Hub
edit_uri: edit/main/docs/

copyright: Copyright &copy; BirdLense Hub contributors

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - attr_list
  - md_in_html

validation:
  nav:
    omitted_files: ignore
  links:
    not_found: ignore

exclude_docs: |
  archive/**
  article/**
  github-issues/**
  project/**
  api/**
  ui/**

nav:
  - Home: index.md
  - User Guide:
      - Overview: user/overview.md
      - Quickstart: user/quickstart.md
      - Installation: user/install.md
      - Configuration: user/configuration.md
      - Deploy server: user/deploy-server.md
      - Public recordings: user/public-recordings.md
      - Features: user/features.md
      - Scenarios: user/scenarios.md
      - Runbooks: user/runbooks.md
      - Troubleshooting: user/troubleshooting.md
      - Recovery config: user/recovery-config.md
      - Processor performance: user/processor-performance.md
      - Glossary: user/glossary.md
  - Contributor Guide:
      - Architecture: contributor/architecture.md
      - API: contributor/api.md
      - API errors: contributor/api-errors.md
      - Access control: contributor/access-control.md
      - Security: contributor/security.md
      - Local development: contributor/local-dev.md
      - MCP setup: contributor/mcp-setup.md
      - Testing: contributor/testing.md
      - CI and quality: contributor/ci-and-quality.md
      - Datasets: contributor/datasets.md
      - Repository layout: contributor/repository-layout.md
      - Roadmap: contributor/roadmap.md
  - Русский:
      - Обзор: ru/overview.ru.md
      - Быстрый старт: ru/quickstart.ru.md
      - Установка: ru/install.ru.md
      - Конфигурация: ru/configuration.ru.md
      - Деплой сервера: ru/deploy-server.ru.md
      - Публичные записи: ru/public-recordings.ru.md
      - Возможности: ru/features.ru.md
      - Сценарии: ru/scenarios.ru.md
      - Runbooks: ru/runbooks.ru.md
      - Решение проблем: ru/troubleshooting.ru.md
      - Восстановление конфига: ru/recovery-config.ru.md
      - Производительность процессора: ru/processor-performance.ru.md
      - Глоссарий: ru/glossary.ru.md
      - Архитектура: ru/architecture.ru.md
      - API: ru/api.ru.md
      - Доступ: ru/access-control.ru.md
      - Безопасность: ru/security.ru.md
      - Локальная разработка: ru/local-dev.ru.md
      - MCP setup: ru/mcp-setup.ru.md
      - Тестирование: ru/testing.ru.md

extra:
  site_version: "0.3.7"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Gfermoto/BirdLense-Hub
