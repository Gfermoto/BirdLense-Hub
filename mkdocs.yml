# Static documentation site (MkDocs Material).
# Source of truth remains Markdown under docs/. Cross-check `nav` with docs/SITE_MAP*.md (Meta vs Repository order).
# Релиз: VERSION в mkdocs extra.site_version (check scripts/check-docs-version.py); баннер — overrides/main.html.
site_name: BirdLense Hub
site_description: Documentation for the BirdLense Hub bird-monitoring stack
site_url: https://gfermoto.github.io/BirdLense-Hub/
repo_url: https://github.com/Gfermoto/BirdLense-Hub
repo_name: Gfermoto/BirdLense-Hub
edit_uri: edit/main/docs/

copyright: Copyright &copy; BirdLense Hub contributors

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - announce.dismiss
    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - attr_list
  - md_in_html

# Keep archive and other non-nav pages out of the built site (optional deep links only via explicit nav).
exclude_docs: |
  archive/**
  article/**
  CONSILIUM_AUDIT.ru.md
  PRE_IMPLEMENTATION_UNKNOWN_TIMELINE.md
  PRE_IMPLEMENTATION_UNKNOWN_TIMELINE.ru.md
  LEGACY_CLEANUP.md

