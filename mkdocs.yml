site_name: BirdLense Hub
site_description: Documentation for the BirdLense Hub bird-monitoring stack
site_url: https://gfermoto.github.io/BirdLense-Hub/
repo_url: https://github.com/Gfermoto/BirdLense-Hub
repo_name: Gfermoto/BirdLense-Hub
edit_uri: edit/main/docs/

copyright: Copyright &copy; BirdLense Hub contributors

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - attr_list
  - md_in_html

validation:
  nav:
    omitted_files: ignore
  links:
    not_found: ignore

exclude_docs: |
  archive/**
  article/**
  github-issues/**
  project/**
  api/**
  ui/**
  ACCESS_CONTROL.md
  ACCESS_CONTROL.ru.md
