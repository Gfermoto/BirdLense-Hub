# Дельты user_config для Intel NUC (x86_64). Merge вручную в user_config.yaml на площадке.
# См. app/app_config/user_config.openvino-intel.example.yaml и user_config.trapper-production.example.yaml

processor:
  inference_backend: openvino
  inference_device: intel:gpu
  openvino_binary_enabled: true
  classifier_inference_backend: openvino
  classifier_inference_device: intel:gpu
  models:
    binary: models/detection/weights/trapper_ai_v02_2024.pt
    binary_openvino: models/detection/weights/trapper_ai_v02_2024_openvino_model
  openvino:
    profile: latency
    num_requests: 0
    model_cache_enabled: true

video:
  encoding: intel
  record_with_vaapi: true
  capture_backend: auto
