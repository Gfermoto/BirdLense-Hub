# Пример streams для go2rtc (Frigate или standalone).
# Файл на стороне go2rtc: обычно go2rtc.yaml рядом с Frigate или в каталоге standalone.
# Имена потоков (BirdBox, Forest) должны совпадать с stream_name / go2rtc_src в BirdLense → video.cameras.
#
# H264 RTSP без второй строки ffmpeg даёт пустой /api/stream.mjpeg — в Live «MJPEG» не работает.
# См. docs/user/configuration.md → «Go2RTC streams and MJPEG».

streams:
  Forest:
    - rtsp://USER:PASSWORD@192.168.1.101:554/cam/realmonitor?channel=1&subtype=0
    - ffmpeg:Forest#video=mjpeg
  BirdBox:
    - rtsp://USER:PASSWORD@192.168.1.129:554/cam/realmonitor?channel=1&subtype=0
    - ffmpeg:BirdBox#video=mjpeg
