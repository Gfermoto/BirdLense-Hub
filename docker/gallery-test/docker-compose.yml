# Тестовая галерея для проверки загрузок BirdLense Hub
# Запуск: docker compose -f docker/gallery-test/docker-compose.yml up -d
# URL: http://localhost:8086
# API: http://localhost:8086/api/upload

services:
  gallery-test:
    build: .
    ports:
      - "8086:5000"
    volumes:
      - gallery-data:/data
    environment:
      - GALLERY_DATA=/data/uploads

volumes:
  gallery-data:
