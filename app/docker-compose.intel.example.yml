# Intel GPU (VA-API) + метрики загрузки GPU в UI (intel_gpu_top / fdinfo).
#
# Рекомендуется не копировать руками: при деплое вызывается
#   bash scripts/docker-compose-intel-override-gen.sh
# — подставляет все /dev/dri/card* и renderD*, group_add из getent group video/render,
# cap_add SYS_ADMIN + PERFMON (PMU для intel_gpu_top), sysfs drm.
#
# Ручной режим (если без скрипта): замените 44 и 106 на вывод:
#   getent group video | cut -d: -f3
#   getent group render | cut -d: -f3

services:
  birdlense:
    devices:
      - /dev/dri/card0:/dev/dri/card0
      - /dev/dri/renderD128:/dev/dri/renderD128
    group_add:
      - "44" # video (хост) — подставьте свой GID
      - "106" # render (хост) — подставьте свой GID
    cap_add:
      - SYS_ADMIN
      - PERFMON
    environment:
      - LIBVA_DRIVER_NAME=iHD
    volumes:
      - /sys/class/drm:/sys/class/drm:ro
