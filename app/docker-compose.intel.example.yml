# Intel GPU (VA-API): для кодирования записи на встроенной графике Intel (NUC, Celeron и т.д.)
# Скопируйте в docker-compose.override.yml на хосте с Intel:
#   cp docker-compose.intel.example.yml docker-compose.override.yml
# На хосте: apt install intel-media-va-driver-non-free vainfo; vainfo; ls /dev/dri/
# В настройках Hub: Видео → Кодирование записи: Intel GPU

services:
  birdlense:
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
