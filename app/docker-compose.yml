# BirdLense Hub — web+processor + Redis (кэш API между перезапусками воркера; см. REDIS_URL).
# Подключения по хосту (IP): Go2RTC, MQTT. Площадки могут быть разными.
# Кодирование записи (CPU / Intel GPU) выбирается в Настройках → Видео. Без devices — всегда CPU.
# Intel GPU: см. docker-compose.intel.example.yml → скопировать в docker-compose.override.yml на хосте с Intel.

services:
  redis:
    image: redis:7-alpine
    container_name: birdlense-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  birdlense:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: birdlense
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${BIRDLENSE_PORT:-8085}:8080"
    volumes:
      - ./data:/app/data
      - ./app_config:/app/app_config
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/data
      # Кэш API: Redis (см. services/cache.py). В UI «Производительность» держите включённым (дефолт true). URL переопределяется в .env при внешнем Redis.
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - API_URL_BASE=http://127.0.0.1:8000/api/processor
      - PROCESSOR_SECRET=${PROCESSOR_SECRET:-}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-}
      - BIRDLENSE_ENV=${BIRDLENSE_ENV:-}
      - GO2RTC_URL=${GO2RTC_URL:-}
      - MQTT_BROKER=${MQTT_BROKER:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - MCP_TOKEN=${MCP_TOKEN:-}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/ui/health"]
      interval: 30s
      timeout: 10s
      retries: 3
