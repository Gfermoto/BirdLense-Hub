# BirdLense Hub — web+processor + Redis (кэш API между перезапусками воркера; см. REDIS_URL).
# Подключения по хосту (IP): Go2RTC, MQTT. Площадки могут быть разными.
# Кодирование записи: jetson (NVENC на Orin) или cpu (libx264).

services:
  redis:
    image: redis:7-alpine
    container_name: birdlense-redis
    restart: unless-stopped
    stop_grace_period: 20s
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    mem_limit: 512m
    cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  birdlense:
    build:
      context: ..
      dockerfile: app/Dockerfile.orin
    container_name: birdlense
    shm_size: "1gb"
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${BIRDLENSE_PORT:-8085}:8080"
    volumes:
      - ./data:/app/data
      - ./app_config:/app/app_config
      - ./processor/models/detection/trapper_ai_v02_2024:/app/processor/models/detection/trapper_ai_v02_2024
      - ./processor/models/classification:/app/processor/models/classification
      - ./processor/models/reid/ornimetrics:/app/processor/models/reid/ornimetrics
      - ./processor/models/welfare/ornimetrics:/app/processor/models/welfare/ornimetrics
      - ./processor/models/tracker:/app/processor/models/tracker
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/data
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - API_URL_BASE=http://127.0.0.1:8080/api/processor
      - PROCESSOR_SECRET=${PROCESSOR_SECRET:-}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-}
      - BIRDLENSE_ENV=${BIRDLENSE_ENV:-}
      - BIRDLENSE_PLATFORM=orin
      - BIRDLENSE_INFERENCE_BACKEND=onnxruntime
      - BIRDLENSE_INFERENCE_DEVICE=cuda:0
      - GO2RTC_URL=${GO2RTC_URL:-}
      - MQTT_BROKER=${MQTT_BROKER:-}
      - MQTT_USERNAME=${MQTT_USERNAME:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - MCP_TOKEN=${MCP_TOKEN:-}
      - BIRDLENSE_STRICT_API_AUTH=${BIRDLENSE_STRICT_API_AUTH:-}
      - BIRDLENSE_UI_API_KEY=${BIRDLENSE_UI_API_KEY:-}
      - BIRDLENSE_HIDE_DIRECT_RECORDINGS=${BIRDLENSE_HIDE_DIRECT_RECORDINGS:-}
      - TRUSTED_PROXY=${TRUSTED_PROXY:-}
      - BIRDLENSE_STARTUP_CLEANUP_LEGACY_IMPORT=${BIRDLENSE_STARTUP_CLEANUP_LEGACY_IMPORT:-}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
    runtime: nvidia
    restart: unless-stopped
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "7"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/api/ui/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
