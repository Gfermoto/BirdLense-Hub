# BirdLense Hub — web+processor + Redis (кэш API между перезапусками воркера; см. REDIS_URL).
# Подключения по хосту (IP): Go2RTC, MQTT. Площадки могут быть разными.
# Кодирование записи (CPU / Intel GPU) выбирается в Настройках → Видео. Без override — всегда CPU.
# Intel: при деплое scripts/deploy.sh вызывает scripts/docker-compose-intel-override-gen.sh (DRI + group_add + PERFMON).
# Вручную: см. docker-compose.intel.example.yml.

services:
  # Если в docker logs redis: «Memory overcommit must be enabled» — на Docker-хосте (не в контейнере):
  # bash scripts/host-enable-vm-overcommit-memory.sh
  redis:
    image: redis:7-alpine
    container_name: birdlense-redis
    restart: unless-stopped
    stop_grace_period: 20s
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    mem_limit: 512m
    cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  birdlense:
    build:
      # Контекст — корень репозитория: в образ попадает scripts/export_fusion_training_data.py (fusion export).
      context: ..
      dockerfile: app/Dockerfile
    container_name: birdlense
    # YOLO/OpenCV в процессоре: дефолтный 64 MB /dev/shm даёт лишние warning и реже — артефакты.
    shm_size: "2gb"
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${BIRDLENSE_PORT:-8085}:8080"
    volumes:
      - ./data:/app/data
      - ./app_config:/app/app_config
      # NABirds PT + OpenVINO IR на хосте: переживают recreate/deploy (см. scripts/sync_detector_weights.sh, make sync-models).
      - ./processor/models/detection/weights:/app/processor/models/detection/weights
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/data
      # Кэш API: Redis (см. services/cache.py). В UI «Производительность» держите включённым (дефолт true). URL переопределяется в .env при внешнем Redis.
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - API_URL_BASE=http://127.0.0.1:8000/api/processor
      - PROCESSOR_SECRET=${PROCESSOR_SECRET:-}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-}
      - BIRDLENSE_ENV=${BIRDLENSE_ENV:-}
      - GO2RTC_URL=${GO2RTC_URL:-}
      - MQTT_BROKER=${MQTT_BROKER:-}
      - MQTT_USERNAME=${MQTT_USERNAME:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - MCP_TOKEN=${MCP_TOKEN:-}
      - BIRDLENSE_STRICT_API_AUTH=${BIRDLENSE_STRICT_API_AUTH:-}
      - BIRDLENSE_UI_API_KEY=${BIRDLENSE_UI_API_KEY:-}
      - BIRDLENSE_HIDE_DIRECT_RECORDINGS=${BIRDLENSE_HIDE_DIRECT_RECORDINGS:-}
      - TRUSTED_PROXY=${TRUSTED_PROXY:-}
      - BIRDLENSE_STARTUP_CLEANUP_LEGACY_IMPORT=${BIRDLENSE_STARTUP_CLEANUP_LEGACY_IMPORT:-}
    restart: unless-stopped
    stop_grace_period: 45s
    mem_limit: 4g
    cpus: "4.0"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "7"
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/ui/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
