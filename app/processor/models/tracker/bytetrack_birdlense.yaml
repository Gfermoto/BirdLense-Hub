# BirdLense ByteTrack — единый пресет (live, regen, night, low-FPS substream).
# track_high/new_track должны быть ниже YOLO track(conf): clamp_bytetrack_track_thresholds() в runtime.
# track_buffer масштабируется по FPS: resolve_adaptive_tracker_path() + tracker_adaptive_low_fps_enabled.
# upstream: ultralytics/cfg/trackers/bytetrack.yaml (8.4.x)
tracker_type: bytetrack
track_high_thresh: 0.05
track_low_thresh: 0.025
new_track_thresh: 0.05
track_buffer: 16
match_thresh: 0.60
fuse_score: true
