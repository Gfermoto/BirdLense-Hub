# Пример: Intel iGPU + OpenVINO (скопируйте нужные ключи в user_config.yaml на сервере; сам файл не подхватывается автоматически).
#
# Цель: быстрее, чем OV на CPU; чувствительность к «слабым» OV-scores — через openvino_* (см. default_config.yaml).

# Запись MP4: при сбоях h264_vaapi (битый файл / moov) оставьте encoding: intel, но выключите VA-API только для файла записи:
# video:
#   encoding: intel
#   record_with_vaapi: false
#   capture_backend: auto

processor:
  inference_backend: openvino
  inference_device: "intel:gpu"
  classifier_inference_backend: openvino
  classifier_inference_device: "intel:gpu"
  # Подстройка после наблюдений (ложные птицы / пропуски):
  # openvino_binary_track_ultralytics_conf: 0.04
  # openvino_binary_bird_score_scale: 7.0
  # openvino_min_confidence_binary_bird: null
