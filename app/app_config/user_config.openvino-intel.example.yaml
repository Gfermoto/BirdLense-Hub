# Пример: Intel iGPU + OpenVINO NABirds (скопируйте в user_config.yaml; файл не подхватывается автоматически).
# Калибровка FP: docs/reports/nabirds_fp_forensic_20260520.md — не возвращайте scale 8.5 / conf 0.025.

processor:
  inference_backend: openvino
  inference_device: "intel:gpu"
  openvino_binary_enabled: true
  classifier_inference_backend: openvino
  classifier_inference_device: "intel:gpu"
  models:
    binary: models/detection/weights/best_NABirds.pt
    binary_openvino: models/detection/weights/best_NABirds_openvino_model
  # Дефолты репозитория (2026-05-20 hotfix) — не ослаблять без forensic:
  min_confidence_binary: 0.28
  min_confidence_binary_bird: 0.28
  openvino_min_confidence_binary_bird: 0.28
  openvino_binary_bird_score_scale: 1.0
  openvino_binary_track_ultralytics_conf: 0.12
  binary_track_max_det: 60
