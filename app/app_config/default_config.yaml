# Feeder control: mqtt (Tasmota) | esphome. Relay on for duration_seconds.
# esphome_type: switch (turn_on/turn_off) | button (press — если реле управляется кнопкой/скриптом)
feed:
  source: mqtt
  duration_seconds: 3
  mqtt_topic: "cmnd/bird_feeder/Power"
  esphome_url: "http://feeder.local"
  esphome_switch_id: "bird_feeder"
  esphome_type: switch  # switch | button

# Home Assistant REST API: общий URL и Long-Lived Token для нескольких функций (погода из сущности weather.*,
# весы при integrations.scales.source=homeassistant и т.д.). Переопределение: HA_URL и HA_TOKEN в env.
# url пустой — fallback на устаревшие weather.ha_url / weather.ha_token при апгрейде.
homeassistant:
  url: ""
  token: ""

# Weather: openweather | homeassistant (URL/токен — в homeassistant.* выше; здесь только сущность погоды)
weather:
  source: openweather
  ha_entity_id: "weather.home"

# Readiness / persist funnel SLO (Phase 0 — honest health)
readiness:
  funnel_lookback_hours: 24
  max_fusion_drop_session_rate: 0.35
  max_fp_empty_opencv_rate: 0.35
  min_healthy_persist_rate: 0.30

# Disk↔DB reconcile (Phase 1 — Frigate sync_recordings parity)
reconcile:
  auto_run_enabled: true
  startup_delay_seconds: 30
  auto_run_interval_hours: 24
  # Auto-purge disk sessions without Video row (reconcile policy; protect_favorites respected)
  purge_orphan_disk_enabled: true
  purge_orphan_disk_limit: 500
  # Remove Video rows whose file is missing/unreadable
  purge_broken_db_rows_enabled: true
  purge_broken_db_rows_limit: 100
  # When true: reconcile logs would-delete counts/paths but skips disk/DB purge
  purge_dry_run: false
  # Grace before orphan purge / scan import (active recordings protection)
  orphan_purge_grace_minutes: 15
  orphan_purge_min_bytes: 512
  scan_import_grace_minutes: 15
  scan_import_min_bytes: 512

# Retention
retention:
  days: 90
  # max_gb: 50
  # Лимит каталога recordings (GB); cascade удаляет старейшие Video до порога.
  # max_deletes_per_run — за один auto-run или POST: не более N сессий (старейшие / просроченные).
  max_deletes_per_run: 500
  auto_run_enabled: false
  auto_run_interval_hours: 6

  # Режим работы (cascade = текущее поведение, files_only = только файлы + пометка deleted_at, disabled = выключить)
  mode: cascade

  # Раздельные TTL (0 = выкл)
  dataset_max_age_days: 0       # TTL для data/dataset/** (по mtime файлов)
  migration_max_age_days: 0    # TTL для SpeciesVisit (по start_time)

  # Безопасность: не трогать Video с favorite=true (переключатель на странице записи). В files_only
  # также не удалять файлы из каталога такой записи; legacy — пропуск файлов, в имени есть «favorite».
  protect_favorites: true
  min_age_hours: 1             # Grace period: не трогать свежее N часов
  batch_size: 50                  # Макс. записей за один вызов API
  runtime_metrics_days: 14
  detector_health_days: 30
  runtime_metrics_maintenance_interval_minutes: 60
  runtime_metrics_vacuum_interval_hours: 12
  runtime_metrics_analyze_enabled: true

# Notifications (Telegram)
# TODO: корм за Stars — sendInvoice / paid broadcast для кнопки «Выдать корм»
notifications:
  telegram_bot_token: ""       # @BotFather → /newbot
  telegram_chat_id: ""        # ID чата или канала (например -1001234567890)
  base_url: ""                # URL Hub для ссылок (http://birdlense.local:8085)
  telegram_api_base: ""       # Пусто = api.telegram.org. Прокси/альтернатива: https://your-proxy/bot
  # Тип прокси: none | socks_http | mtproto (как в приложении Telegram: сервер/порт/секрет).
  telegram_proxy_type: socks_http
  # При socks_http — SOCKS5h или HTTP(S) для HTTPS-запросов к api.telegram.org
  telegram_proxy_url: ""      # socks5h://127.0.0.1:9050 или http://127.0.0.1:8118
  # При mtproto — отдельные поля + telegram_api_id / telegram_api_hash (my.telegram.org)
  telegram_mtproto_host: ""
  telegram_mtproto_port: 443
  telegram_mtproto_secret: ""  # hex из приложения (ee/dd…); маскируется в API
  telegram_api_id: 0           # целое, или env TELEGRAM_API_ID
  telegram_api_hash: ""       # строка, или env TELEGRAM_API_HASH
  telegram_timeout: 300      # Таймаут сек (в РФ блокировки — ставить 300+). Текст: timeout/2
  telegram_retries: 5        # Повторы при таймауте/сетевой ошибке
  compress_photo_over_kb: 400 # Сжимать фото >N KB для ускорения (0=выкл)
  telegram_max_side_px: 1024 # Макс. сторона в пикселях (0=не менять). Кропы уменьшаются — чаще доходят в РФ
  message_thread_id: ""       # ID топика в канале (если канал с форумом)
  disable_notification: false # Тихие сообщения (без звука). В multipart шлём true/false для совместимости
  protect_content: false      # Запретить пересылку и сохранение
  link_preview_large: false  # true: большие превью ссылок (prefer_large_media), ссылка в тексте
  send_photo: true           # false: только текст, без фото (даже при processor.save_images)
  use_custom_emoji: false   # true: icon_custom_emoji_id на кнопках (требует Premium у владельца бота)
  custom_emoji_id_bird: ""  # ID кастомного эмодзи для птиц (из @Stickers или сообщения)
  custom_emoji_id_chipmunk: ""
  custom_emoji_id_open_live: ""
  paid_media_view_star_count: 0    # Stars за просмотр фото (0=бесплатно, 1-25000)
  paid_media_forward_star_count: 0  # Stars за пересылку/копирование (0=разрешить, >0=запретить при бесплатном просмотре)
  smart_alert_rare_species_only: false
  smart_alert_first_profile_sighting: false
  smart_alert_rare_species_list: []

# Web Push: push-уведомления в браузере (дополнение к Telegram)
web_push:
  enabled: false
  vapid_public_key: ""
  vapid_private_key: ""

# Webhook: POST при каждой детекции (IFTTT, Zapier, свои скрипты)
webhook:
  url: ""  # например https://maker.ifttt.com/trigger/bird_detected/with/key/xxx

# Весы у кормушки: MQTT-топики прошивки или прямой ESPHome Web API.
integrations:
  birdnet:
    mqtt_topic: "birdnet"
  scales:
    enabled: false
    source: mqtt  # mqtt | esphome
    # Топик веса (полный путь). Если пусто, но задан mqtt_topic_prefix — вес: {prefix}/weight
    mqtt_topic: ""
    # Полный топик bird_present (ON/OFF). Если пусто — {mqtt_topic_prefix}/bird_present при непустом префиксе
    mqtt_bird_present_topic: ""
    # Префикс ESPHome/своей прошивки: вес {prefix}/weight, птица {prefix}/bird_present, команда тары {prefix}/command
    mqtt_topic_prefix: "birdlense/scale"
    # Явный топик команды (тара). Пусто = {mqtt_topic_prefix}/command при непустом префиксе
    mqtt_command_topic: ""
    # Payload для POST /api/ui/feed/scale-tare (устройство должно подписаться на command topic)
    mqtt_tare_payload: "TARE"
    # ESPHome Web API (прямой HTTP к устройству): сенсор веса, binary_sensor присутствия, button тары
    esphome_url: ""
    esphome_weight_sensor_id: "weight_live_internal"
    esphome_bird_present_sensor_id: "bird_present"
    esphome_tare_button_id: "manual_tare"
    # Legacy HA sensor id key used by feeder_scale fallback path.
    homeassistant_entity_id: ""
    unit: g
    # Журнал MQTT-показаний (JSONL) и оценка дельты за интервал записи (#167).
    # Работает только для mqtt, не для прямого ESPHome API.
    weight_estimate_enabled: true
    min_delta_kg_for_estimate: 0.008  # игнорировать шум меньше ~8 г
    # Оценка на ролик только если между двумя соседними по времени MQTT-точками был скачок >= порога
    estimate_require_consecutive_spike: true
    history_max_lines: 10000
    # Триггер записи + конвейер YOLO: скачок веса на MQTT (параллельно с Frigate в OrMotion)
    motion_trigger_enabled: false
    motion_trigger_min_delta_kg: 0.02  # |Δ| между двумя подряд MQTT-сэмплами, кг
    motion_trigger_debounce_seconds: 1.5

# Кэш API: Redis из docker-compose; URL можно задать в UI (перекрывает REDIS_URL). Выключать без веской причины не стоит.
performance:
  cache_redis_enabled: true
  redis_url: ""  # непусто — использовать вместо REDIS_URL; секрет — маскируется в API

# UI: порог confidence для списка «Неизвестные» (детекции ниже — для ручной проверки)
ui:
  unknown_confidence_threshold: 0.48  # чуть строже отбор в «Неизвестные» при новых порогах детектора
  # Live overlay freshness and near-realtime tick.
  live_detector_overlay_ttl_seconds: 1.0
  live_overlay_tick_seconds: 0.12
  live_overlay_track_ttl_seconds: 0.35
  # Frigate MQTT bbox fallback для live overlay когда YOLO без трека (сек).
  frigate_live_bbox_max_age_seconds: 2.5
  # Optional safety fallback for temporary overlay gaps (strict TTL).
  live_overlay_trace_fallback_enabled: false
  live_overlay_trace_fallback_ttl_seconds: 1.5

# MCP (Model Context Protocol) — внешние ИИ-ассистенты / MCP-хосты вызывают инструменты хаба по токену (см. docs/MCP_SETUP)
mcp:
  enabled: false
  # Токен для доступа. Пусто — без защиты. Рекомендуется для продакшена.
  # Env MCP_TOKEN переопределяет (для хранения секрета вне конфига).
  token: ""
  # API URL для MCP-клиента. В контейнере: http://127.0.0.1:8000/api/ui
  # api_url: ""  # пусто = авто (127.0.0.1:8000 в Docker, иначе из env BIRDLENSE_API_URL)

# eBird export — для формата eBird Record (импорт в eBird.org)
ebird:
  country: "US"       # 2-char code (US, RU, etc.)
  state: ""           # 1–3 chars (NY, CA, MOS для Московской обл., etc.)
  location_name: "BirdLense Feeder"
  protocol: "Stationary"  # Stationary | Traveling | Incidental | Historical
  # Необязательные eBird-специфичные переопределения имён (сверх detection.species_mapping).
  # Гармонизация Gray/Grey и «Scientific (Common)» → общее имя уже в detection.species_mapping.
  species_mapping: {}

# Зеркалирование записей на SFTP (NAS): после сохранения сессии процессор копирует каталог на сервер.
# Пути в БД остаются локальными (data/recordings/...); веб по-прежнему читает файлы с диска хаба.
# Пароль и пасфраза ключа задаются в UI (Библиотека → Хранилище) или в user_config; в API маскируются.
# Опционально: BIRDLENSE_RECORDINGS_MIRROR_SFTP_* в env перекрывают YAML в рантайме. Альтернатива без SFTP: смонтировать NAS в DATA_DIR.
storage:
  recordings_mirror:
    enabled: false
    protocol: sftp
    host: ""
    port: 22
    username: ""
    sftp_password: ""
    sftp_key_passphrase: ""
    remote_base_path: "/birdlense/recordings"
    ssh_private_key_path: ""
    max_concurrent_uploads: 2
    upload_retries: 3
    retry_backoff_seconds: 5
    strict_host_key: true
    known_hosts_path: ""
    delete_local_after_success: false

# Каталог видов: Birder EU (707 птиц) + Rodent (детектор Trapper, без классификатора).
species:
  # true: follow active classifier engine path (Birder EU => class_labels.txt).
  catalog_allowlist_follow_classifier_engine: true
  # Каталог: scope=project (по умолчанию) = классификатор + арбитраж (species_mapping, registry).
  # scope=allowlist = только id2label активного классификатора (707+Rodent).
  catalog_allowlist_use_active_classifier: true
  catalog_allowlist_file: "models/classification/weights/convnext_v2_tiny_eu-common256px_openvino_model/class_labels.txt"
  # Явный доп. файл (опционально); catalog_allowlist_file при follow_engine НЕ подмешивается автоматически.
  # catalog_allowlist_supplement_file: "models/classification/weights/class_names.txt"
  # Вне class_labels.txt; materialize + strict ingest (белка → Rodent).
  catalog_allowlist_extra:
    - Rodent
  # true: детекции вне allowlist → Unknown, новые строки каталога не создаются.
  catalog_strict_ingest: true
  # Optional UI/catalog hygiene filter: hide observed species outside allowlist.
  # Keep false to avoid dropping valid species due naming mismatches.
  catalog_filter_off_allowlist: false
  # Probe Xeno-canto sample in coverage snapshot (slow; off by default).
  catalog_probe_audio_on_coverage: false
  tuning_target_species_ids: []

# R&D / feature flags
experimental:
  # ROI-only super-resolution pilot (#472): affects small classification crops, not full frame.
  sr_enabled: false
  # fsrcnn_x2 | realesrgan_x2
  sr_model: "fsrcnn_x2"
  # 2..4
  sr_scale: 2
  # apply only to small crops in this short-side range (px)
  sr_min_crop_px: 10
  sr_max_crop_px: 96
  # warning budget per crop
  sr_max_latency_ms: 20
  # Auto mine hard examples after processor video ingest.
  active_learning_auto_mine_enabled: true
  active_learning_auto_mine_lookback_hours: 6
  active_learning_auto_mine_max_rows: 200
  active_learning_blind_score_threshold: 0.5
  active_learning_fallback_ratio_threshold: 0.35
  active_learning_conf_min: 0.20
  active_learning_conf_max: 0.35

active_learning:
  enabled: true

# Secrets - use env vars: OPENWEATHER_API_KEY, MQTT_PASSWORD, HA_TOKEN
secrets:
  openweather_api_key: ""
  xeno_canto_api_key: ""  # Xeno-canto API v3 key for bird song playback (xeno-canto.org/account)
  ebird_api_key: ""       # eBird API key for regional comparison (ebird.org/api/keygen)
  latitude: "39.8283"
  longitude: "-98.5795"
