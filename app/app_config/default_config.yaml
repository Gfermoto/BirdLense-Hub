general:
  # Поток видео в UI (/api/ui/videos/:id/stream): false — гости могут смотреть (см. ACCESS_CONTROL Viewer).
  # true — только Contributor/Admin (старое поведение).
  require_auth_for_video_stream: false
  enable_notifications: false
  notification_excluded_species: []
  # Пароль для доступа к настройкам (Admin). Пусто — без пароля.
  # Хранится в открытом виде. Для продакшена рассмотрите хеширование.
  settings_password: ""
  # Пароль помощника (Contributor): коррекция видов, отчёты, iNaturalist. Пусто — один пароль на всё.
  contributor_password: ""
  # Сброс сессии входа (admin/contributor) после N минут без запросов к API. 0 — выключено.
  # Включается при непустом admin/contributor пароле или в production (см. SECURITY).
  session_idle_minutes: 30
  # Ссылка на установку BirdNET (BirdNET-Pi, BirdNET-Go). Пусто — иконка BirdNET не показывается.
  birdnet_url: ""
  # Ссылка на донаты: задаётся в Настройках → Общие; в UI только иконка-сердце в шапке. Пусто — скрыто.
  donate_url: ""

# Video/Audio processor settings
# Важно: user_config.yaml мержится с дефолтами рекурсивно (merge_dicts): заданные ключи
# переопределяют вложенные значения на всех уровнях; отсутствующие ключи берутся из default.
processor:
  tracker: "bytetrack.yaml"
  max_record_seconds: 60
  # video.source=file: нижняя граница max_record_seconds (сек). Большое значение при playlist+split по файлам — не резать длинный клип по таймеру.
  file_max_record_floor_seconds: 86400
  max_inactive_seconds: 12
  # Post-roll: доп. секунды к «тишине» перед остановкой записи (#157). Итог = max_inactive_seconds + post_record_seconds.
  post_record_seconds: 3
  # Мин. пауза после окончания записи до следующего старта (сек). 0 = выкл.
  # Уменьшает почти совпадающие по времени дубли-клипы при Frigate+OpenCV или объекте, всё ещё в кадре.
  min_seconds_between_recordings: 8
  # Свежее подтверждение Frigate держит клип «живым» ещё N сек, даже если YOLO на паре кадров молчит.
  # Помогает не обрывать ролик, пока объект ещё реально в кадре.
  frigate_activity_hold_seconds: 6
  # Мин. длительность трека ByteTrack (сек). Короткие визиты (белка) — 0.9–1.0; при шуме поднимите.
  min_track_duration: 0.9
  # Шаг кадров для batch-перегенерации треков: 1=каждый кадр (точно, медленно), 6+=быстро.
  # Между обрабатываемыми кадрами декодирование не делается (OpenCV grab), иначе ускорения почти нет.
  track_regen_frame_step: 6
  # Отдельная стратегия детекции для batch-перегенерации треков (только two_stage: binary .pt + classifier .pt).
  track_regen_detection_strategy: two_stage
  # Размер кадра для batch-перегенерации треков (px). Меньше = быстрее, но грубее bbox.
  track_regen_lores_px: 512
  # Таймаут на одно видео при batch-перегенерации треков (сек): защита от «зависшего» файла.
  track_regen_video_timeout_sec: 300
  # Отдельный таймаут для точного fallback-прохода: не даём одному ролику блокировать весь recovery.
  track_regen_precise_timeout_sec: 420
  # Точный fallback-проход (другой lores/frame_step/min_center_dist); стратегия та же — two_stage.
  track_regen_precise_detection_strategy: two_stage
  # Для recovery fallback допускаем птиц ближе к краям кадра, иначе feeder-side perches теряются.
  track_regen_precise_min_center_dist: 0.02
  # При перегенерации не сужать YOLO/классификатор по processor.regional_species
  # (иначе пропадают виды вне списка — типично EU-синицы при US-ориентированном регионе).
  track_regen_ignore_regional_species: true
  # Размер lores для live/file-плейлиста и процессора (640 = прежнее поведение).
  inference_lores_px: 640
  # Перегенерация треков: как live-пайплайн — тот же lores (inference_lores_px), каждый кадр,
  # без обнуления regional_species и без remap детекций по «локальному» scope (#263).
  track_regen_match_live_pipeline: false
  # При ручной коррекции на ролике: не отбрасывать авто-детекции, пересекающиеся по времени
  # с ручными строками (например Bird рядом с исправленной сорокой) — появятся параллельные
  # VideoSpecies с frames/оверлеем; виды потом можно поправить. false — прежнее «без конфликтов».
  track_regen_parallel_auto_with_manual: false
  # Дефолты: строже по мусору в TG, мягче по белкам (Rodent override ниже).
  min_confidence_binary: 0.28  # Детектор «птица/не птица»; ниже — больше ложных bbox
  # Раздельные пороги после YOLO track (движок получает min(...); фильтр по метке в Python).
  min_confidence_binary_bird: 0.46
  min_confidence_binary_squirrel: 0.24
  # Доля площади кадра (0..1): Bird с bbox ≤ порога — без видового классификатора. 0 — выкл.
  bird_skip_classifier_max_area_frac: 0.018
  min_confidence_to_process: 0.38  # Классификатор (combined); запись/БД
  # Отдельный порог для Telegram: только уверенные визиты (может быть > min_confidence_to_process).
  min_confidence_to_notify: 0.46
  # Перед YOLO: отсечь совсем тёмные кадры. На ИК/сумерках контраст часто < 20 — YOLO не зовётся.
  light_gate_enabled: true
  light_gate_min_brightness: 20
  light_gate_min_contrast: 14
  # Пороги по видам (редкие — ниже). Ключ: имя вида, значение: порог (0.0–1.0)
  species_confidence_overrides: {}  # напр. {"Rodent": 0.28}; пустой {} в user_config не затирает кодовый порог для белок
  # Авто-пороги для видов из регионального топа eBird (#128). Ручные ключи в species_confidence_overrides важнее.
  ebird_regional_top_auto_confidence: true
  # Вычитается из min_confidence_to_process для каждого вида из топа (после detection.species_mapping)
  ebird_regional_top_confidence_delta: 0.03
  # Нижняя граница авто-порога (не ниже)
  ebird_regional_top_confidence_floor: 0.08
  # BirdNET MQTT: confidence-only bias для классификатора по недавним аудио-событиям (#129).
  # BirdNET не создаёт финальный label и не мержится в video detections напрямую.
  # Legacy-layer: сейчас это ещё threshold bias, но под ним уже может жить rolling audio prior.
  birdnet_mqtt_auto_confidence: false
  birdnet_mqtt_bias_delta: 0.05
  birdnet_mqtt_bias_floor: 0.05
  # Rolling BirdNET prior: события копятся в окне 24h, не сбрасываются разом,
  # а вытесняются по TTL 25h с time-decay по свежести.
  birdnet_mqtt_prior_window_hours: 24
  # Backward-compat alias (deprecated): old installs may still send this key in user_config;
  # interpreted as seconds and converted to hours in processor.
  birdnet_mqtt_bias_window_seconds: 0
  birdnet_mqtt_prior_ttl_hours: 25
  birdnet_mqtt_prior_half_life_hours: 6
  birdnet_mqtt_prior_min_confidence: 0.0
  # Слияние BirdNET ↔ видео: каноническое имя из hub SQLite (species_taxon.scientific_name → common_name;
  # иначе species_alias). Локаль подписи в MQTT (RU/EN) не важна, если есть ScientificName или алиас.
  # При hub на PostgreSQL без общего SQLite — только detection.species_mapping + normalize.
  # BirdNET observability logs for FIFO/parse reasons: off | info | debug.
  # - info: only decision/prune reasons
  # - debug: +accepted ingest and prior-window summaries
  birdnet_mqtt_observability_level: info
  # Emergency switch: keep level=info but also print debug-level BirdNET reason logs.
  birdnet_mqtt_observability_debug: false
  # Снимок FIFO BirdNET на диск (data/diagnostics/) для UI: процессор и веб — разные процессы.
  birdnet_fifo_snapshot_enabled: true
  birdnet_fifo_snapshot_interval_sec: 3
  birdnet_fifo_snapshot_recent_limit: 80
  # GET /api/ui/system/diagnostics/birdnet-fifo считает снимок устаревшим, если файл старше (сек).
  birdnet_fifo_snapshot_stale_sec: 180
  # Окно «услышан сейчас» в снимке FIFO (UI): active=1 если последнее MQTT по виду новее N часов.
  birdnet_fifo_hearing_active_hours: 24
  # Очередь BirdNET в hub SQLite (data/db/birdlense.db): переживает рестарт процессора (#269).
  birdnet_fifo_persist_enabled: true
  birdnet_fifo_sqlite_busy_ms: 30000
  # Несколько камер Frigate на одной локации: если один вид с 2+ камер из группы — прибавка к confidence (#153)
  multi_camera_groups: []  # например: [["BirdBox","Forest"]]
  multi_camera_confidence_boost: 0.03
  spectrogram_px_per_sec: 200
  # true — спектрограмма после каждой записи (FFmpeg+librosa). false — только если в окне записи было событие BirdNET MQTT.
  generate_spectrogram_always: true
  # regional_species: [] — без локального сужения classifier scope; YOLO использует все классы
  regional_species: []
  # Scope детектора первого уровня. Production path: detector(Bird|Squirrel) -> classifier -> fusion.
  detector_scope: ["Bird", "Squirrel"]
  # Планировщик классификации species внутри кадра: priority | round_robin.
  classification_scheduler: priority
  max_classifications_per_frame: 3
  max_blur_checks: 3
  blur_threshold: 100.0
  # Центр bbox не ближе этого расстояния к краю кадра (норм. координаты 0..1).
  # Для мелких птиц у кромки кормушки снижайте до 0.03-0.05.
  min_center_dist: 0.04
  # Размер кадра для binary YOLO detector (imgsz). Для мелких птиц лучше 640.
  binary_imgsz: 640
  # Small boxes on feeder scenes are often debris or motion noise.
  min_box_size_px: 56
  # Generic Bird: когда классификатор не дотягивает, но есть уверенный «Bird», не гоним всё в ручной review.
  generic_bird_min_detector_conf: 0.42
  generic_bird_min_frames: 2
  generic_bird_min_area_frac: 0.008
  generic_bird_min_best_frame_score: 6.0
  key_frame_limit: 3
  # Если классификатор ниже порога, но detector подтвердил target — сохранить generic detector label.
  # Bird fallback может быть затем promoted Frigate, если есть уверенный sub_label/label в окне ролика.
  classifier_fallback_bird: true
  # Устарело: single_stage / NCNN не используются в runtime и track regen (оставлено для совместимости чтения конфига).
  single_stage_coco_animals_only_auto: true
  included_bird_families:
    - "Perching Birds"
    - "Pigeons and Doves"
    - "Woodpeckers"
  save_images: false
  # Сохранять best_frame в data/dataset/train/<Species>/ для экспорта и дообучения (по умолчанию выкл. — не раздувать диск)
  save_dataset_crops: false
  dataset_min_confidence: 0.58
  # video.source=file: оставить папку сессии с записанным mp4 при 0 детекций (без create_video / кропов из пайплайна)
  keep_recording_when_no_detections: false
  detection_strategy: "two_stage"
  models:
    # Production: только binary + classifier (.pt). single_stage в коде не подключается.
    single_stage: "yolo11n.pt"
    binary: "models/detection/weights/best.pt"
    classifier: "models/classification/weights/best.pt"

# Video source: go2rtc | file
video:
  source: go2rtc
  # Для тестового режима source=file: абсолютный путь к mp4.
  file_path: ""
  # Для тестового режима source=file: если file_path пуст, используется плейлист из всех видео в папке.
  # В Docker смонтирован только /app/data — путь /workspace/datasets не существует без доп. volume.
  file_dir: "/app/data/file_test"
  # Для тестового режима source=file: зациклить файл (true) или остановиться в конце (false).
  file_loop: false
  # Максимум МиБ на один файл при upload через Hub (Library → офлайн-прогон). По умолчанию 10240 (>10000); в коде зажато 64..65536. Прокси (nginx client_max_body_size) может отдать 413 раньше приложения.
  file_test_max_upload_mb: 10240
  # true — имитировать realtime (пропуск кадров по elapsed), false — кадр за кадром для дебага.
  file_realtime_simulation: false
  # Хост Go2RTC: http://IP:1984
  go2rtc_url: ""
  go2rtc_username: ""
  go2rtc_password: ""
  # Кодирование записи: cpu | intel (встроенная видеокарта Intel — VA-API)
  encoding: cpu
  # Запись с RTSP: h264 — перекодировать в H.264 (воспроизведение в браузере, меньше сюрпризов с HEVC).
  # copy — без перекодирования (ниже CPU; если поток HEVC, в Chrome может быть «Не удалось загрузить видео»).
  record_stream_codec: h264
  # Камеры — добавлять по одной. stream_name = имя потока в Go2RTC.
  cameras: []
  # Пример после добавления:
  # cameras:
  #   - id: BirdBox
  #     stream_name: BirdBox
  #     name: "Кормушка"
  pre_record_seconds: 5
  auto_reconnect: true
  video_width: 1280
  video_height: 720

# Legacy motion fields. New UI/runtime prefer grouped `triggers.*`, but these keys stay as
# backward-compatible fallback for old user_config.yaml and transition logic.
# Motion trigger: opencv | frigate | mqtt | esphome
# opencv - analyze every frame; frigate - Frigate MQTT events; mqtt - binary sensor topic; esphome - ESPHome binary sensor
motion:
  source: opencv
  # Проверять движение раз в N кадров (1 = каждый кадр, 3 = каждый 3-й). Снижает нагрузку на CPU при высоком FPS.
  check_every_n_frames: 1
  # OpenCV (параллельно Frigate или как основной источник): чувствительность к мелкому движению (птица вдали).
  opencv_diff_threshold: 18
  opencv_min_contour_area: 240
  frigate_camera_filter: []  # from cameras list; frigate/events
  # bird/animal — базовые модели; jay/corvid — частые кастомные/семейные метки Frigate+YOLO.
  # Пустой filter = любая метка (шумнее); геометрия в after/snapshot всё равно подхватывается при frigate_trigger_on_tracked_object.
  frigate_label_filter: ["bird", "Bird", "jay", "Jay", "corvid", "Corvid", "squirrel", "Squirrel", "animal", "Animal"]
  # Не подмешивать в merge как вид; запись по Frigate всё равно может стартовать по box/region.
  frigate_label_exclude: ["cat", "dog"]
  # Если label не попал в filter, но в after есть box/region — всё равно старт записи (Frigate уже трекает объект).
  frigate_trigger_on_tracked_object: true
  # Мин. top_score Frigate для старта записи по событию events. 0 = как раньше, без порога.
  # Позволяет отсечь слабые/шумовые события до запуска клипа.
  frigate_min_trigger_score: 0.50
  mqtt_topic: ""  # e.g. stat/bird_pir/STATE for Tasmota PIR
  esphome_url: ""
  esphome_sensor_id: ""  # binary_sensor id in ESPHome (YAML: id: bird_pir)

# Grouped trigger model: user can enable any combination of sources.
triggers:
  opencv:
    enabled: true
    check_every_n_frames: 1
    diff_threshold: 18
    min_contour_area: 240
  frigate:
    enabled: false
    topic: "frigate/events"
  motion_sensor:
    enabled: false
    source: mqtt  # mqtt | esphome
    mqtt_topic: ""
    esphome_url: ""
    esphome_sensor_id: ""
  scales:
    enabled: false
    source: mqtt  # mqtt | esphome
    motion_trigger_min_delta_kg: 0.02
    motion_trigger_debounce_seconds: 1.5

# MQTT - Frigate and BirdNET (confirmations)
mqtt:
  broker: ""
  port: 1883
  username: ""
  password: ""
  frigate_topic: "frigate/events"
  birdnet_topic: "birdnet"  # BirdNET-Go/Pi публикует сюда
  publish_topic: "birdlense/detections"
  reconnect_min_delay: 5  # сек; стартовый backoff при потере связи
  reconnect_max_delay: 300  # сек; потолок backoff
  # Home Assistant MQTT Autodiscovery — публикация config и state для автообнаружения
  ha_discovery: true

# Detection fusion (detector/classifier + Frigate promotion)
detection:
  merge_window_seconds: 6
  dedup_window_seconds: 60
  # Гарантированно один результат на вид (устраняет дубликаты к одному посещению)
  one_per_species: true
  # Generic «Bird» + тот же ролик с уверенным видом (YOLO classifier / accepted_species) → один результат
  absorb_generic_bird: true
  absorb_generic_bird_overlap_min_sec: 0.1
  absorb_generic_bird_min_classifier_confidence: 0.24
  # При конфликте разных sources: YOLO track остаётся primary, Frigate помогает promotion/boost.
  source_priority: ["yolo", "frigate"]
  # При первом совпадении YOLO track и Frigate species в окне ролика — разово +bonus к confidence (потолок 1.0)
  cross_source_confidence_bonus: 0.02
  # Ниже порога детекция отбрасывается после fusion; держите чуть ниже processor.min_confidence_to_process
  min_confidence_to_store: 0.34
  # Если YOLO/ByteTrack не дали ни одного принятого трека, но в окне записи есть Frigate MQTT —
  # создать финальную детекцию по Frigate (клип не удаляется «пустым»). Ручная разметка в UI при ложняках.
  frigate_standalone_when_no_yolo: true
  # Мин. top_score Frigate для обычных лейблов (птица и т.д.). Ниже — мягче, больше записей в БД.
  frigate_standalone_min_score: 0.48
  # Если score в MQTT = 0 (часто snapshot), подставить для standalone; 0 = не подставлять.
  frigate_standalone_missing_score_fallback: 0.72
  # Лейблы из motion.frigate_label_exclude (cat/dog): только БД, без merge в YOLO и без Telegram.
  frigate_standalone_excluded_min_score: 0.0
  frigate_standalone_excluded_missing_score_fallback: 0.58
  # false — standalone-визиты в БД без фото в Telegram (min_confidence_to_notify всё равно для остальных).
  frigate_standalone_notify: true
  # Learned fusion: optional learned scorer to blend multimodal signals and produce
  # a calibrated confidence. Disabled by default for safety.
  use_learned_fusion: false
  fusion_model_path: ""  # optional path to serialized PyTorch model for fusion scorer
  fusion_alpha: 0.6      # blend weight for learned score (alpha * learned + (1-alpha) * base)
  # Варианты -> каноническое (Common name). Слияние в один вид для проекта.
  species_mapping:
    "Garrulus glandarius (Eurasian Jay)": "Eurasian Jay"
    "Eurasian_Jay": "Eurasian Jay"
    "Parus major (Great Tit)": "Great Tit"
    "Great_Tit": "Great Tit"
    "Cyanistes caeruleus (Eurasian Blue Tit)": "Eurasian Blue Tit"
    "Eurasian_Blue_Tit": "Eurasian Blue Tit"
    "Parus ater (Coal Tit)": "Coal Tit"
    "Passer domesticus (House Sparrow)": "House Sparrow"
    "Sitta europaea (Eurasian Nuthatch)": "Eurasian Nuthatch"
    "Fringilla coelebs (Common Chaffinch)": "Common Chaffinch"
    "Erithacus rubecula (European Robin)": "European Robin"
    "Carduelis carduelis (European Goldfinch)": "European Goldfinch"
    "Dendrocopos major (Great Spotted Woodpecker)": "Great Spotted Woodpecker"
    "Columba palumbus (Common Wood Pigeon)": "Common Wood Pigeon"
    "Streptopelia decaocto (Eurasian Collared-Dove)": "Eurasian Collared-Dove"
    "Pica pica (Eurasian Magpie)": "Eurasian Magpie"
    "Corvus corone (Carrion Crow)": "Carrion Crow"
    "Tetrastes bonasia (Hazel Grouse)": "Hazel Grouse"
    "Hazel_Grouse": "Hazel Grouse"
    "Rodent": "Rodent"
    "Corvus cornix (Hooded Crow)": "Hooded Crow"
    "Corvus_cornix": "Hooded Crow"
    "Hooded_Crow": "Hooded Crow"
    "Corvus frugilegus (Rook)": "Rook"
    "Turdus merula (Common Blackbird)": "Common Blackbird"
    "Aegithalos caudatus (Long-tailed Tit)": "Long-tailed Tit"
    "Poecile palustris (Marsh Tit)": "Marsh Tit"
    "Poecile montanus (Willow Tit)": "Willow Tit"
    "Certhia familiaris (Eurasian Treecreeper)": "Eurasian Treecreeper"
    "Pyrrhula pyrrhula (Eurasian Bullfinch)": "Eurasian Bullfinch"
    "Chloris chloris (European Greenfinch)": "European Greenfinch"
    "Linaria cannabina (Common Linnet)": "Common Linnet"
    "Fringilla montifringilla (Brambling)": "Brambling"
    "Sturnus vulgaris (Common Starling)": "Common Starling"
    # BirdNET RU / локализованные MQTT: канон по научному имени (совпадает с YOLO/IOC EN)
    "Turdus iliacus (Redwing)": "Redwing"
    "Scolopax rusticola (Eurasian Woodcock)": "Eurasian Woodcock"
    "Rallus aquaticus (Water Rail)": "Water Rail"
    "Ixobrychus minutus (Little Bittern)": "Little Bittern"
    "Cuculus optatus (Oriental Cuckoo)": "Oriental Cuckoo"
    "Turdus viscivorus (Mistle Thrush)": "Mistle Thrush"
    "Anas platyrhynchos (Mallard)": "Mallard"
    "Cygnus cygnus (Whooper Swan)": "Whooper Swan"
    "Prunella modularis (Dunnock)": "Dunnock"
    "Ficedula parva (Red-breasted Flycatcher)": "Red-breasted Flycatcher"
    "Oriolus oriolus (Eurasian Golden Oriole)": "Eurasian Golden Oriole"
    "Hieraaetus pennatus (Booted Eagle)": "Booted Eagle"
    "Turdus pilaris (Fieldfare)": "Fieldfare"
    "Coracias garrulus (European Roller)": "European Roller"
    "Curruca curruca (Lesser Whitethroat)": "Lesser Whitethroat"
    "Bubo bubo (Eurasian Eagle-Owl)": "Eurasian Eagle-Owl"
    "Tringa ochropus (Green Sandpiper)": "Green Sandpiper"
    "Spinus spinus (Eurasian Siskin)": "Eurasian Siskin"
    # Gray/Grey harmonization (US/eBird vs UK/EU naming)
    "Gray-headed Woodpecker": "Grey-headed Woodpecker"
    "Grey-headed Woodpecker": "Grey-headed Woodpecker"
    "Great Gray Shrike": "Great Grey Shrike"
    "Great Grey Shrike": "Great Grey Shrike"
    # Squirrel/rodent: detector class → catalog name
    "squirrel": "Rodent"
    "Squirrel": "Rodent"
    "Eastern Gray Squirrel": "Rodent"
    "Red Squirrel": "Rodent"
    "Eurasian Red Squirrel": "Rodent"

# Feeder control: mqtt (Tasmota) | esphome. Relay on for duration_seconds.
# esphome_type: switch (turn_on/turn_off) | button (press — если реле управляется кнопкой/скриптом)
feed:
  source: mqtt
  duration_seconds: 3
  mqtt_topic: "cmnd/bird_feeder/Power"
  esphome_url: "http://feeder.local"
  esphome_switch_id: "bird_feeder"
  esphome_type: switch  # switch | button

# Home Assistant REST API: общий URL и Long-Lived Token для нескольких функций (погода из сущности weather.*,
# весы при integrations.scales.source=homeassistant и т.д.). Переопределение: HA_URL и HA_TOKEN в env.
# url пустой — fallback на устаревшие weather.ha_url / weather.ha_token при апгрейде.
homeassistant:
  url: ""
  token: ""

# Weather: openweather | homeassistant (URL/токен — в homeassistant.* выше; здесь только сущность погоды)
weather:
  source: openweather
  ha_entity_id: "weather.home"

# Retention
retention:
  days: 90
  # max_gb: 50

# Notifications (Telegram)
# TODO: корм за Stars — sendInvoice / paid broadcast для кнопки «Выдать корм»
notifications:
  telegram_bot_token: ""       # @BotFather → /newbot
  telegram_chat_id: ""        # ID чата или канала (например -1001234567890)
  base_url: ""                # URL Hub для ссылок (http://birdlense.local:8085)
  telegram_api_base: ""       # Пусто = api.telegram.org. Прокси/альтернатива: https://your-proxy/bot
  # Тип прокси: none | socks_http | mtproto (как в приложении Telegram: сервер/порт/секрет).
  telegram_proxy_type: socks_http
  # При socks_http — SOCKS5h или HTTP(S) для HTTPS-запросов к api.telegram.org
  telegram_proxy_url: ""      # socks5h://127.0.0.1:9050 или http://127.0.0.1:8118
  # При mtproto — отдельные поля + telegram_api_id / telegram_api_hash (my.telegram.org)
  telegram_mtproto_host: ""
  telegram_mtproto_port: 443
  telegram_mtproto_secret: ""  # hex из приложения (ee/dd…); маскируется в API
  telegram_api_id: 0           # целое, или env TELEGRAM_API_ID
  telegram_api_hash: ""       # строка, или env TELEGRAM_API_HASH
  telegram_timeout: 300      # Таймаут сек (в РФ блокировки — ставить 300+). Текст: timeout/2
  telegram_retries: 5        # Повторы при таймауте/сетевой ошибке
  compress_photo_over_kb: 400 # Сжимать фото >N KB для ускорения (0=выкл)
  telegram_max_side_px: 1024 # Макс. сторона в пикселях (0=не менять). Кропы уменьшаются — чаще доходят в РФ
  message_thread_id: ""       # ID топика в канале (если канал с форумом)
  disable_notification: false # Тихие сообщения (без звука). В multipart шлём true/false для совместимости
  protect_content: false      # Запретить пересылку и сохранение
  link_preview_large: false  # true: большие превью ссылок (prefer_large_media), ссылка в тексте
  send_photo: true           # false: только текст, без фото (даже при processor.save_images)
  use_custom_emoji: false   # true: icon_custom_emoji_id на кнопках (требует Premium у владельца бота)
  custom_emoji_id_bird: ""  # ID кастомного эмодзи для птиц (из @Stickers или сообщения)
  custom_emoji_id_chipmunk: ""
  custom_emoji_id_open_live: ""
  paid_media_view_star_count: 0    # Stars за просмотр фото (0=бесплатно, 1-25000)
  paid_media_forward_star_count: 0  # Stars за пересылку/копирование (0=разрешить, >0=запретить при бесплатном просмотре)

# Web Push: push-уведомления в браузере (дополнение к Telegram)
web_push:
  enabled: false
  vapid_public_key: ""
  vapid_private_key: ""

# Webhook: POST при каждой детекции (IFTTT, Zapier, свои скрипты)
webhook:
  url: ""  # например https://maker.ifttt.com/trigger/bird_detected/with/key/xxx

# Весы у кормушки: MQTT-топики прошивки или прямой ESPHome Web API.
integrations:
  birdnet:
    mqtt_topic: "birdnet"
  scales:
    enabled: false
    source: mqtt  # mqtt | esphome
    # Топик веса (полный путь). Если пусто, но задан mqtt_topic_prefix — вес: {prefix}/weight
    mqtt_topic: ""
    # Полный топик bird_present (ON/OFF). Если пусто — {mqtt_topic_prefix}/bird_present при непустом префиксе
    mqtt_bird_present_topic: ""
    # Префикс ESPHome/своей прошивки: вес {prefix}/weight, птица {prefix}/bird_present, команда тары {prefix}/command
    mqtt_topic_prefix: "birdlense/scale"
    # Явный топик команды (тара). Пусто = {mqtt_topic_prefix}/command при непустом префиксе
    mqtt_command_topic: ""
    # Payload для POST /api/ui/feed/scale-tare (устройство должно подписаться на command topic)
    mqtt_tare_payload: "TARE"
    # ESPHome Web API (прямой HTTP к устройству): сенсор веса, binary_sensor присутствия, button тары
    esphome_url: ""
    esphome_weight_sensor_id: "weight_live_internal"
    esphome_bird_present_sensor_id: "bird_present"
    esphome_tare_button_id: "manual_tare"
    unit: g
    # Журнал MQTT-показаний (JSONL) и оценка дельты за интервал записи (#167).
    # Работает только для mqtt, не для прямого ESPHome API.
    weight_estimate_enabled: true
    min_delta_kg_for_estimate: 0.008  # игнорировать шум меньше ~8 г
    # Оценка на ролик только если между двумя соседними по времени MQTT-точками был скачок >= порога
    estimate_require_consecutive_spike: true
    history_max_lines: 10000
    # Триггер записи + конвейер YOLO: скачок веса на MQTT (параллельно с Frigate в OrMotion)
    motion_trigger_enabled: false
    motion_trigger_min_delta_kg: 0.02  # |Δ| между двумя подряд MQTT-сэмплами, кг
    motion_trigger_debounce_seconds: 1.5

# Кэш API: Redis из docker-compose; URL можно задать в UI (перекрывает REDIS_URL). Выключать без веской причины не стоит.
performance:
  cache_redis_enabled: true
  redis_url: ""  # непусто — использовать вместо REDIS_URL; секрет — маскируется в API

# UI: порог confidence для списка «Неизвестные» (детекции ниже — для ручной проверки)
ui:
  unknown_confidence_threshold: 0.48  # чуть строже отбор в «Неизвестные» при новых порогах детектора

# MCP (Model Context Protocol) — внешние ИИ-ассистенты / MCP-хосты вызывают инструменты хаба по токену (см. docs/MCP_SETUP)
mcp:
  enabled: false
  # Токен для доступа. Пусто — без защиты. Рекомендуется для продакшена.
  # Env MCP_TOKEN переопределяет (для хранения секрета вне конфига).
  token: ""
  # API URL для MCP-клиента. В контейнере: http://127.0.0.1:8000/api/ui
  # api_url: ""  # пусто = авто (127.0.0.1:8000 в Docker, иначе из env BIRDLENSE_API_URL)

# eBird export — для формата eBird Record (импорт в eBird.org)
ebird:
  country: "US"       # 2-char code (US, RU, etc.)
  state: ""           # 1–3 chars (NY, CA, MOS для Московской обл., etc.)
  location_name: "BirdLense Feeder"
  protocol: "Stationary"  # Stationary | Traveling | Incidental | Historical
  # Необязательные eBird-специфичные переопределения имён (сверх detection.species_mapping).
  # Гармонизация Gray/Grey и «Scientific (Common)» → общее имя уже в detection.species_mapping.
  species_mapping: {}

# Каталог видов: строго соответствует классам EU классификатора (best_EU.pt) + Rodent.
# class_names.txt сгенерирован из best_EU.pt через scripts/datasets/dump_classifier_allowlist.py.
species:
  # Список классов EU классификатора (491 птица + Rodent). Единственный источник истины для каталога.
  catalog_allowlist_file: "models/classification/weights/class_names.txt"
  # true: детекции вне allowlist → Unknown, новые строки каталога не создаются.
  catalog_strict_ingest: true
  tuning_target_species_ids: []

# Secrets - use env vars: OPENWEATHER_API_KEY, MQTT_PASSWORD, HA_TOKEN
secrets:
  openweather_api_key: ""
  xeno_canto_api_key: ""  # Xeno-canto API v3 key for bird song playback (xeno-canto.org/account)
  ebird_api_key: ""       # eBird API key for regional comparison (ebird.org/api/keygen)
  latitude: "39.8283"
  longitude: "-98.5795"
