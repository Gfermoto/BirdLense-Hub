general:
  # UI branding title (legacy key from older installs; optional).
  app_name: "BirdLense"
  # Поток видео в UI (/api/ui/videos/:id/stream): false — гости могут смотреть (см. ACCESS_CONTROL Viewer).
  # true — только Contributor/Admin (старое поведение).
  require_auth_for_video_stream: false
  enable_notifications: false
  notification_excluded_species: []
  # Пароль для доступа к настройкам (Admin). Пусто — без пароля.
  # Хранится в открытом виде. Для продакшена рассмотрите хеширование.
  settings_password: ""
  # Пароль помощника (Contributor): коррекция видов, отчёты, iNaturalist. Пусто — один пароль на всё.
  contributor_password: ""
  # Сброс сессии входа (admin/contributor) после N минут без запросов к API. 0 — выключено.
  # Включается при непустом admin/contributor пароле или в production (см. SECURITY).
  session_idle_minutes: 30
  # Ссылка на установку BirdNET (BirdNET-Pi, BirdNET-Go). Пусто — иконка BirdNET не показывается.
  birdnet_url: ""
  # Ссылка на донаты: задаётся в Настройках → Общие; в UI только иконка-сердце в шапке. Пусто — скрыто.
  donate_url: ""

# Video/Audio processor settings
# Важно: user_config.yaml мержится с дефолтами рекурсивно (merge_dicts): заданные ключи
# переопределяют вложенные значения на всех уровнях; отсутствующие ключи берутся из default.
#
# Порядок порогов (позже перекрывает раньше):
#   default_config → user_config → adaptive_profiles.night → camera_tuning_by_role.<role>
#   → detection.camera_overrides.<camera_id> (legacy, merged if present)
#   → processor.camera_overrides.<camera_id> → video.cameras[].detection_interest_zones
#
# Detect-first (lores anchor до main record) — отдельные ключи, НЕ min_track_duration:
#   detect_first_confirm_min_hits, detect_first_confirm_min_track_seconds, detect_first_window_seconds.
# min_track_duration — только gate persist/ByteTrack после старта записи (#612).
processor:
  # linear: trigger → detect/track → classify+helpers → reid/behavior → persist
  # legacy: pre-2026-06 multi-gate decision path (opt-in rollback)
  pipeline_mode: linear
  # linear + scoring_engine: phantom/static filter on live (TG-aligned); legacy static cascade stays off
  linear_live_scoring_engine_enabled: true
  # linear: Birder только на finalize (key_frames), не на каждом live-кадре
  classifier_defer_to_finalize: true
  classifier_finalize_max_key_frames: 3
  # object_confirm_min_score / object_confirm_threshold — unset → min_confidence_binary_bird
  # Legacy compatibility toggles (kept for older user_config keys; runtime may ignore).
  adaptive_preprocess_enabled: false
  binary_rescue_enabled: false
  # ByteTrack YAML: имя из Ultralytics («bytetrack.yaml») или путь models/tracker/… под app/processor
  tracker: "models/tracker/bytetrack_birdlense_lowfps.yaml"
  # Только ключ ``night`` читается runtime (resolve_runtime_profile). Днём — ``processor.tracker``.
  tracker_profiles:
    night: "models/tracker/bytetrack_birdlense_night.yaml"
  # Optional tracker presets by effective stream FPS (probe/video.detect_fps).
  tracker_fps_profiles:
    lte_5: "models/tracker/bytetrack_birdlense_lowfps.yaml"
    lte_7: "models/tracker/bytetrack_birdlense_lowfps.yaml"
    lte_10: "models/tracker/bytetrack_birdlense.yaml"
    lte_15: "models/tracker/bytetrack_birdlense.yaml"
    gt_15: "models/tracker/bytetrack_birdlense.yaml"
  # SOTA-10: scale ByteTrack track_buffer = stream_fps * remember_seconds on low-FPS (≤10).
  tracker_adaptive_low_fps_enabled: true
  tracker_low_fps_threshold: 10.0
  # Длинный buffer → «залипший» bbox на весь клип при ~7 FPS (ByteTrack держит lost track).
  tracker_remember_seconds: 1.6
  tracker_adaptive_min_buffer: 6
  tracker_adaptive_max_buffer: 16
  # Отклонить трек, если центр bbox почти не двигается дольше N сек (кормушка / phantom).
  track_static_reject_enabled: true
  track_static_reject_min_duration_sec: 2.0
  track_static_reject_min_frames: 4
  track_static_reject_min_frames_sparse: 3
  track_static_reject_min_duration_sparse_sec: 2.5
  track_static_reject_max_center_dispersion_norm: 0.085
  track_static_reject_max_relative_center_dispersion: 0.16
  track_static_reject_max_bbox_iou_first_last_min: 0.74
  track_id_switch_iou_threshold: 0.25
  max_record_seconds: 60
  # video.source=file: нижняя граница max_record_seconds (сек). Большое значение при playlist+split по файлам — не резать длинный клип по таймеру.
  file_max_record_floor_seconds: 86400
  max_inactive_seconds: 8
  # Readiness guardrail: максимальный возраст heartbeat процессора (сек) в production.
  readiness_heartbeat_max_age_seconds: 180
  # Heartbeat fallback in health contract only while models/bootstrap are still warming up.
  bootstrap_phase_max_seconds: 600
  # Post-roll: доп. секунды к «тишине» перед остановкой записи (#157). Итог = max_inactive_seconds + post_record_seconds.
  post_record_seconds: 3
  # Мин. пауза после окончания записи до следующего старта (сек). 0 = выкл.
  # Уменьшает почти совпадающие по времени дубли-клипы при Frigate+OpenCV или объекте, всё ещё в кадре.
  # Второй клип «эхо» с bbox на том же месте без птицы: поднимите паузу и/или ужесточите OpenCV и бинарные пороги.
  min_seconds_between_recordings: 8
  # When true (default if 2+ cameras), a second camera may record in parallel while the first clip is active (#589).
  concurrent_recording_enabled: true
  # Анти-конкуренция trigger-веток: окно (сек) после первого fire, в котором
  # конкурирующие триггеры не стартуют новую запись (логируются как trigger_moratorium).
  trigger_moratorium_seconds: 2
  # Trigger -> lowres detect-first window; recording starts only after confirmed YOLO+ByteTrack bbox.
  detect_first_enabled: true
  detect_first_triggers: ["opencv", "frigate", "motion_sensor", "scales"]
  detect_first_window_seconds: 4.0
  detect_first_max_frames: 30
  detect_first_confirm_min_hits: 1
  detect_first_raw_hits_anchor_enabled: true
  detect_first_confirm_min_track_seconds: 0.35
  # Detect-first opens the main recording, but should not by itself create a final visit.
  # Persist dense live YOLO tracks; anchor-only rows are too short for lifecycle trails.
  detect_first_anchor_only_persist_enabled: false
  # Frigate trigger: если lores YOLO не дал anchor, но Frigate уже видит bird+bbox — старт record.
  detect_first_frigate_assist_enabled: true
  detect_first_frigate_assist_min_confidence: 0.50
  record_prebuffer_seconds: 0
  record_postroll_seconds: 3
  # Legacy alias for the old bounded probe; kept for migrated user_config values.
  detect_scheduler_enabled: true
  # opencv: YOLO must see bird before motion clip starts (cuts FP empty recordings).
  detect_scheduler_triggers: ["opencv", "frigate", "motion_sensor", "scales"]
  detect_probe_window_seconds: 2.5
  detect_probe_max_frames: 30
  detect_probe_min_hits: 2
  detect_probe_start_recording_on_positive: true
  # Свежее подтверждение Frigate держит клип «живым» ещё N сек, даже если YOLO на паре кадров молчит.
  # Помогает не обрывать ролик, пока объект ещё реально в кадре.
  frigate_activity_hold_seconds: 10
  # Удержание клипа по Frigate MQTT только если триггером была Frigate (standalone OpenCV — свой YOLO).
  frigate_hold_only_when_frigate_trigger: true
  # Ограничение на «Frigate-only» продление в кадрах (0 = без ограничения).
  # Защита от долгих сессий без raw boxes: после лимита клип больше не продлевается только Frigate-активностью.
  frigate_only_extension_max_frames: 0
  # Мин. длительность трека ByteTrack (сек) для persist после старта записи. Detect-first anchor — см. detect_first_confirm_min_track_seconds.
  min_track_duration: 0.25
  # Только офлайн-перегенерация треков: ниже live, иначе короткие визиты и рваные track_id → rejected_short_track и пустые overlays в UI.
  track_regen_min_track_duration: 0.05
  # Шаг кадров для batch-перегенерации треков: 1=каждый кадр (точно, медленно), 6+=быстро.
  # Между обрабатываемыми кадрами декодирование не делается (OpenCV grab), иначе ускорения почти нет.
  # На слабом/прерывистом бинарнике шаг 4+ часто даёт пустой regen или короткий трек — для качества одного ролика ставьте 1–2.
  track_regen_frame_step: 5
  # Защитный mutex внутри процесса для OpenVINO track regen: снижает риск segfault при конкурентных regen-запросах.
  track_regen_serialize_inference: true
  # Доп. межпроцессный lock (/tmp/birdlense_track_regen.lock): не даёт нескольким воркерам/CLI
  # одновременно гонять тяжелый full-regen и выбивать контейнер по OOM (exit 137).
  track_regen_serialize_inference_interprocess: true
  # Только офлайн-regen: мягче пороги YOLO track() и Bird после трека (не трогает live). Держите track(conf) выше track_high_thresh в bytetrack YAML (~0.20).
  # track_regen_min_confidence_binary: 0.21
  # track_regen_min_confidence_binary_bird: 0.22
  # Отдельная стратегия детекции для batch-перегенерации треков (только two_stage: binary .pt + classifier .pt).
  track_regen_detection_strategy: two_stage
  # Размер кадра для batch-перегенерации (квадрат, legacy). При track_regen_lores_wh не используется.
  track_regen_lores_px: 704
  # Regen = live detect: 704×576 (как Go2RTC detect substream).
  track_regen_lores_wh: [704, 576]
  # Offline regen: при boxes.id=None — склейка кадров по IoU; ниже порог терпимее к дрожащим bbox (меньше «рваных» track_id).
  track_regen_iou_id_fallback: true
  track_regen_iou_match_threshold: 0.22
  # Live/file pipeline: если ByteTrack не отдал id, не терять бокс — присвоить временный id по IoU.
  iou_id_fallback_live_enabled: true
  iou_id_fallback_live_match_threshold: 0.18
  # Классификатор в фоне: hot path = detect+track only; species подтягивается из кэша.
  classifier_async_enabled: true
  # Если track() вернул 0 боксов, сделать predict() с мягким conf как аварийный fallback.
  track_to_predict_fallback_enabled: true
  track_to_predict_fallback_confidence: 0.002
  # Таймаут на одно видео при batch-перегенерации треков (сек): защита от «зависшего» файла.
  track_regen_video_timeout_sec: 900
  # Отдельный таймаут для точного fallback-прохода: не даём одному ролику блокировать весь recovery.
  track_regen_precise_timeout_sec: 420
  # Точный fallback-проход (другой lores/frame_step/min_center_dist); стратегия та же — two_stage.
  track_regen_precise_detection_strategy: two_stage
  # Для recovery fallback допускаем птиц ближе к краям кадра, иначе feeder-side perches теряются.
  track_regen_precise_min_center_dist: 0.02
  # Regen policy scope_strategy=global_classifier_scope:
  # не сужать YOLO/классификатор по processor.regional_species
  # (иначе пропадают виды вне списка — типично EU-синицы при US-ориентированном регионе).
  track_regen_ignore_regional_species: true
  # Нативный detect substream (Go2RTC/Frigate): без даунскейла в квадрат 640².
  # Кадр 704×576 → YOLO один раз letterbox до binary_imgsz (704). См. inference_lores_px (legacy max side).
  # Родное разрешение камеры: true — без принудительного letterbox на capture (YOLO готовит кадр в detect).
  detect_use_native_resolution: false
  # Опционально: WxH detect-потока (если не native). Пусто — inference_lores_px или probe кадра.
  inference_lores_wh: [704, 576]
  inference_lores_px: 704
  # Best-practice split pipeline: YOLO detect/track on lores, classifier/ReID crops from source frame.
  # false — классификатор/ ReID используют тот же lores-кадр (быстрее, но хуже детализация).
  classifier_use_source_frame: true
  # Go2RTC live: один RTSP read (main/record) + software lores для detect/YOLO; FFmpeg record по demand.
  # false (default) — detect substream + sync buffer; avoids OpenCV+FFmpeg contention on main during record.
  single_rtsp_read: false
  # Interpolation for OpenCV resize during letterbox preprocessing.
  # linear|cubic|area|nearest|lanczos
  letterbox_resize_interpolation: linear
  # Debug: save overlay frames (green=raw, red=accepted) under data/diagnostics/bbox_parity/
  bbox_parity_debug_enabled: false
  bbox_parity_debug_max_frames: 20
  # 7 FPS low-res detect stream: мягкий enhance перед letterbox для мелких объектов.
  lowres_enhance_enabled: true
  # Применять enhance только к входу <= N px по большей стороне (чтобы не трогать HD).
  lowres_enhance_max_input_px: 800
  # Unsharp amount (0..1): выше = резче, но больше noise.
  lowres_sharpen_amount: 0.32
  # Regen policy scope_strategy=match_live_pipeline:
  # тот же lores (inference_lores_px), каждый кадр,
  # без обнуления regional_species и без remap детекций по «локальному» scope (#263).
  # SOTA-11: true — regen = live (пороги, geometry, regional scope, min_track_duration, IoU fallback).
  track_regen_match_live_pipeline: true
  # Пересчёт оверлея: binary_only только при track_regen_match_live_pipeline: false (legacy).
  track_regen_binary_only: true
  # При ручной коррекции на ролике: не отбрасывать авто-детекции, пересекающиеся по времени
  # с ручными строками (например Bird рядом с исправленной сорокой) — появятся параллельные
  # VideoSpecies с frames/оверлеем; виды потом можно поправить. false — прежнее «без конфликтов».
  track_regen_parallel_auto_with_manual: false
  # Дефолты: строже по мусору в TG, мягче по грызунам (Rodent override ниже).
  # Trapper @ conf 0.25 на 1816/1819: визуально без ложных (showdown 2026-05).
  min_confidence_binary: 0.12
  min_confidence_binary_bird: 0.12
  # Trapper class 5 (белка): отдельный порог после track(); калибровать по val-клипам (не ниже bird без причины).
  min_confidence_binary_rodent: 0.30
  # DEPRECATED (nabirds-pivot): Rodent не детектируется; ключ только для legacy user_config (игнорируется при detector_scope: [Bird]).
  # OpenVINO NABirds: conf на IR часто ВЫШЕ torch, не ниже — scale 8.5 (legacy BRG) раздувает FP.
  # track(conf) cap — не ниже bird-порога; scale 1.0 = без искусственного завышения при фильтрации.
  # conf для YOLO track(); должен быть < min_confidence_binary_bird и > track_high в ByteTrack YAML.
  openvino_binary_track_ultralytics_conf: 0.12
  openvino_binary_bird_score_scale: 1.0
  openvino_min_confidence_binary_bird: 0.12
  # --- SOTA 2.0: unified ScoringEngine (replaces legacy filter cascade) ---
  scoring_engine_enabled: true
  scoring_weight_conf: 0.45
  scoring_weight_motion: 0.25
  scoring_weight_shape: 0.15
  scoring_weight_background: 0.15
  scoring_frigate_prior_boost: 0.20
  scoring_default_low_threshold: 0.32
  scoring_default_high_threshold: 0.48
  scoring_review_band_width: 0.14
  scoring_calibration_frames: 60
  scoring_calibration_max_noise_rate: 0.01
  scoring_calibration_percentile: 0.95
  # Квадратные низко-motion боксы (кормушка/автомат) — hard reject до score band.
  scoring_static_phantom_reject_enabled: true
  scoring_static_phantom_max_motion_score: 0.22
  scoring_static_phantom_max_shape_score: 0.38
  scoring_static_phantom_square_aspect_min: 0.82
  scoring_static_phantom_square_aspect_max: 1.22
  scoring_static_phantom_max_conf: 0.52
  frame_decision_trace_enabled: true
  # Legacy cascade (ignored when scoring_engine_enabled=true)
  static_object_suppression_enabled: false
  static_box_aspect_ratio_min: 0.8
  static_box_aspect_ratio_max: 1.2
  static_box_conf_threshold: 0.45
  # Defaults align with min_confidence_binary_bird (code fallback); do not exceed bird floor.
  static_square_hard_reject_max_conf: 0.22
  static_scene_bird_min_confidence: 0.25
  static_scene_bird_like_min_confidence: 0.4
  # Не диапазон min..max: OR — вертикальная птица (w/h <= vertical_max) ИЛИ горизонтальная (w/h >= horizontal_min).
  static_scene_bird_like_vertical_max_aspect: 0.7
  static_scene_bird_like_horizontal_min_aspect: 1.4
  static_temporal_enabled: true
  static_temporal_min_frames: 4
  static_temporal_max_area_px: 120000
  static_temporal_hist_change_max: 0.04
  static_giant_box_area_frac: 0.5
  static_giant_box_side_frac: 0.42
  static_temporal_min_seconds: 8
  static_temporal_max_jitter_px: 2
  # Fallback FPS для static/temporal фильтров, если поток не отдаёт FPS (0 = только probe потока).
  detection_quality_assumed_fps: 7
  # Optional user-drawn masks (UI); empty by default — core FP control is algorithmic (MOG2 + motion).
  detection_ignore_masks: []
  detection_interest_zones: []
  detection_interest_zones_required: false
  # MOG2 background subtraction (OpenCV): reject boxes that sit on learned static background.
  background_subtraction_enabled: false
  background_subtraction_method: mog2
  background_subtraction_history: 400
  background_subtraction_var_threshold: 16
  background_subtraction_min_fg_ratio: 0.07
  background_subtraction_warmup_frames: 45
  background_subtraction_detect_shadows: true
  background_subtraction_learning_rate: -1
  # Scene-adaptive bird confidence floor (static scene / night / low global motion).
  scene_adaptive_conf_enabled: true
  scene_adaptive_static_boost: 0.08
  scene_adaptive_night_boost: 0.10
  scene_adaptive_conf_cap: 0.48
  motion_verified_detection_enabled: false
  motion_verified_min_pixel_change: 10
  motion_global_static_reject_enabled: true
  motion_global_max_mean_absdiff: 2.0
  motion_strict_consecutive_frames: 3
  motion_hard_conf_ceiling: 0.55
  detection_texture_filter_enabled: true
  detection_texture_min_laplacian_var: 20
  hard_negatives_enabled: true
  hard_negatives_dir: "data/hard_negatives"
  hard_negatives_max_per_frame: 8
  # Устаревший алиас (читается, если min_confidence_binary_rodent не задан):
  # min_confidence_binary_squirrel: 0.24
  # Доля площади кадра (0..1): Bird с bbox ≤ порога — без видового классификатора. 0 = выкл. (рекомендуется для видов на кормушке).
  # 0 = не пропускать Birder на мелких птицах (кормушка / дальняя камера).
  bird_skip_classifier_max_area_frac: 0
  min_confidence_to_process: 0.12  # combined для БД; detect 704×576@7fps — слабые YOLO conf ~0.08–0.15
  # Отдельный порог для Telegram: только уверенные визиты (может быть > min_confidence_to_process).
  min_confidence_to_notify: 0.46
  # TG preview: best_frame_lores (detect crop) | record_hires (main MP4) | auto (hires then lores)
  notify_preview_source: auto
  notify_preview_crop_pad_frac: 0.06
  # Classifier uses lores best_frame until detect→record bbox/timing parity is calibrated.
  # ReID/TG can still use hi-res MP4 crops below.
  classifier_crop_source: best_frame_lores
  reid_crop_source: auto
  enrichment_crop_pad_frac: 0.06
  # Linear pipeline: reject static-pinned tracks (feeder FP #608).
  linear_static_pinned_reject_enabled: true
  # Seek offset (sec) when cropping main MP4 for TG/overlay; per-camera in camera_tuning_by_role
  detect_record_time_offset_sec: 0
  scoring_moving_roi_review_enabled: true
  scoring_moving_roi_min_motion_score: 0.32
  # Перед YOLO: отсечь совсем тёмные кадры. ИК/сумерки: слишком жёсткие пороги = YOLO почти не работает.
  light_gate_enabled: false
  light_gate_min_brightness: 14
  light_gate_min_contrast: 10
  # Adaptive runtime profiles: мягкие override'ы для сложных сцен (сейчас — night/low-light).
  adaptive_profiles:
    enabled: true
    night:
      # Профиль активируется, если brightness <= max_brightness И/ИЛИ contrast <= max_contrast.
      max_brightness: 18
      max_contrast: 12
      overrides:
        # Позволить YOLO работать в сумерках/ИК без полного снятия light gate.
        light_gate_min_brightness: 8
        light_gate_min_contrast: 6
        # Ночь/ИК: не задираем пороги выше дневных, иначе теряем реальные визиты.
        # Шум/FP режутся scoring/motion/filter-цепочкой, а не агрессивным conf floor.
        min_confidence_binary: 0.25
        min_confidence_binary_bird: 0.23
        openvino_min_confidence_binary_bird: 0.23
        min_track_duration: 1.0
        min_confidence_to_process: 0.35
        min_box_size_px: 14
        min_center_dist: 0.01
        max_classifications_per_frame: 4
        binary_imgsz: 704
  # Предупреждение и счётчик slow_frame_processor_detect_total, если один detect() занимает дольше.
  frame_processing_warn_ms: 450
  # Offline track regen по mp4 обходит light gate (см. FrameProcessor.run skip_light_gate) — иначе ночные ролики без YOLO.
  # Пороги по видам (редкие — ниже). Ключ: имя вида, значение: порог (0.0–1.0)
  species_confidence_overrides: {}  # напр. {"Rodent": 0.28}; пустой {} в user_config не затирает кодовый порог для Rodent
  # Авто-пороги для видов из регионального топа eBird (#128). Ручные ключи в species_confidence_overrides важнее.
  ebird_regional_top_auto_confidence: true
  # Вычитается из min_confidence_to_process для каждого вида из топа (после detection.species_mapping)
  ebird_regional_top_confidence_delta: 0.03
  # Нижняя граница авто-порога (не ниже)
  ebird_regional_top_confidence_floor: 0.08
  # BirdNET MQTT: confidence-only bias для классификатора по недавним аудио-событиям (#129).
  # BirdNET не создаёт финальный label и не мержится в video detections напрямую.
  # Legacy-layer: сейчас это ещё threshold bias, но под ним уже может жить rolling audio prior.
  birdnet_mqtt_auto_confidence: false
  birdnet_mqtt_bias_delta: 0.05
  birdnet_mqtt_bias_floor: 0.05
  # Rolling BirdNET prior: события копятся в окне 24h, не сбрасываются разом,
  # а вытесняются по TTL 25h с time-decay по свежести.
  birdnet_mqtt_prior_window_hours: 24
  # Backward-compat alias (deprecated): old installs may still send this key in user_config;
  # interpreted as seconds and converted to hours in processor.
  birdnet_mqtt_bias_window_seconds: 0
  birdnet_mqtt_prior_ttl_hours: 25
  birdnet_mqtt_prior_half_life_hours: 6
  birdnet_mqtt_prior_min_confidence: 0.0
  # Слияние BirdNET ↔ видео: каноническое имя из hub SQLite (species_taxon.scientific_name → common_name;
  # иначе species_alias). Локаль подписи в MQTT (RU/EN) не важна, если есть ScientificName или алиас.
  # При hub на PostgreSQL без общего SQLite — только detection.species_mapping + normalize.
  # BirdNET observability logs for FIFO/parse reasons: off | info | debug.
  # - info: only decision/prune reasons
  # - debug: +accepted ingest and prior-window summaries
  birdnet_mqtt_observability_level: info
  # Emergency switch: keep level=info but also print debug-level BirdNET reason logs.
  birdnet_mqtt_observability_debug: false
  # Снимок FIFO BirdNET на диск (data/diagnostics/) для UI: процессор и веб — разные процессы.
  birdnet_fifo_snapshot_enabled: true
  birdnet_fifo_snapshot_interval_sec: 3
  birdnet_fifo_snapshot_recent_limit: 80
  # GET /api/ui/system/diagnostics/birdnet-fifo считает снимок устаревшим, если файл старше (сек).
  birdnet_fifo_snapshot_stale_sec: 180
  # Окно «услышан сейчас» в снимке FIFO (UI): active=1 если последнее MQTT по виду новее N часов.
  birdnet_fifo_hearing_active_hours: 24
  # Очередь BirdNET в hub SQLite (data/db/birdlense.db): переживает рестарт процессора (#269).
  birdnet_fifo_persist_enabled: true
  birdnet_fifo_sqlite_busy_ms: 30000
  # Несколько камер Frigate на одной локации: если один вид с 2+ камер из группы — прибавка к confidence (#153)
  multi_camera_groups: []  # список групп ID камер из Video → Cameras, например: [["cam_a","cam_b"]]
  multi_camera_confidence_boost: 0.03
  # true — retention ANALYZE/VACUUM для runtime metrics в фоне, не в hot path finalize worker.
  runtime_metrics_maintenance_async: true
  # regional_species: [] — без локального сужения classifier scope; YOLO использует все классы
  regional_species: []
  # TrapperAI: все классы модели (0..17). Пустой scope = без фильтра по метке.
  detector_scope: []
  detector_native_class_labels: true
  # null/[] = все class id в track/predict; список id — только эти классы YOLO.
  binary_predict_class_allowlist: null
  # Планировщик классификации species внутри кадра: priority | round_robin.
  classification_scheduler: priority
  max_classifications_per_frame: 4
  max_blur_checks: 3
  blur_threshold: 100.0
  # Центр bbox не ближе этого расстояния к краю кадра (норм. координаты 0..1).
  # Кормушка у кромки: 0.035–0.04; ещё ближе к краю — до 0.03.
  min_center_dist: 0.01
  # Trapper OpenVINO: экспорт imgsz=704 (max side detect 704×576). IR = 704×704 letterbox внутри YOLO.
  binary_imgsz: 704
  # NMS в Ultralytics track(): выше — мягче подавление частично перекрывающихся боксов (плотная кормушка).
  binary_track_iou: 0.62
  # Потолок детекций на кадр (по умолчанию у YOLO часто 300).
  binary_track_max_det: 60
  # Detect substream 704×576: птицы далеко — мелкие bbox; не душить как на main 2K.
  min_box_size_px: 14
  # Универсальный fallback для всех камер/доменов: если после базовых фильтров валидных боксов нет,
  # дать второй шанс мелким объектам с мягкими геометрическими/уверенностными порогами.
  auto_small_object_relax_enabled: false
  auto_small_object_relax_min_box_size_px: 18
  auto_small_object_relax_min_center_dist: 0.01
  auto_small_object_relax_conf_delta: 0.05
  auto_small_object_relax_max_candidates: 1
  # Если strict + small-object relax всё ещё пусто, сохранить 1 сверхслабый bird box как последний шанс.
  ultra_weak_box_salvage_enabled: false
  ultra_weak_box_salvage_min_confidence: 0.20
  ultra_weak_box_salvage_max_candidates: 1
  # Если долго нет треков подряд, временно ослабить binary confidence floor.
  # Универсальный механизм для любых камер/доменов без ручных per-camera правил.
  auto_unstick_enabled: true
  # ~4 с при detect ~7 FPS (60 кадров ≈ 8.5 с — поздно для коротких визитов).
  auto_unstick_no_track_frames: 10
  auto_unstick_min_confidence_binary: 0.08
  auto_unstick_min_confidence_binary_bird: 0.03
  auto_unstick_min_box_size_px: 14
  auto_unstick_min_center_dist: 0.01
  auto_unstick_tracker: "bytetrack_birdlense_unstick.yaml"
  auto_unstick_tracker_night: "bytetrack_birdlense_night_unstick.yaml"
  # Guardrail against detector collapse into near full-frame boxes.
  max_box_area_norm: 0.85
  # Точечные per-camera override'ы для дальних/крупноплановых камер.
  # Ключ = video.cameras[].id. Поддерживаются те же processor-* поля, что и в adaptive profile overrides
  # (например min_box_size_px, min_confidence_binary_bird, min_confidence_to_process, min_track_duration).
  camera_overrides: {}
  # Ролевые пресеты: video.cameras[].tuning_role → merge до camera_overrides (per-id побеждает).
  # Новые инсталляции без ручного BirdBox/Forest — feeder_close / feeder_far.
  camera_tuning_by_role:
    feeder_close:
      detect_first_confirm_min_track_seconds: 0.35
      min_confidence_binary: 0.08
      min_confidence_binary_bird: 0.06
      min_confidence_to_process: 0.08
      min_track_duration: 0.35
      min_box_size_px: 10
      max_box_area_norm: 0.92
      track_to_predict_fallback_enabled: true
      detect_record_time_offset_sec: -0.10
      track_static_reject_enabled: true
      track_static_reject_min_duration_sec: 1.5
      track_static_reject_min_frames: 3
      track_static_reject_min_frames_sparse: 2
      track_static_reject_min_duration_sparse_sec: 0.8
      track_static_reject_max_center_dispersion_norm: 0.055
      track_static_reject_max_relative_center_dispersion: 0.11
      track_static_reject_max_bbox_iou_first_last_min: 0.72
      scoring_moving_roi_min_motion_score: 0.30
    feeder_far:
      min_track_duration: 0.5
      min_confidence_binary_bird: 0.08
      detect_record_time_offset_sec: -0.12
      track_static_reject_enabled: false
      track_static_reject_max_center_dispersion_norm: 0.10
      track_static_reject_max_relative_center_dispersion: 0.18
      track_static_reject_min_duration_sec: 2.5
      track_static_reject_min_frames: 3
      track_static_reject_min_frames_sparse: 2
  # Generic Bird: когда классификатор не дотягивает, но есть уверенный «Bird», не гоним всё в ручной review.
  # Не 0.42: на OV+detect слабые conf 0.04–0.15 — иначе только review_only salvage.
  generic_bird_min_detector_conf: 0.10
  generic_bird_min_frames: 2
  generic_bird_min_area_frac: 0.006
  generic_bird_min_best_frame_score: 5.0
  # DEPRECATED (nabirds-pivot): Rodent pipeline отключён.
  generic_rodent_min_frames: 2
  generic_rodent_max_area_frac: 0.60
  generic_rodent_min_best_frame_score: 6.0
  key_frame_limit: 3
  # Если классификатор ниже порога, но detector подтвердил target — сохранить generic detector label.
  # Bird fallback может быть затем promoted Frigate, если есть уверенный sub_label/label в окне ролика.
  classifier_fallback_bird: true
  included_bird_families:
    - "Perching Birds"
    - "Pigeons and Doves"
    - "Woodpeckers"
  save_images: false
  # Сохранять best_frame в data/dataset/train/<Species>/ для экспорта и дообучения (по умолчанию выкл. — не раздувать диск)
  save_dataset_crops: false
  dataset_min_confidence: 0.58
  # video.source=file: оставить папку сессии с записанным mp4 при 0 детекций (без create_video / кропов из пайплайна)
  keep_recording_when_no_detections: false
  detection_strategy: "two_stage"
  # Detector runtime (OpenVINO primary for production).
  inference_backend: openvino
  inference_device: cpu
  # false — экстренный стоп OV (вернуть torch + openvino_binary_enabled: false).
  openvino_binary_enabled: true
  # birder_eu (707 EU, Collins / birder-project eu-common) | efficientnet_b2 (global 525) | yolo (legacy)
  classifier_engine: birder_eu
  birder_eu_variant: convnext_v2_tiny_eu-common256px
  birder_eu_min_confidence: 0.15
  birder_eu_unknown_label: "Unknown Bird"
  # Ниже порога Birder, но выше min — сохранить best-guess вид + review (classification-first).
  classifier_best_guess_enabled: true
  classifier_best_guess_min_confidence: 0.10
  classifier_best_guess_min_events: 1
  efficientnet_b2_min_confidence: 0.22
  efficientnet_b2_unknown_label: "Unknown Bird"
  # Trapper squirrel → каталог Rodent (не класс EfficientNet 525)
  squirrel_species_label: "Rodent"
  # auto: OpenVINO IR (birds_classifier_260.xml) if present, else ONNX Runtime
  classifier_inference_backend: auto
  # Безопасный дефолт: AUTO (CPU fallback без обязательного /dev/dri на VPS/CPU-only).
  # Для явного Intel iGPU задайте intel:gpu в user_config/.env.
  classifier_inference_device: auto
  # W1.1: async finalize worker to decouple hot session loop.
  finalize_async_enabled: true
  finalize_queue_maxsize: 2
  finalize_enqueue_timeout_ms: 1500
  finalize_shutdown_grace_seconds: 120
  # Runtime latency budgets (D1/D2). Exceeding warn/critical emits detector_health_events.
  latency_budget_trigger_to_first_bbox_warn_s: 5.0
  latency_budget_trigger_to_first_bbox_critical_s: 8.0
  latency_budget_finalize_warn_ms: 5000
  latency_budget_finalize_critical_ms: 15000
  latency_budget_fusion_warn_ms: 1200
  latency_budget_fusion_critical_ms: 3500
  latency_budget_persist_warn_ms: 1500
  latency_budget_persist_critical_ms: 5000
  classifier_task_queue_maxsize: 8
  # Детектор-контракт не фиксируется на Bird-only: используем mixed class detector.
  detector_weight_contract: off
  models:
    # Candidate A (current default): TrapperAI v02.2024.
    # Fresh clone: перед запуском проверьте наличие весов (make sync-models).
    binary: "models/detection/weights/trapper_ai_v02_2024.pt"
    binary_openvino: "models/detection/weights/trapper_ai_v02_2024_openvino_model"
    # EU classifier (Birder 707): как trapper — .pt в корне weights + *_openvino_model/
    classifier: "models/classification/weights/convnext_v2_tiny_eu-common256px.pt"
    classifier_openvino: "models/classification/weights/convnext_v2_tiny_eu-common256px_openvino_model"
    # ONNX logistic baseline поведения (Gemm → softmax в коде). Дефолт: экспорт из demos JSON в дереве.
    # Перегенерация: `make ml-export-behavior-onnx` (нужен pip-пакет onnx в app/.venv).
    behavior_openvino: "models/behavior/meta/openvino"
  # Неопределённость YOLO-cls (#370): энтропия (наты) и margin top1−top2 по полному вектору probs.
  # null — не выставлять classifier_needs_review в decision rows; задайте пороги для AL/аналитики.
  classifier_uncertainty_entropy_ge: null
  classifier_uncertainty_margin_le: null
  # --- Re-ID / DINOv2 sidecar (SQLite table `reid_embedding`, offline/nearline jobs) (#389/#390)
  # Pipeline mode is informational for operators (realtime belongs to processor only after explicit pilot).
  reid_embedding_pipeline_mode: offline_batch
  # Product-facing similarity suggestions on video pages (requires contract metadata in `reid_embedding`).
  reid_suggestions_enabled: true
  # Hard stop for suggestions without deleting embeddings (emergency).
  reid_kill_switch: false
  # Shadow mode keeps ranking/policy alive server-side but disables UI suggestions via API filtering.
  reid_shadow_mode: false
  # Default cosine similarity gate for `suggest_same_individual` (per-species overrides below).
  reid_default_similarity_threshold: 0.86
  # Below this cosine similarity we treat match as inconclusive (never "same bird").
  reid_different_similarity_threshold: 0.35
  # Extra threshold boost when candidate recording path differs (proxy for different camera/session folder).
  reid_cross_camera_threshold_boost: 0.04
  # If embeddings are older than N hours, suppress suggestions (null = disable freshness gate).
  reid_max_embedding_age_hours: 8760
  # Optional per-species thresholds (species display name keys).
  reid_species_similarity_thresholds: {}
  # Auto-link bird profiles by embedding centroid similarity (Stage 6).
  reid_auto_link_enabled: true
  reid_auto_link_threshold_high: 0.95
  reid_auto_link_threshold_low: 0.75
  reid_auto_link_max_candidates: 8
  # SOTA-13: ReID gallery + expert queue (off until VPS validation of SOTA-10..12).
  reid_gallery_enabled: false
  reid_track_clustering_enabled: false
  reid_expert_queue_enabled: false
  reid_gallery_merge_cosine_threshold: 0.92
  reid_gallery_duplicate_threshold_low: 0.82
  reid_gallery_min_track_duration_sec: 0.6
  reid_gallery_max_cluster_members: 24
  # Runtime DINOv2 (finalize) — веса/кэш: models/reid/ (см. models/reid/README.md)
  reid:
    model: dinov2_vits14
    hub_cache_dir: models/reid/hub_cache
    hub_repo_local_path: ""
    runtime_enabled: true
    preload_on_start: true
    device: auto
    inference_backend: auto
    hub_download_timeout_seconds: 15
    candidate_cache_ttl_seconds: 120
    include_embedding_payload: false
    max_runtime_ms: 250
  # Baseline поведения (#416): логистическая регрессия по 3 признакам (manifest meta ↔ runtime proxy).
  # Веса: JSON из `scripts/ml_behavior_train_baseline.py` (schema behavior_logistic_export@v1).
  behavior_recognition:
    enabled: false
    # meta | video | auto | canary (meta decides, video_v1 shadow + discrepancy log).
    engine: meta
    # Инференс: logistic_json (numpy+json) | openvino (ONNX/IR через OpenVINO Runtime) | auto.
    inference_backend: auto
    # Если OpenVINO не загрузился/ошибка — вернуться к logistic_json из weights_path.
    openvino_fallback_logistic: true
    # Относительно корня app/processor/; в образе лежит стартовый JSON (см. models/behavior/README.md).
    weights_path: "models/behavior/meta/behavior_logistic_export@v1.json"
    confidence_store_min: 0.2
    confidence_review_threshold: 0.45
    # Active behavior video model (production). v1/v2 — _archive/experiments_*.
    active_video_model: "video_v2_1"
    video_model_kind: "video_v2_1"
    video_model_version: "video-v2-1"
    video_openvino_path: "models/behavior/video"
    video_weights_path: "models/behavior/video/behavior_video_export.json"
    video_confidence_store_min: 0.35
    canary_log_discrepancies: true
    # Ограничение числа треков при расчёте meta-признаков (согласовано с runtime baseline).
    max_runtime_detections: 50

# Video source: go2rtc | file
video:
  source: go2rtc
  # Для тестового режима source=file: абсолютный путь к mp4.
  file_path: ""
  # Для тестового режима source=file: если file_path пуст, используется плейлист из всех видео в папке.
  # В Docker смонтирован только /app/data — путь /workspace/datasets не существует без доп. volume.
  file_dir: "/app/data/file_test"
  # Для тестового режима source=file: зациклить файл (true) или остановиться в конце (false).
  file_loop: false
  # Максимум МиБ на один файл при upload через Hub (Library → офлайн-прогон). По умолчанию 10240 (>10000); в коде зажато 64..65536. Прокси (nginx client_max_body_size) может отдать 413 раньше приложения.
  file_test_max_upload_mb: 10240
  # true — имитировать realtime (пропуск кадров по elapsed), false — кадр за кадром для дебага.
  file_realtime_simulation: false
  # Хост Go2RTC: http://IP:1984
  go2rtc_url: ""
  go2rtc_username: ""
  go2rtc_password: ""
  # Кодирование записи: cpu | intel (встроенная видеокарта Intel — VA-API)
  encoding: cpu
  # При encoding=intel: использовать h264_vaapi для записи MP4 (true) или libx264 (false).
  # false — стабильнее на части iGPU/драйверов (ошибка encode issue 24 / битый moov), при этом
  # при capture_backend=auto захват для YOLO по-прежнему может идти через VA-API.
  record_with_vaapi: true
  # Захват кадров для motion/detection: auto | opencv | ffmpeg_vaapi.
  # auto: при encoding=intel пробует FFmpeg VA-API, иначе OpenCV; при ошибке fallback на OpenCV.
  capture_backend: auto
  # Запись с RTSP: h264 — перекодировать в H.264 (воспроизведение в браузере, меньше сюрпризов с HEVC).
  # copy — без перекодирования (ниже CPU; если поток HEVC, в Chrome может быть «Не удалось загрузить видео»).
  record_stream_codec: h264
  # Камеры — добавлять по одной. stream_name = имя потока в Go2RTC (main / запись, как Frigate record).
  # detect_stream_name — ОБЯЗАТЕЛЕН: второй поток Go2RTC для motion + YOLO (lores).
  # stream_name (main) — только FFmpeg-запись MP4; без detect_stream_name processor не стартует.
  # Detect substream в Go2RTC/Frigate: 704×576@~7fps. Hub: inference_lores_wh [704,576] — без даунскейла в 640².
  cameras: []
  # Config v2 (slot-centric, для разного числа камер у разных инсталляций):
  # - camera_profiles: шаблоны (имя/потоки/маски) без привязки к конкретному пользователю.
  # - camera_slots: фактические камеры (camera_1, camera_2, ...) + binding на profile.
  # Если camera_slots пустой, runtime автоматически читает legacy video.cameras.
  camera_profiles: {}
  camera_profile_bindings: {}
  camera_slots: []
  # Пример после добавления (ID и имена потоков задаёт пользователь в UI):
  # cameras:
  #   - id: yard_main
  #     stream_name: yard_main
  #     detect_stream_name: yard_detect
  #     name: "Двор"
  #   - id: feeder_hd
  #     stream_name: feeder_hd
  #     name: "Кормушка"
  #     tuning_role: feeder_close   # → processor.camera_tuning_by_role.feeder_close
  # Пример slot-конфига:
  # camera_profiles:
  #   feeder_closeup:
  #     detect_stream_name: feeder_detect
  # camera_slots:
  #   - slot: camera_1
  #     profile: feeder_closeup
  #     id: feeder
  #     stream_name: feeder_main
  #     name: "Feeder"
  pre_record_seconds: 5
  auto_reconnect: true
  # 0×0 = авто из probe record/main RTSP (per camera). Legacy WxH — только с force_recording_resolution.
  video_width: 0
  video_height: 0
  # true — legacy file-replay: video_width/height перекрывают probe; иначе ключи игнорируются.
  force_recording_resolution: false
  # 0 = авто из RTSP/файла; иначе фиксированный FPS для таймингов офлайн/симуляции.
  detect_fps: 0

# Триггеры записи — только ``triggers.*`` (см. ``trigger_config``). Устаревший блок ``motion:``
# в user YAML при загрузке мигрирует в ``triggers`` и удаляется; GET /api/ui/settings
# синтезирует ``motion.*`` из ``triggers`` для совместимости формы настроек.

# Grouped trigger model: user can enable any combination of sources.
triggers:
  opencv:
    enabled: true
    check_every_n_frames: 1
    # Пауза между опросами кадра (снижает CPU; 0.12 ≈ 8 Гц).
    check_interval_seconds: 0.12
    # Анализ движения на уменьшенном кадре (px по длинной стороне).
    motion_max_side_px: 512
    # frame_diff | mog2 | hybrid — на CPU VPS предпочтительно frame_diff.
    detection_method: frame_diff
    # Suppress early false positives while background model stabilizes.
    suppress_warmup_frames: 45
    # Auto switch day/night trigger profile by grayscale luma.
    auto_profile_enabled: true
    auto_profile_night_luma_threshold: 58.0
    diff_threshold: 20
    day_diff_threshold: 20
    night_diff_threshold: 16
    # Выше — меньше ложных стартов записи (ветка, автоэкспозиция) при Frigate+OpenCV.
    min_contour_area: 360
    day_min_contour_area: 320
    night_min_contour_area: 220
    # Умный триггер: не стартовать на AE/компрессии и «качании» крупной статики (кормушка).
    smart_trigger_enabled: true
    global_motion_mean_absdiff: 2.5
    day_global_motion_mean_absdiff: 2.5
    night_global_motion_mean_absdiff: 2.2
    min_motion_pixel_fraction: 0.0008
    day_min_motion_pixel_fraction: 0.0008
    night_min_motion_pixel_fraction: 0.0006
    max_contour_area_frac: 0.38
    day_max_contour_area_frac: 0.38
    night_max_contour_area_frac: 0.45
    # MOG2 knobs (used in mog2/hybrid mode).
    mog2_history: 300
    mog2_var_threshold: 24.0
    mog2_detect_shadows: false
    mog2_min_motion_pixel_fraction: 0.0006
    mog2_min_contour_area: 220
    # Deprecated: use video.cameras[].opencv_masks per camera (Live Editor). Not read by processor.
    masks: []
    # Require N consecutive motion frames before starting recording (debounce).
    min_consecutive_motion_frames: 2
    # Frigate lightning_threshold analog: recalibrate MOG2 when almost whole frame moves (IR/AE jump).
    scene_change_motion_fraction: 0.8
    # Optional CLAHE before motion (Frigate "improve contrast" tuning path).
    improve_contrast: false
    morphology_open_iterations: 1
  frigate:
    enabled: true
    topic: "frigate/events"
    camera_filter: []
    label_filter:
      - bird
      - Bird
      - jay
      - Jay
      - corvid
      - Corvid
      - squirrel
      - Squirrel
      - animal
      - Animal
    label_exclude:
      - cat
      - dog
    trigger_on_tracked_object: true
    # Мин. top_score события внешнего MQTT-детектора до старта клипа (0 = без порога).
    min_trigger_score: 0.43
    # false: старт записи только на Frigate type=new (не на каждый update/end).
    trigger_on_update: false
    # Разрешать fallback-триггер по geometry (когда label не в filter, но есть tracked box/region).
    geometry_fallback_enabled: false
    # Анти-шум: эти метки не должны запускать geometry-fallback запись.
    geometry_fallback_label_exclude: ["person", "car", "vehicle", "truck", "bus"]
    # Анти-дребезг: подавить повтор geometry-fallback для camera+label в пределах окна.
    geometry_fallback_cooldown_seconds: 5.0
  motion_sensor:
    enabled: false
    source: mqtt  # mqtt | esphome | pir
    mqtt_topic: ""
    esphome_url: ""
    esphome_sensor_id: ""
    pir_pin: 4
  scales:
    enabled: false
    source: mqtt  # mqtt | esphome
    motion_trigger_min_delta_kg: 0.02
    motion_trigger_debounce_seconds: 1.5

# MQTT - Frigate and BirdNET (confirmations)
mqtt:
  broker: ""
  port: 1883
  username: ""
  password: ""
  frigate_topic: "frigate/events"
  birdnet_topic: "birdnet"  # BirdNET-Go/Pi публикует сюда
  publish_topic: "birdlense/detections"
  # FIFO буфер входящих MQTT-событий для окна merge/fallback.
  max_events: 1200
  # Границы backpressure для исходящих publish в MQTT.
  publish_queue_max: 4000
  # Очередь фоновых записей веса кормушки.
  feeder_scale_queue_max: 400
  reconnect_min_delay: 5  # сек; стартовый backoff при потере связи
  reconnect_max_delay: 300  # сек; потолок backoff
  reconnect_jitter_ratio: 0.15  # ±15% jitter для несинхронных reconnect storm
  # Home Assistant MQTT Autodiscovery — публикация config и state для автообнаружения
  ha_discovery: true

system_metrics:
  # 0.0 = non-blocking snapshot; >0 enables blocking CPU sampling window.
  cpu_sample_interval_seconds: 0.0

# Detection fusion (detector/classifier + Frigate promotion)
detection:
  merge_window_seconds: 12
  dedup_window_seconds: 60
  # Гарантированно один результат на вид (устраняет дубликаты к одному посещению)
  one_per_species: true
  # Один вид — несколько ByteTrack id в одном ролике: не сливать в одну строку (кормушка, стая).
  one_per_species_keep_distinct_tracks: true
  # Generic «Bird» + тот же ролик с уверенным видом (YOLO classifier / accepted_species) → один результат
  absorb_generic_bird: true
  absorb_generic_bird_overlap_min_sec: 0.1
  absorb_generic_bird_min_classifier_confidence: 0.24
  # Для decision_kind != accepted_species: fusion не поднимает confidence выше pre_fusion + slack (0 — старое поведение).
  fusion_non_species_confidence_slack: 0.02
  # При конфликте разных sources: YOLO track остаётся primary, Frigate помогает promotion/boost.
  source_priority: ["yolo", "frigate"]
  # Weighted signal arbiter (BirdNET/regional/multi-camera priors).
  # classification-first: выкл. — вид из Birder на треке, без пересчёта confidence.
  weighted_arbiter_enabled: false
  weighted_arbiter_conf_weight: 0.55
  weighted_arbiter_detector_weight: 0.15
  weighted_arbiter_classifier_weight: 0.12
  weighted_arbiter_birdnet_weight: 0.08
  weighted_arbiter_regional_weight: 0.05
  weighted_arbiter_multicamera_weight: 0.05
  # При первом совпадении YOLO track и Frigate species в окне ролика — разово +bonus к confidence (потолок 1.0)
  cross_source_confidence_bonus: 0.02
  # Склейка соседних YOLO-фрагментов (ID switch) в один визит: одинаковый вид, малый gap и
  # пространственная непрерывность (IoU/center distance).
  track_fragment_merge_enabled: true
  track_fragment_merge_gap_sec: 1.2
  track_fragment_merge_min_iou: 0.08
  track_fragment_merge_max_center_dist: 0.18
  # Ниже порога детекция отбрасывается после fusion; должно быть ≤ processor.min_confidence_to_process.
  # Держим мягче, чтобы YOLO-треки не пропадали до записи в БД/overlay.
  min_confidence_to_store: 0.20
  # Track-first: keep bbox in DB for ingest contract; UI may hide via overlay_suppressed.
  strip_review_only_overlay_frames: false
  # Final gate before create_video: drop frameless video rows (no 400 on API contract).
  track_first_gate_enabled: true
  # Persist contract: YOLO track+bbox → БД; Birder EU — вид (enrichment, не veto).
  persist_mode: binary_track_first
  # Слой «судья» между classifier и persist — выкл. по умолчанию (упрощение live path).
  hypothesis_arbitration_enabled: false
  # Frigate — fallback при пустых YOLO-треках (blind-gate и force_after_no_yolo остаются).
  frigate_standalone_when_no_yolo: false
  # Hard guard: standalone разрешён только при подтверждённой слепоте YOLO (несколько подряд blind-сессий).
  frigate_standalone_require_blind_yolo: true
  frigate_standalone_blind_score_threshold: 0.7
  # Fail-safe: если YOLO не дал ни одного ряда в сессии дольше N секунд, включаем standalone
  # немедленно даже при незавершённом blind-подтверждении (предпочитаем recall > false negatives).
  frigate_standalone_force_after_no_yolo_seconds: 12
  # 7 FPS режим: blind подтверждаем по времени/кадрам, а не по коротким провалам.
  yolo_blind_required_consecutive_sessions: 1
  yolo_blind_min_duration_seconds: 30
  # Live System Health alert: Frigate-only extension without YOLO tracks (defaults to min_duration_seconds).
  yolo_blind_alert_seconds: 30
  # Readiness between-session monitor: recent motion within this window may flag blind/degraded.
  yolo_between_motion_max_age_seconds: 120
  # Bbox geometry IoU gate (letterbox roundtrip); see docs/ru/detection-geometry.ru.md
  bbox_iou_gate_enabled: true
  bbox_iou_gate_min: 0.85
  bbox_iou_gate_action: reject  # warn | reject — reject drops phantom letterbox bboxes
  yolo_blind_min_frames: 180
  # Учитывать просадку до 2 FPS: для blind-gate берётся min(min_frames, min_duration*min_effective_fps).
  yolo_blind_min_effective_fps: 2.0
  # Интегральная оценка слепоты (0..1) и двухфазное подтверждение.
  yolo_blind_score_threshold: 0.7
  yolo_blind_quickcheck_seconds: 2.0
  yolo_blind_quickcheck_min_confidence_binary: 0.05
  yolo_blind_quickcheck_min_confidence_binary_bird: 0.03
  yolo_blind_quickcheck_min_box_size_px: 10
  yolo_blind_min_frigate_only_frames: 120
  # Self-healing (phase-1): при подтверждённой слепоте запросить мягкий рестарт процессора через flag-файл.
  yolo_self_heal_restart_enabled: true
  yolo_self_heal_cooldown_seconds: 300
  yolo_self_heal_escalation_window_seconds: 900
  # Watchdog инференса: если эффективный FPS упал ниже порога при длительной сессии,
  # запускаем self-heal без перезапуска всего контейнера.
  yolo_watchdog_enabled: true
  yolo_watchdog_min_effective_fps: 1.2
  yolo_watchdog_min_duration_seconds: 20
  yolo_watchdog_min_frames: 40
  # При включении standalone мониторьте баланс провайдеров: fusion_provider_yolo должен оставаться доминирующим.
  # Если ровно один accepted_generic «Bird» от YOLO — НЕ подменять на Frigate standalone по умолчанию.
  # Иначе Frigate начинает доминировать как primary provider даже при наличии визуального YOLO-трека.
  frigate_standalone_when_no_accepted_species: false
  # Last-resort: Frigate-триггер + пустой fusion → review-only строка (без кадров YOLO).
  # По умолчанию выкл.: иначе Frigate MQTT (Bird Classification / sub_label) даёт вид на пустом клипе.
  frigate_trigger_review_salvage_enabled: false
  # true — разрешить salvage даже при 0 ByteTrack-треках (старое поведение; риск ложных видов на пустом видео).
  frigate_trigger_review_salvage_allow_without_yolo_tracks: false
  # Не строить standalone/review-only строки из MQTT по этим лейблам Frigate (person/human и т.д.).
  frigate_standalone_skip_labels:
    - person
    - human
    - car
    - vehicle
    - truck
    - bus
  # Мин. top_score Frigate для обычных лейблов (птица и т.д.).
  # Повышено для снижения ложных standalone и перекоса в сторону Frigate.
  frigate_standalone_min_score: 0.52
  # Если score в MQTT = 0 (часто snapshot), подставить для standalone; 0 = не подставлять.
  frigate_standalone_missing_score_fallback: 0.72
  # Лейблы из triggers.frigate.label_exclude: только БД/review, без merge в YOLO и без Telegram.
  frigate_standalone_excluded_min_score: 0.0
  frigate_standalone_excluded_missing_score_fallback: 0.58
  # false — standalone-визиты в БД без фото в Telegram (min_confidence_to_notify всё равно для остальных).
  frigate_standalone_notify: true
  # Panic gate: Frigate sees sustained activity but Hub accepts zero boxes.
  panic_gate_enabled: true
  panic_gate_min_frigate_events: 8
  panic_gate_min_duration_seconds: 20
  # Если у YOLO есть треки, но после Decision/Fusion всё отклонено — сохранить лучший трек как review_only,
  # чтобы не терять геометрию/overlay на длинных клипах со слабой уверенностью.
  yolo_weak_track_salvage_enabled: false
  yolo_weak_track_salvage_min_confidence: 0.012
  yolo_weak_track_salvage_max_rows: 5
  # После fusion: до N лучших YOLO-рядов, если fusion убрал все YOLO (legacy band-aid).
  # По умолчанию выкл. при persist_mode=binary_track_first (см. recording_finalize).
  yolo_core_anchor_enabled: false
  yolo_core_anchor_max_rows: 5
  # Learned fusion: optional learned scorer to blend multimodal signals and produce
  # a calibrated confidence. Disabled by default for safety.
  use_learned_fusion: false
  fusion_model_path: ""  # optional: models/fusion/weights/<scorer>.pt (см. models/fusion/README.md)
  fusion_alpha: 0.6      # blend weight for learned score (alpha * learned + (1-alpha) * base)
  # Варианты -> каноническое (Common name). Слияние в один вид для проекта.
  species_mapping:
    "Garrulus glandarius (Eurasian Jay)": "Eurasian Jay"
    "Eurasian_Jay": "Eurasian Jay"
    "Parus major (Great Tit)": "Great Tit"
    "Great_Tit": "Great Tit"
    "Cyanistes caeruleus (Eurasian Blue Tit)": "Eurasian Blue Tit"
    "Eurasian_Blue_Tit": "Eurasian Blue Tit"
