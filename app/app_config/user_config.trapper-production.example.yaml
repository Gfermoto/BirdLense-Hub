# TrapperAI v02.2024 — прод (фрагменты для user_config.yaml).
# Классы: class_maps/trapper_ai_v02_2024.yaml + patch_prod_trapper_user_config.py
#
# detect_stream / Frigate parity (YOLO blind fix 2026-06):
# RTSP Dahua/Hik detect_stream_name MUST match Frigate detect — lores substream subtype=1 (704×576).
# Main/record stream_name uses subtype=0. subtype=0 on detect = main 2688p → letterbox 704² kills conf.
# Go2RTC stream name is site-specific; set per camera in video.cameras[].

processor:
  inference_backend: openvino
  inference_device: "intel:gpu"
  openvino_binary_enabled: true
  models:
    binary: models/detection/weights/trapper_ai_v02_2024.pt
    binary_openvino: models/detection/weights/trapper_ai_v02_2024_openvino_model
  detector_scope: ["Bird", "Eurasian Red Squirrel"]
  detector_native_class_labels: true
  binary_predict_class_allowlist: [0, 5]
  inference_lores_wh: [704, 576]
  # Trapper 704² IR + intel:gpu — false: letterbox до binary_imgsz; true ломает OV track.
  openvino_native_lores_imgsz: false
  binary_imgsz: 704
  openvino:
    profile: latency
    num_requests: 0
    model_cache_enabled: true
  track_spatial_split_enabled: true
  track_spatial_split_max_center_jump_norm: 0.18
  track_spatial_split_min_segment_frames: 2
  tracker: models/tracker/bytetrack_birdlense_lowfps.yaml
  tracker_profiles:
    night: models/tracker/bytetrack_birdlense_night.yaml
  min_confidence_binary: 0.35
  min_confidence_binary_bird: 0.35
  min_confidence_binary_squirrel: 0.32
  openvino_min_confidence_binary_bird: 0.35
  openvino_binary_track_ultralytics_conf: 0.30
  species_confidence_overrides:
    Bird: 0.08  # persist gate; 0.32 blocked weak YOLO conf on detect 704×576
  auto_unstick_enabled: false
  auto_small_object_relax_enabled: false
  binary_track_iou: 0.62
  binary_track_max_det: 40
  min_box_size_px: 18

video:
  capture_backend: auto
  encoding: intel
  # cameras:
  #   - id: BirdBox
  #     stream_name: BirdBox          # main / record (FFmpeg MP4)
  #     detect_stream_name: rtsp://.../realmonitor?channel=1&subtype=1  # Frigate detect parity
  #     tuning_role: feeder_close

detection:
  yolo_weak_track_salvage_enabled: true
