# BirdLense Hub — один контейнер, один порт 8080
# Go2RTC — внешний (frigate), подключаемся через сеть

resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 8080;

  # Защита от path traversal
  if ($request_uri ~* "\.\.") { return 403; }

  # Записи: /data/recordings/... -> /app/data/recordings/
  location /data/ {
    alias /app/data/;
    autoindex off;
    add_header Accept-Ranges bytes;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }

  location ~ ^/api/ui/videos/[0-9]+/stream$ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location /api {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /processor/live {
    proxy_pass http://127.0.0.1:8082;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header Connection close;
  }

  location ~ ^/processor/live/([0-9]+)$ {
    proxy_pass http://127.0.0.1:8082;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header Connection close;
  }

  location /go2rtc/ {
    rewrite ^/go2rtc/(.*)$ /$1 break;
    proxy_pass http://frigate:1984;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;
  }
}
