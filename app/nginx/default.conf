# Resolver for dynamic upstream (avoids "host not found" at startup)
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 8080;

  location /docker_logs/ {
    alias /docker_logs/;
    autoindex on; # Enables directory listing
  }

  # Serve media files (e.g., http://localhost:8080/data/example.mp4)
  location /data/ {
    alias /srv/data/;  # Serve media files from /srv/data
    autoindex on;  # Optional: Enables directory listing for browsing
  }

  # Proxy requests to the UI (variable = resolve at request time)
  location / {
    set $ui_backend http://ui:5173;
    proxy_pass $ui_backend;

    # Enable WebSocket support
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
  }

  # Proxy API requests (variable = resolve at request time)
  location /api {
    set $web_backend http://web:8000;
    proxy_pass $web_backend;
  }

  # Multi-camera MJPEG: /processor/live/0 -> 8082, /1 -> 8083, ...
  location ~ ^/processor/live/([0-9]+)$ {
    resolver 127.0.0.11 valid=30s;
    set $idx $1;
    set $port 8082;
    if ($idx = "1") { set $port 8083; }
    if ($idx = "2") { set $port 8084; }
    if ($idx = "3") { set $port 8085; }
    if ($idx = "4") { set $port 8086; }
    if ($idx = "5") { set $port 8087; }
    if ($idx = "6") { set $port 8088; }
    if ($idx = "7") { set $port 8089; }
    proxy_pass http://processor:$port;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header Connection close;
  }

  # Single camera (default)
  location = /processor/live {
    resolver 127.0.0.11 valid=30s;
    set $processor_upstream http://processor:8082;
    proxy_pass $processor_upstream;

    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header Connection close;
  }
}

server {
  listen 8081;

  location / {
    proxy_pass http://ntfy/;
    proxy_http_version 1.1;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_redirect off;

    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_connect_timeout 3m;
    proxy_send_timeout 3m;
    proxy_read_timeout 3m;

    client_max_body_size 0; # Stream request body to backend
  }
}