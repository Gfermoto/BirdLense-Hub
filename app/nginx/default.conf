# Resolver for dynamic upstream (avoids "host not found" at startup)
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 8080;

  # Защита от path traversal (literal .. и encoded %2e%2e, %252e%252e)
  if ($request_uri ~* "\.\.|%2e%2e|%252e%252e") { return 403; }

  location /docker_logs/ {
    alias /docker_logs/;
    autoindex on; # Enables directory listing
  }

  # Serve media files (e.g., /data/recordings/2026/03/08/214914/video.mp4)
  location /data/ {
    alias /srv/data/;
    autoindex off;  # No folder listing - use Timeline in the app
  }

  # Static UI (built into nginx image)
  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }

  # MP4 по Range — без proxy_buffering (быстрее старт плеера)
  location ~ ^/api/ui/videos/[0-9]+/stream$ {
    set $web_backend http://web:8000;
    proxy_pass $web_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # Proxy API requests (variable = resolve at request time)
  location /api {
    set $web_backend http://web:8000;
    proxy_pass $web_backend;
  }

  # Multi-camera MJPEG: /processor/live/0 -> 8082, /1 -> 8083, ...
  location ~ ^/processor/live/([0-9]+)$ {
    resolver 127.0.0.11 valid=30s;
    set $idx $1;
    set $port 8082;
    if ($idx = "1") { set $port 8083; }
    if ($idx = "2") { set $port 8084; }
    if ($idx = "3") { set $port 8085; }
    if ($idx = "4") { set $port 8086; }
    if ($idx = "5") { set $port 8087; }
    if ($idx = "6") { set $port 8088; }
    if ($idx = "7") { set $port 8089; }
    proxy_pass http://processor:$port;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header Connection close;
  }

  # Go2RTC: WebRTC + MSE (fallback). Прокси к Go2RTC для live view.
  location /go2rtc/ {
    rewrite ^/go2rtc/(.*)$ /$1 break;
    proxy_pass http://frigate:1984;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;
  }

  # Single camera (default)
  location = /processor/live {
    resolver 127.0.0.11 valid=30s;
    set $processor_upstream http://processor:8082;
    proxy_pass $processor_upstream;

    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header Connection close;
  }
}
