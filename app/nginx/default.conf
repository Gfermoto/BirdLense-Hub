# Resolver for dynamic upstream (avoids "host not found" at startup)
resolver 127.0.0.11 valid=10s ipv6=off;

upstream birdlense_web {
  server web:8000;
  keepalive 32;
}

server {
  listen 8080;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types application/json application/javascript text/css text/plain text/xml application/xml;

  open_file_cache max=2000 inactive=30s;
  open_file_cache_valid 120s;
  open_file_cache_min_uses 2;
  open_file_cache_errors on;

  # Защита от path traversal (literal .. и encoded %2e%2e, %252e%252e)
  if ($request_uri ~* "\.\.|%2e%2e|%252e%252e") { return 403; }

  location /docker_logs/ {
    alias /docker_logs/;
    autoindex on; # Enables directory listing
  }

  # #339: только recordings/images/file_test; не отдаём /srv/data/db и прочее.
  location ^~ /data/recordings/ {
    alias /srv/data/recordings/;
    autoindex off;
    add_header Accept-Ranges bytes;
  }
  location ^~ /data/images/ {
    alias /srv/data/images/;
    autoindex off;
    add_header Accept-Ranges bytes;
  }
  location ^~ /data/file_test/ {
    alias /srv/data/file_test/;
    autoindex off;
    add_header Accept-Ranges bytes;
  }
  location ^~ /data/ {
    return 403;
  }

  # Static UI (built into nginx image)
  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }

  # MP4 по Range — без proxy_buffering (быстрее старт плеера)
  location ~ ^/api/ui/videos/[0-9]+/stream$ {
    proxy_pass http://birdlense_web;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 90s;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # Proxy API — keepalive к gunicorn
  location /api {
    proxy_pass http://birdlense_web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 90s;
    proxy_read_timeout 24h;
    proxy_send_timeout 24h;
    proxy_request_buffering off;
  }

  # Multi-camera MJPEG: /processor/live/0 -> 8082, /1 -> 8083, ...
  location ~ ^/processor/live/([0-9]+)$ {
    resolver 127.0.0.11 valid=30s;
    set $idx $1;
    set $port 8082;
    if ($idx = "1") { set $port 8083; }
    if ($idx = "2") { set $port 8084; }
    if ($idx = "3") { set $port 8085; }
    if ($idx = "4") { set $port 8086; }
    if ($idx = "5") { set $port 8087; }
    if ($idx = "6") { set $port 8088; }
    if ($idx = "7") { set $port 8089; }
    proxy_pass http://processor:$port;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header Connection close;
  }

  # Go2RTC: WebRTC + MSE (fallback). Прокси к Go2RTC для live view.
  location /go2rtc/ {
    rewrite ^/go2rtc/(.*)$ /$1 break;
    proxy_pass http://frigate:1984;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;
  }

  # Single camera (default)
  location = /processor/live {
    resolver 127.0.0.11 valid=30s;
    set $processor_upstream http://processor:8082;
    proxy_pass $processor_upstream;

    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header Connection close;
  }
}
