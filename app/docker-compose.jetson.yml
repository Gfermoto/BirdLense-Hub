# Jetson Nano override — merge: docker compose -f docker-compose.yml -f docker-compose.jetson.yml
# Активируется через BIRDLENSE_PLATFORM=jetson_nano (Makefile / deploy.sh).

services:
  birdlense:
    build:
      context: ..
      dockerfile: app/Dockerfile.jetson
      network: host
    shm_size: "1gb"
    network_mode: host
    ports: !reset []
    runtime: nvidia
    privileged: true
    restart: unless-stopped
    group_add:
      - video
    environment:
      - BIRDLENSE_PLATFORM=jetson_nano
      - BIRDLENSE_PORT=${BIRDLENSE_PORT:-8085}
      - BIRDLENSE_INFERENCE_BACKEND=${BIRDLENSE_INFERENCE_BACKEND:-torch}
      - BIRDLENSE_BINARY_TENSORRT_PATH=${BIRDLENSE_BINARY_TENSORRT_PATH:-}
      - BIRDLENSE_CLASSIFIER_ENGINE=${BIRDLENSE_CLASSIFIER_ENGINE:-chriamue}
      - BIRDLENSE_CLASSIFIER_INFERENCE_BACKEND=${BIRDLENSE_CLASSIFIER_INFERENCE_BACKEND:-onnxruntime}
      - JETSON_PROCESSOR_PYTHON=/opt/conda/envs/birdlense/bin/python
      - BIRDLENSE_OPENVINO_BINARY_ENABLED=0
      - API_URL_BASE=http://127.0.0.1:${BIRDLENSE_PORT:-8085}/api/processor
      - GO2RTC_URL=${GO2RTC_URL:-}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - LD_LIBRARY_PATH=/usr/local/cuda/lib64:/usr/lib/aarch64-linux-gnu/tegra
      - CUDA_HOME=/usr/local/cuda
      - LD_PRELOAD=/usr/lib/aarch64-linux-gnu/libgomp.so.1
    volumes:
      - ./processor/models/classification/chriamue_bird_species_classifier:/app/processor/models/classification/chriamue_bird_species_classifier
      - ./processor/models/detection/trapper_ai_v02_2024:/app/processor/models/detection/trapper_ai_v02_2024
      - ./processor/models/welfare/ornimetrics:/app/processor/models/welfare/ornimetrics
      - ./processor/models/reid/ornimetrics:/app/processor/models/reid/ornimetrics
      - ./processor/models/tracker:/app/processor/models/tracker
      # TensorRT python (JP4.6, py3.6) с хоста Jetson
      - /usr/lib/python3.6/dist-packages/tensorrt:/usr/lib/python3.6/dist-packages/tensorrt:ro
      # CUDA 10.2 runtime (libcublas.so.10 и др.)
      - /usr/local/cuda-10.2:/usr/local/cuda:ro
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 3G
