[tool.pytest.ini_options]
markers = [
    "heavy: loads real ML weights or large assets; skip with SKIP_HEAVY_PROCESSOR_TESTS=1 or pytest -m 'not heavy'",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint.per-file-ignores]
# OpenCV/ffmpeg env must run before processor_bootstrap imports cv2 (go2rtc).
"processor/src/main.py" = ["E402"]

[tool.interrogate]
fail-under = 80
exclude = ["tests"]
ignore-init-method = true
ignore-magic = true
ignore-semiprivate = true
ignore-nested-functions = true
verbose = 1
color = true
