# Minimal — Go2RTC + OpenCV motion + on-box YOLO; MQTT broker не обязателен.
# Процессор не поднимает MQTT-агрегатор при пустом mqtt.broker и без MQTT_BROKER в env.
#
# Установка: cp app/configs/minimal.yaml app/app_config/user_config.yaml
# Go2RTC: задайте video.go2rtc_url или GO2RTC_URL в app/.env

video:
  source: go2rtc
  cameras:
    - id: bird_cam
      stream_name: bird_cam

# Legacy ключ; runtime сводит к triggers.* (см. trigger_config).
motion:
  source: opencv

# Явно: только OpenCV; Frigate / бинарный PIR / весы — выкл (без брокера не используются).
triggers:
  opencv:
    enabled: true
    check_every_n_frames: 1
    diff_threshold: 18
    min_contour_area: 240
  frigate:
    enabled: false
    topic: "frigate/events"
  motion_sensor:
    enabled: false
    source: mqtt
    mqtt_topic: ""
    esphome_url: ""
    esphome_sensor_id: ""
  scales:
    enabled: false

mqtt:
  broker: ""
  ha_discovery: false

retention:
  days: 30
