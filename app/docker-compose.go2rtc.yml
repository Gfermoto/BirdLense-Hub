# Профиль hybrid: Go2RTC в составе стека
# minimal: без Go2RTC (используйте внешний, GO2RTC_URL в .env)
#
# Запуск: docker compose -f docker-compose.base.yml -f docker-compose.go2rtc.yml --profile hybrid up -d

services:
  go2rtc:
    profiles:
      - hybrid
    image: blakeblackshear/go2rtc:latest
    container_name: birdlense_go2rtc
    restart: unless-stopped
    ports:
      - "1984:1984"
    # Add camera sources in Go2RTC UI at http://localhost:1984
