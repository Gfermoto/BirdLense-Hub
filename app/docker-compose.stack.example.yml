# Пример: PostgreSQL к основному docker-compose.yml.
# Redis уже поднимается в docker-compose.yml по умолчанию.
#
# Запуск:
#   docker compose -f docker-compose.yml -f docker-compose.stack.example.yml up -d
#
# Миграция данных с SQLite на PostgreSQL — отдельно (дамп/импорт или новая БД).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: birdlense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_env}
      POSTGRES_DB: birdlense
    volumes:
      - birdlense_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U birdlense -d birdlense"]
      interval: 5s
      timeout: 5s
      retries: 5

  birdlense:
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://birdlense:${POSTGRES_PASSWORD:-change_me_in_env}@postgres:5432/birdlense
      SQLALCHEMY_POOL_SIZE: ${SQLALCHEMY_POOL_SIZE:-5}
      SQLALCHEMY_MAX_OVERFLOW: ${SQLALCHEMY_MAX_OVERFLOW:-15}

volumes:
  birdlense_pgdata:
