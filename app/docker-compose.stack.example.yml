# Пример: BirdLense + Redis (общий TTL-кэш API) + PostgreSQL (высокая запись).
# Скопируйте в docker-compose.override.yml или подключите: docker compose -f docker-compose.yml -f docker-compose.stack.example.yml up -d
# Миграция данных с SQLite на PostgreSQL — вручную (дамп/импорт или свежая БД).

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: birdlense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_env}
      POSTGRES_DB: birdlense
    volumes:
      - birdlense_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U birdlense -d birdlense"]
      interval: 5s
      timeout: 5s
      retries: 5

  birdlense:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://birdlense:${POSTGRES_PASSWORD:-change_me_in_env}@postgres:5432/birdlense
      SQLALCHEMY_POOL_SIZE: ${SQLALCHEMY_POOL_SIZE:-5}
      SQLALCHEMY_MAX_OVERFLOW: ${SQLALCHEMY_MAX_OVERFLOW:-15}

volumes:
  birdlense_pgdata:
