# Развёртывание из готового образа (без сборки)
# Использование: docs/user/install.md — Option 4 / docs/ru/install.ru.md — Вариант 4
#
#   export BIRDLENSE_IMAGE=ghcr.io/gfermoto/birdlense-hub:latest   # или свой registry
#   cp .env.example .env   # и заполнить PROCESSOR_SECRET, FLASK_SECRET_KEY и при необходимости MQTT_* и др.
#   mkdir -p data/recordings data/db app_config
#   docker compose -f docker-compose.image.yml up -d

services:
  birdlense:
    image: ${BIRDLENSE_IMAGE:-ghcr.io/gfermoto/birdlense-hub:latest}
    container_name: birdlense
    ports:
      - "${BIRDLENSE_PORT:-8085}:8080"
    volumes:
      - ./data:/app/data
      - ./app_config:/app/app_config
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/data
      - API_URL_BASE=http://127.0.0.1:8000/api/processor
      - PROCESSOR_SECRET=${PROCESSOR_SECRET:-}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-}
      - BIRDLENSE_ENV=${BIRDLENSE_ENV:-}
      - GO2RTC_URL=${GO2RTC_URL:-}
      - MQTT_BROKER=${MQTT_BROKER:-}
      - MQTT_USERNAME=${MQTT_USERNAME:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - MCP_TOKEN=${MCP_TOKEN:-}
      - BIRDLENSE_STRICT_API_AUTH=${BIRDLENSE_STRICT_API_AUTH:-}
      - BIRDLENSE_UI_API_KEY=${BIRDLENSE_UI_API_KEY:-}
      - BIRDLENSE_HIDE_DIRECT_RECORDINGS=${BIRDLENSE_HIDE_DIRECT_RECORDINGS:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/ui/health"]
      interval: 30s
      timeout: 10s
      retries: 3
