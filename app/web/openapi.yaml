openapi: 3.0.3
info:
  title: BirdLense Hub UI API
  version: 0.3.5
  description: |
    BirdLense Hub is an automated bird feeder monitoring and analytics system. It uses video and audio processing to detect, identify, and log bird (and other animal) visits, providing rich statistics, visualizations, and configuration options via a REST API. The API supports:
      - Querying real-time and historical bird visit data
      - Retrieving and managing video, species, and food information
      - Accessing system health, metrics, and storage usage
      - Configuring system settings (e.g., detection parameters, notification preferences)

    The API is organized into several groups:
      - UI routes: Endpoints for retrieving and managing bird, video, food, and visit data, as well as system configuration.
      - System routes: Endpoints for system health, metrics, activity logs, and storage management.
      - Settings: Endpoints for reading and updating the system configuration.

    All endpoints return JSON. PATCH/POST endpoints may update system state. No authentication is required by default, but this can be enabled in deployment.

    When MCP is enabled, the same REST surface is also available to **authorized MCP clients** ([Model Context Protocol](https://modelcontextprotocol.io/)) at `/mcp` on the hub: automation, IDE integrations, or custom tooling can query visits, status, and configuration or perform allowed operations under `MCP_TOKEN`.
servers:
  - url: http://birdlense.local/api/ui
paths:
  /health:
    get:
      summary: Health check
      description: |
        Returns a simple status object indicating if the BirdLense Hub API is running. Use this to verify connectivity and service health.
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /readiness:
    get:
      summary: Readiness check
      description: |
        Returns a richer operational payload for install/deploy verification. Unlike `/health`,
        this includes database and filesystem checks plus the same component summary used by the UI.
      responses:
        "200":
          description: Core services and writable paths are ready
          content:
            application/json:
              schema:
                type: object
                required: [status, ready, checked_at, checks, components]
                properties:
                  status:
                    type: string
                    example: ok
                  ready:
                    type: boolean
                    example: true
                  checked_at:
                    type: string
                    format: date-time
                  checks:
                    type: object
                    properties:
                      database:
                        type: object
                        properties:
                          status:
                            type: string
                      data_dir:
                        type: object
                        properties:
                          path:
                            type: string
                          exists:
                            type: boolean
                          is_dir:
                            type: boolean
                          writable:
                            type: boolean
                          status:
                            type: string
                      app_config_dir:
                        type: object
                        properties:
                          path:
                            type: string
                          exists:
                            type: boolean
                          is_dir:
                            type: boolean
                          writable:
                            type: boolean
                          status:
                            type: string
                  components:
                    type: object
                    properties:
                      web:
                        type: string
                      processor:
                        type: string
                      video:
                        type: string
                      mqtt:
                        type: string
                      esphome:
                        type: string
                      yolo:
                        type: string
                      motion_source:
                        type: string
                        description: Comma-separated effective trigger ids, or `none` (same resolver as active_triggers).
                      trigger_display:
                        type: string
                        description: Space-join of trigger ids with ` + ` (matches processor recording_context); empty if none.
                      active_triggers:
                        type: array
                        items:
                          type: string
                          enum: [opencv, frigate, motion_sensor, scales]
                        description: Enabled motion trigger keys from effective config.
                      birdnet_url:
                        type: string
                        nullable: true
        "503":
          description: App is up but not fully ready for use
          content:
            application/json:
              schema:
                type: object
                required: [status, ready, checked_at, checks, components]
                properties:
                  status:
                    type: string
                    example: degraded
                  ready:
                    type: boolean
                    example: false
                  checked_at:
                    type: string
                    format: date-time
                  checks:
                    type: object
                    properties:
                      database:
                        type: object
                        properties:
                          status:
                            type: string
                          error:
                            type: string
                      data_dir:
                        type: object
                        properties:
                          path:
                            type: string
                          exists:
                            type: boolean
                          is_dir:
                            type: boolean
                          writable:
                            type: boolean
                          status:
                            type: string
                      app_config_dir:
                        type: object
                        properties:
                          path:
                            type: string
                          exists:
                            type: boolean
                          is_dir:
                            type: boolean
                          writable:
                            type: boolean
                          status:
                            type: string
                  components:
                    type: object
                    properties:
                      web:
                        type: string
                      processor:
                        type: string
                      video:
                        type: string
                      mqtt:
                        type: string
                      esphome:
                        type: string
                      yolo:
                        type: string
                      motion_source:
                        type: string
                        description: Comma-separated effective trigger ids, or `none`.
                      trigger_display:
                        type: string
                        description: Trigger ids joined with ` + `; empty if none enabled.
                      active_triggers:
                        type: array
                        items:
                          type: string
                          enum: [opencv, frigate, motion_sensor, scales]
                      birdnet_url:
                        type: string
                        nullable: true
  /status:
    get:
      summary: Component status
      description: |
        Returns the lightweight component summary used by the navigation indicators in the UI.
      responses:
        "200":
          description: Current component status payload
          content:
            application/json:
              schema:
                type: object
                required: [web, processor, video, mqtt, yolo]
                properties:
                  web:
                    type: string
                  processor:
                    type: string
                  video:
                    type: string
                  mqtt:
                    type: string
                  esphome:
                    type: string
                  yolo:
                    type: string
                  motion_source:
                    type: string
                    description: Comma-separated effective trigger ids, or `none`.
                  trigger_display:
                    type: string
                    description: Trigger ids joined with ` + `; empty if none enabled.
                  active_triggers:
                    type: array
                    items:
                      type: string
                      enum: [opencv, frigate, motion_sensor, scales]
                  birdnet_url:
                    type: string
                    nullable: true
  /weather:
    get:
      summary: Get current weather
      description: |
        Returns the current weather conditions at the configured location. Weather data is fetched from OpenWeatherMap and cached for efficiency. Useful for correlating bird activity with weather.
      responses:
        "200":
          description: Weather data
          content:
            application/json:
              schema:
                type: object
                properties:
                  main:
                    type: string
                  description:
                    type: string
                  temp:
                    type: number
                  humidity:
                    type: number
                  pressure:
                    type: number
                  clouds:
                    type: number
                  wind_speed:
                    type: number
  /sun-times:
    get:
      summary: Get sunrise/sunset times
      description: |
        Returns dawn, sunrise, noon, sunset, dusk for a given date at the configured location (lat/lon from settings). Times are in UTC (ISO format); frontend displays in local timezone.
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
            example: "2026-03-17"
          description: Date in YYYY-MM-DD format
      responses:
        "200":
          description: Sun times (ISO UTC strings)
          content:
            application/json:
              schema:
                type: object
                properties:
                  dawn:
                    type: string
                    format: date-time
                  sunrise:
                    type: string
                    format: date-time
                  noon:
                    type: string
                    format: date-time
                  sunset:
                    type: string
                    format: date-time
                  dusk:
                    type: string
                    format: date-time
  /videos/{video_id}:
    get:
      summary: Get video details
      description: |
        Retrieve detailed information about a specific video recording, including detected species, food present, and weather at the time. Per-frame track geometry (bbox) is not included here — use GET /videos/{video_id}/detection-frames to avoid multi-megabyte JSON on the initial page load.
      parameters:
        - in: path
          name: video_id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Video details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoDetails"
        "404":
          description: Video not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /videos/{video_id}/detection-frames:
    get:
      summary: Per-detection track frames (bbox over time)
      description: |
        Returns bbox keyframes for each VideoSpecies row that has stored frame data. Large payload — intended to load after the main video details response. IDs match `species[].id` from GET /videos/{video_id}.
      parameters:
        - in: path
          name: video_id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Track frame lists keyed by detection id
          content:
            application/json:
              schema:
                type: object
                properties:
                  tracks:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: VideoSpecies row id
                        species_id:
                          type: integer
                        start_time:
                          type: number
                        end_time:
                          type: number
                        frames:
                          type: array
                          description: Time-normalized bbox keyframes
        "404":
          description: Video not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /videos/{video_id}/neighbors:
    get:
      summary: Previous/next video on the same calendar day
      description: |
        IDs of the previous and next recordings in an ordered list for a day. Default `day_scope=utc` uses the UTC calendar date of the video's `start_time`; `day_scope=local` uses the operator-local day (`tz_offset_minutes`, JS-style). Ordering is by `start_time` ascending, then `id` ascending. Optional `cross_day` can surface neighbors from adjacent days when at the first/last clip of the day.
        When `neighbor_mode=visit_primary`, **`visit_id` is required** (400 if missing). The ordered list is **primary videos per visit** in that day scope (not every clip of the day); `index`/`previous_id`/`next_id` refer to that list, and `video_id` must be the primary clip for the given visit.
      parameters:
        - in: path
          name: video_id
          required: true
          schema:
            type: integer
        - in: query
          name: day_scope
          required: false
          schema:
            type: string
            enum: [utc, local]
            default: utc
        - in: query
          name: tz_offset_minutes
          required: false
          schema:
            type: integer
            default: 0
        - in: query
          name: cross_day
          required: false
          schema:
            type: boolean
            default: false
        - in: query
          name: neighbor_mode
          required: false
          schema:
            type: string
            enum: [video, visit_primary]
            default: video
        - in: query
          name: visit_id
          required: false
          description: Required when `neighbor_mode=visit_primary` (SpeciesVisit id).
          schema:
            type: integer
      responses:
        "200":
          description: Neighbor video IDs and position in the day's list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoNeighbors"
        "400":
          description: Invalid query parameters (e.g. bad `day_scope`, missing `visit_id` for `visit_primary`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Video not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /videos/{video_id}/fusion-trace:
    get:
      summary: Fusion decision trace for a recording
      description: |
        Returns the latest `decision_trace` ActivityLog row linked to this video (`video_id` in payload after processor ingest, or legacy match on `video_path`). Used for debugging fusion (detector → classifier → audio priors). Raw `trace` mirrors the processor payload (`persisted_tracks` / `accepted_tracks` alias — rows stored on the clip; `rejected_tracks` — not persisted). `tracks[].bucket` is `persisted` for the clip list and `rejected` for the reject list (`accepted` kept for backward compatibility with older API clients).

        **Auth:** contributor (operator) or admin session only — not for anonymous viewers (same as download/merge).
      parameters:
        - in: path
          name: video_id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Trace payload or `available=false` if no log matched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FusionTraceResponse"
        "403":
          description: Access denied (contributor or admin session required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Video not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /birdfood:
    get:
      summary: List all bird food
      description: |
        Retrieve a list of all bird food items configured in the system. This includes details like name, active status, and description. Useful for managing and displaying available bird food options.
      responses:
        "200":
          description: List of bird food
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BirdFood"
    post:
      summary: Add new bird food
      description: |
        Add a new bird food item to the system. Provide the name and active status. Optionally, include a description. The new item will be available in the bird food list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                active:
                  type: boolean
      responses:
        "201":
          description: Bird food added
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /birdfood/{birdfood_id}/toggle:
    patch:
      summary: Toggle bird food active status
      description: |
        Toggle the active status of a bird food item. This can be used to enable or disable a food item without deleting it. The item will still appear in the list but will be marked as inactive if toggled off.
      parameters:
        - in: path
          name: birdfood_id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Status toggled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /overview:
    get:
      summary: Get overview statistics
      description: |
        Retrieve key statistics and top species information for a given date. This provides a high-level view of bird activity and system detections. Useful for quick checks and monitoring trends.

        Note: `busiestHour` and each index in `topSpecies.detections` use the **observer-local** hour (same as the timeline), derived from configured coordinates / timezone — not necessarily UTC.
      parameters:
        - in: query
          name: date
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Overview data
          content:
            application/json:
              schema:
                type: object
                properties:
                  topSpecies:
                    type: array
                    items:
                      $ref: "#/components/schemas/TopSpecies"
                  stats:
                    $ref: "#/components/schemas/OverviewStats"
                  hourlyTemperature:
                    type: array
                    description: Per-hour mean temperature (°C) from recordings; null if no sample
                    items:
                      type: number
                      nullable: true
                  lastDetection:
                    type: object
                    nullable: true
                    properties:
                      species_name:
                        type: string
                      start_time:
                        type: string
                        format: date-time
                        nullable: true
                  observer_timezone:
                    type: string
                    description: IANA timezone name used for local-hour bucketing
        "400":
          description: Invalid date format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /timeline:
    get:
      summary: Get timeline of species visits
      description: |
        Retrieve a timeline of species visits, including start and end times, weather conditions, optional feeder-scale delta (same shape as GET video `scales`, from the visit's earliest linked video), and detected species. All timestamps (including start_time and end_time) are in UTC. The maximum allowed date range between start_time and end_time is 1 day (24 hours). All returned dates are also in UTC.
      parameters:
        - in: query
          name: start_time
          required: true
          schema:
            type: integer
            description: Unix timestamp (UTC)
        - in: query
          name: end_time
          required: true
          schema:
            type: integer
            description: Unix timestamp (UTC)
      responses:
        "200":
          description: Timeline data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimelineVisit"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /unknowns:
    get:
      summary: Get low-confidence detections for review
      description: |
        Returns low-confidence detections (and generic "Bird" rows) for manual review.
        All timestamps are UTC. Maximum interval between start_time and end_time is 1 day.
      parameters:
        - in: query
          name: start_time
          required: true
          schema:
            type: integer
            description: Unix timestamp (UTC)
        - in: query
          name: end_time
          required: true
          schema:
            type: integer
            description: Unix timestamp (UTC)
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: List of detections requiring review
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UnknownDetection"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /species:
    get:
      summary: List all species
      description: |
        Retrieve a list of all bird species that have been detected by the system. This includes summary information like name, parent species, and detection count. Useful for managing species data and monitoring diversity.
        With ``exclude_suspects=1``, rows matching ``species_suspect_blocklist.txt`` (objects / non-bird COCO labels) are omitted for the Bird Directory UI.
      parameters:
        - in: query
          name: exclude_suspects
          required: false
          schema:
            type: boolean
          description: If true, filter out catalog rows flagged by the data-quality blocklist.
      responses:
        "200":
          description: List of species
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpeciesSummary"
  /bird_families:
    get:
      summary: Get all bird families
      description: |
        Retrieve a list of all bird families in the system. This groups species into their respective families, providing a higher-level view of bird diversity and relationships. Useful for educational purposes and detailed analysis.
      responses:
        "200":
          description: List of bird families
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BirdFamily"
        "404":
          description: Birds category not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /settings:
    get:
      summary: Get app settings
      description: |
        Retrieve the current application settings, including notification preferences, processor settings, and secret keys. This is useful for understanding the current configuration and for debugging purposes.
      responses:
        "200":
          description: App settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    patch:
      summary: Update app settings
      description: |
        Update the application settings. Provide a JSON object with the new settings values. This can be used to change notification preferences, processor settings, and other configuration options.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          description: No data provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /settings/ebird-species-mapping-suggestions:
    get:
      summary: eBird species mapping suggestions
      description: |
        Lists regional eBird top species that do not match a catalog Species name after the current
        ``ebird.species_mapping``. Suggests case fixes or fuzzy matches. Requires the same access as GET /settings.
      responses:
        "200":
          description: Suggestion list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EbirdMappingSuggestionsResponse"
        "403":
          description: Password required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /species/{species_id}/summary:
    get:
      summary: Get summary for a species
      description: |
        Retrieve the detailed summary for a specific species (read-only: does not run wiki/metadata
        enrichment or change the database). Use System → species registry enrichment jobs to refresh
        images and descriptions. Includes coarse ``metadata_trust`` for UI disclosure.
      parameters:
        - in: path
          name: species_id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Species summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpeciesSummaryDetails"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /corrections/recent:
    get:
      summary: Get recent manual species corrections
      description: |
        Returns recent correction history entries for unified Unknowns and Video correction flow.
        Requires contributor or admin access.
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Recent correction entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CorrectionHistoryEntry"
        "403":
          description: Password required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /system/metrics:
    get:
      summary: Get live system metrics
      description: |
        Instant host snapshot (CPU, memory, disk, optional GPU). Polled by the System page; no database aggregates. Visitor statistics are on `GET /system/visitors`.
      responses:
        "200":
          description: System metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemMetrics"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /system/metrics/history:
    get:
      summary: System metrics time series
      description: |
        Downsampled samples from SQLite (`system_resource_sample`), written by a background thread (~30 s). Used for System page charts.
      parameters:
        - in: query
          name: hours
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 168
            default: 24
        - in: query
          name: max_points
          required: false
          schema:
            type: integer
            minimum: 50
            maximum: 2000
            default: 500
      responses:
        "200":
          description: Metric samples
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemMetricsHistory"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /system/visitors:
    get:
      summary: Visitor statistics over a period
      description: |
        SpeciesVisit-based unique session counts for the selected day window. Independent of live host metrics.
      parameters:
        - in: query
          name: days
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 7
      responses:
        "200":
          description: Visitor aggregate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitorStats"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /system/activity:
    get:
      summary: Get system activity log
      description: |
        Retrieve the system activity log, showing the history of detections, uploads, and other significant events. This is useful for auditing and debugging purposes.
      parameters:
        - in: query
          name: month
          required: false
          schema:
            type: string
            pattern: '^\\d{4}-\\d{2}$'
      responses:
        "200":
          description: Activity log
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityLogEntry"
        "400":
          description: Invalid `month` query (expected `YYYY-MM`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /system/config-audit:
    get:
      summary: Configuration audit (YAML keys, recall tuning, MQTT scales)
      description: |
        Operator-facing snapshot: deprecated/unknown keys in raw `user_config.yaml`, Telegram proxy hints,
        species mapping sanity, motion/recall tuning fields, **MQTT feeder scales** status (broker, resolved weight topic),
        and merged warning strings (`recall_warnings` + `scales_warnings` in `config_warnings`) for review and fixes.
        Requires the same settings/session access as other protected system views when passwords are enabled.
      responses:
        "200":
          description: Audit payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigAuditResponse"
        "401":
          description: Settings password required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /system/logs:
    get:
      summary: Tail of processor log file
      description: |
        Returns the last N lines of `processor.log` under the data directory for remote diagnostics.
        Requires the same settings/session access as other protected system views when passwords are enabled.
      parameters:
        - in: query
          name: lines
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Log lines and resolved path
          content:
            application/json:
              schema:
                type: object
                properties:
                  lines:
                    type: array
                    items:
                      type: string
                  path:
                    type: string
        "403":
          description: Settings password required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to read log file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /system/file-test/files:
    get:
      summary: List file-test replay videos
      description: |
        Lists video files in `video.file_dir` when `video.source=file`. Library UI uses this for offline replay without container restart (#270).
      responses:
        "200":
          description: File list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileTestFilesResponse"
        "403":
          description: Settings password required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Not in file replay mode (`video.source` is not `file`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /system/file-test/status:
    get:
      summary: File-test processor status
      description: |
        Returns desired state (`file_test_control/desired.json`), processor-written `status.json` (current clip, index, phase), config hints, and `video_source`.
        Always succeeds when settings are readable: use `video_source === "file"` to know if replay APIs are usable (mutating routes still return 409 when not in file mode).
      responses:
        "200":
          description: Status payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileTestStatusResponse"
        "400":
          description: Invalid or unusable `video.file_dir`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Settings password required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /system/file-test/upload:
    post:
      summary: Upload a file-test video
      description: Admin-only. Multipart field `file`. Max size 500 MiB; extensions mp4/mov/mkv.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  name:
                    type: string
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Not in file replay mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: File too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /system/file-test/files/{name}:
    delete:
      summary: Delete a file-test video
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Not in file replay mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /system/file-test/run:
    post:
      summary: Arm file-test replay / update loop
      description: |
        Writes `desired.json` for the processor. Empty body arms playback (start). Optional `armed` and `loop` booleans.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                armed:
                  type: boolean
                loop:
                  type: boolean
      responses:
        "200":
          description: Updated desired state
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  desired:
                    type: object
                    additionalProperties: true
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Not in file replay mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /system/file-test/stop:
    post:
      summary: Stop file-test replay
      description: Disarms playback and requests abort of the current session (processor clears abort when the session ends).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                abort:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Updated desired state
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  desired:
                    type: object
                    additionalProperties: true
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Not in file replay mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /system/processor-weights/status:
    get:
      summary: Custom processor weights status (#276)
      description: |
        Effective paths for binary detector, classifier, and species allowlist; whether each file lives under
        `DATA_DIR/custom_weights`; sizes and mtimes. Settings password (or MCP Bearer) required.
      responses:
        "200":
          description: Status payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "403":
          description: Password required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /system/processor-weights/upload:
    post:
      summary: Upload custom .pt or class_names.txt (#276)
      description: |
        Multipart field `file`. Query `role` = `binary` | `classifier` | `class_names`.
        For `classifier`, either a readable allowlist file must exist or `acknowledge_classifier_only=1`.
        Writes under `DATA_DIR/custom_weights/`, updates `user_config`, reloads app config, sets processor restart flag.
        Admin-only when contributor password is enabled. Max 2 GiB for .pt (zip-style checkpoint), 32 MiB for .txt.
      parameters:
        - name: role
          in: query
          required: true
          schema:
            type: string
            enum: [binary, classifier, class_names]
        - name: acknowledge_classifier_only
          in: query
          required: false
          schema:
            type: string
            description: Set to 1/true/yes to skip allowlist-exists check for classifier upload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  path:
                    type: string
                  role:
                    type: string
                  status:
                    type: object
                    additionalProperties: true
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /system/processor-weights/reset:
    post:
      summary: Reset custom weights to built-in defaults (#276)
      description: |
        JSON body `{ "roles": ["binary"] | ["classifier"] | ["class_names"] | ["all"] | combinations }`.
        Removes files in `custom_weights` and clears matching keys from user_config when they pointed there.
        Sets processor restart flag. Admin-only when contributor password is enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles:
                  type: array
                  items:
                    type: string
                    enum: [binary, classifier, class_names, all]
      responses:
        "200":
          description: Reset done
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  removed_files:
                    type: array
                    items:
                      type: string
                  status:
                    type: object
                    additionalProperties: true
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /system/species-registry/seed:
    post:
      summary: Seed species registry from bundled mapping
      description: |
        **Settings / admin:** seeds canonical species registry and aliases. Busts related caches on success.
      responses:
        "200":
          description: Seed statistics
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                additionalProperties: true
        "403":
          description: Password required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /system/species-registry/backfill:
    post:
      summary: Backfill Species rows with taxon links
      description: |
        **Settings / admin:** links existing `Species` rows to canonical taxa. Default `dry_run: true`.
        Use `dry_run: false` to apply; optional `limit` caps rows per run.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run:
                  type: boolean
                  default: true
                limit:
                  type: integer
                  nullable: true
      responses:
        "200":
          description: Backfill statistics
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                additionalProperties: true
        "400":
          description: Invalid body (e.g. limit not int)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Password required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /system/species-registry/unresolved:
    get:
      summary: Unresolved species names from resolver
      description: |
        **Settings / admin:** top unresolved names captured during resolution.
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 5000
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                type: object
                required: [items, count]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  count:
                    type: integer
        "403":
          description: Password required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /system/species-registry/enrich-metadata/start:
    post:
      summary: Start async species metadata enrichment
      description: |
        **Settings / admin:** starts background job. Returns **409** if a run is already active.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type: integer
                  default: 300
                retry_failed_only:
                  type: boolean
                  default: false
      responses:
        "202":
          description: Job accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  status:
                    type: object
                    additionalProperties: true
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Password required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Enrichment already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /system/species-registry/enrich-metadata/status:
    get:
      summary: Species metadata enrichment job status
      description: |
        **Settings / admin:** live status for async enrichment.
      responses:
        "200":
          description: Status snapshot
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "403":
          description: Password required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /system/species-registry/health:
    get:
      summary: Species registry rollout health
      description: |
        **Settings / admin:** coverage and rollout metrics for the registry.
      responses:
        "200":
          description: Health payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "403":
          description: Password required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /system/species-registry/materialize-allowlist:
    post:
      summary: Materialize missing allowlist Species rows
      description: |
        **Settings / admin:** creates missing catalog rows for classifier allowlist; optional metadata fill.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run:
                  type: boolean
                  default: false
                fill_metadata:
                  type: boolean
                  default: true
                limit:
                  type: integer
                  default: 5000
      responses:
        "200":
          description: Result body from materialization
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Password required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /system/species-registry/repair-cards/start:
    post:
      summary: Start background species card repair
      description: |
        **Settings / admin:** repairs catalog card images/metadata. Returns **409** if already running.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type: integer
                  default: 6000
      responses:
        "202":
          description: Job accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  status:
                    type: object
                    additionalProperties: true
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Password required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Repair already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /system/species-registry/repair-cards/status:
    get:
      summary: Species card repair job status
      description: |
        **Settings / admin:** includes live coverage counters and scheduler hints.
      responses:
        "200":
          description: Status snapshot
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "403":
          description: Password required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /system/species-registry/data-quality:
    get:
      summary: Catalog data quality report
      description: |
        **Settings / admin:** duplicates and cleanup hints for the species catalog.
      parameters:
        - in: query
          name: duplicate_limit
          required: false
          schema:
            type: integer
            default: 80
            minimum: 10
            maximum: 500
      responses:
        "200":
          description: Report JSON
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "403":
          description: Password required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /system/species-registry/classifier-dataset-alignment:
    get:
      summary: Classifier vs catalog vs dataset alignment
      description: |
        **Settings / admin:** compares classifier class names, DB catalog, and on-disk dataset folders.
      parameters:
        - in: query
          name: classifier_limit
          required: false
          schema:
            type: integer
            default: 600
        - in: query
          name: catalog_limit
          required: false
          schema:
            type: integer
            default: 400
        - in: query
          name: dataset_limit
          required: false
          schema:
            type: integer
            default: 200
      responses:
        "200":
          description: Alignment report
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "403":
          description: Password required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /system/species-registry/coverage-metrics:
    get:
      summary: Observed vs dataset vs catalog coverage segments
      description: |
        **Settings / admin:** coverage metrics for registry rollout.
      responses:
        "200":
          description: Metrics JSON
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "403":
          description: Password required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /system/species-registry/tuning-targets/export:
    get:
      summary: Export tuning targets for training
      description: |
        **Settings / admin:** `format=json` (default) returns JSON; `format=csv` returns a CSV download.
      parameters:
        - in: query
          name: format
          required: false
          schema:
            type: string
            enum: [json, csv]
            default: json
      responses:
        "200":
          description: JSON list or CSV file
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  targets:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
            text/csv:
              schema:
                type: string
        "403":
          description: Password required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /storage/stats:
    get:
      summary: Get storage stats
      description: |
        Retrieve statistics about the storage usage, including file count and total size. This is useful for monitoring storage consumption and planning for capacity.
      responses:
        "200":
          description: Storage stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StorageStats"
  /storage/purge:
    post:
      summary: Purge storage by date or date range
      description: |
        Purge (delete) recordings: either all videos with start_time before the end of a single calendar day (`date`),
        or only those whose start_time falls within an inclusive calendar range (`start_date` … `end_date`).
        Also removes matching day folders under recordings when they are empty of retained files.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [date]
                  properties:
                    date:
                      type: string
                      format: date
                      description: Delete all videos on or before this calendar day (legacy).
                - type: object
                  required: [start_date, end_date]
                  properties:
                    start_date:
                      type: string
                      format: date
                    end_date:
                      type: string
                      format: date
      responses:
        "200":
          description: Purge result
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  deletedCount:
                    type: integer
                  deletedSize:
                    type: integer
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    ConfigAuditResponse:
      type: object
      required:
        - deprecated_keys_present
        - unknown_keys
        - telegram
        - mapping
        - recall_tuning
        - recall_warnings
        - scales_mqtt
        - scales_warnings
        - config_warnings
      properties:
        deprecated_keys_present:
          type: array
          items:
            type: string
        unknown_keys:
          type: array
          items:
            type: string
        telegram:
          type: object
          properties:
            proxy_type:
              type: string
            send_photo:
              type: boolean
        mapping:
          type: object
          properties:
            gray_to_grey_ok:
              type: boolean
            pairs:
              type: object
              additionalProperties: true
        recall_tuning:
          type: object
          additionalProperties: true
        recall_warnings:
          type: array
          items:
            type: string
        scales_mqtt:
          type: object
          additionalProperties: true
        scales_warnings:
          type: array
          items:
            type: string
        config_warnings:
          type: array
          items:
            type: string
    FileTestFileEntry:
      type: object
      properties:
        name:
          type: string
        size:
          type: integer
        duration_sec:
          type: number
          nullable: true
    FileTestFilesResponse:
      type: object
      properties:
        file_dir:
          type: string
        files:
          type: array
          items:
            $ref: "#/components/schemas/FileTestFileEntry"
    FileTestStatusResponse:
      type: object
      properties:
        file_dir:
          type: string
        desired:
          type: object
          additionalProperties: true
        processor:
          type: object
          nullable: true
          additionalProperties: true
        config_loop_default:
          type: boolean
        video_source:
          type: string
        file_test_max_upload_mb:
          type: integer
          description: Effective per-file upload limit (MiB) for POST /system/file-test/upload (config default 10240, clamped 64–65536 in hub code)
    FusionTraceResponse:
      type: object
      properties:
        available:
          type: boolean
        video_id:
          type: integer
        video_path:
          type: string
        message:
          type: string
          description: Present when available is false (e.g. no_decision_trace)
        log_created_at:
          type: string
          format: date-time
          nullable: true
        trace:
          type: object
          nullable: true
          additionalProperties: true
        tracks:
          type: array
          items:
            type: object
