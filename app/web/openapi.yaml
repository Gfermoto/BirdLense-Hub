        required: false
        schema:
          format: date
          type: string
      - description: Inclusive UTC end date YYYY-MM-DD (optional).
        in: query
        name: end_date
        required: false
        schema:
          format: date
          type: string
      - description: Ignored; reserved for backward compatibility.
        in: query
        name: evidence
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
          description: OK
