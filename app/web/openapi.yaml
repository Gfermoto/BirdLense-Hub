      responses:
        "202":
          description: Job accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  status:
                    type: object
                    additionalProperties: true
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Password required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Enrichment already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /system/species-registry/enrich-metadata/status:
    get:
      summary: Species metadata enrichment job status
      description: |
        **Settings / admin:** live status for async enrichment.
      responses:
        "200":
          description: Status snapshot
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "403":
          description: Password required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /system/species-registry/health:
    get:
      summary: Species registry rollout health
      description: |
        **Settings / admin:** coverage and rollout metrics for the registry.
      responses:
        "200":
          description: Health payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "403":
          description: Password required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /system/species-registry/materialize-allowlist:
