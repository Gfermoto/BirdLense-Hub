      responses:
        "200":
          description: Status snapshot
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "403":
          description: Password required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /system/species-registry/data-quality:
    get:
      summary: Catalog data quality report
      description: |
        **Settings / admin:** duplicates and cleanup hints for the species catalog.
      parameters:
        - in: query
          name: duplicate_limit
          required: false
          schema:
            type: integer
            default: 80
            minimum: 10
            maximum: 500
      responses:
        "200":
          description: Report JSON
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "403":
          description: Password required
          content:
