      description: Heartbeat and status from processor container.
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Processor activity log
  /notify/detections:
    post:
      description: 'Processor to web: detection notification pipeline.'
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Notify detections
  /notify/motion:
    post:
      description: 'Processor to web: motion notification.'
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Notify motion
  /species/active:
    put:
      description: Processor publishes active species list for web and UI.
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Active species snapshot
  /videos:
    post:
      description: 'Processor ingest: recording path, detections, metadata.'
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Upsert video and detections

components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    RetentionConfigUpdate:
      type: object
      properties:
        mode:
          type: string
          enum: [cascade, files_only, disabled]
        days:
          type: integer
          nullable: true
        max_gb:
          type: number
          nullable: true
        dataset_max_age_days:
          type: integer
        migration_max_age_days:
          type: integer
        protect_favorites:
          type: boolean
        min_age_hours:
          type: integer
        batch_size:
          type: integer
        max_deletes_per_run:
          type: integer
        auto_run_enabled:
          type: boolean
        auto_run_interval_hours:
          type: integer
    RetentionConfigResponse:
      type: object
      properties:
        mode:
          type: string
          enum: [cascade, files_only, disabled]
        days:
          type: integer
          nullable: true
        max_gb:
          type: number
          nullable: true
        dataset_max_age_days:
          type: integer
        migration_max_age_days:
          type: integer
        protect_favorites:
          type: boolean
        min_age_hours:
          type: integer
        batch_size:
          type: integer
        max_deletes_per_run:
          type: integer
        auto_run_enabled:
          type: boolean
        auto_run_interval_hours:
          type: integer
        last_run:
          type: string
          format: date-time
          nullable: true
        last_deleted_count:
          type: integer
        last_freed_bytes:
          type: integer
        last_mode:
          type: string
        orphan_recording_files:
          type: object
          properties:
            orphan_session_count:
              type: integer
            orphan_bytes:
              type: integer
            sample_paths:
              type: array
              items:
                type: string
    ConfigAuditResponse:
      type: object
      required:
        - deprecated_keys_present
        - unknown_keys
        - telegram
        - mapping
        - recall_tuning
        - recall_warnings
        - processor_runtime_hints
        - scales_mqtt
        - scales_warnings
        - config_warnings
      properties:
        deprecated_keys_present:
          type: array
          items:
            type: string
        unknown_keys:
          type: array
          items:
            type: string
        telegram:
          type: object
          properties:
            proxy_type:
              type: string
            send_photo:
              type: boolean
        mapping:
          type: object
          properties:
            gray_to_grey_ok:
              type: boolean
            pairs:
              type: object
              additionalProperties: true
        recall_tuning:
          type: object
          additionalProperties: true
        recall_warnings:
          description: >-
            Optional recall / sensitivity tuning hints (not treated as blocking config errors).
            Blocking Frigate+MQTT and scales MQTT problems appear in `config_warnings` instead.
          type: array
          items:
            type: string
        processor_runtime_hints:
          description: >-
            Optional hints derived from processor runtime snapshot JSON (slow-frame counter, detect p95 vs warn_ms).
            Empty when the snapshot file is missing or counters are zero.
          type: array
          items:
            type: string
        scales_mqtt:
          type: object
          additionalProperties: true
        scales_warnings:
          type: array
          items:
            type: string
        config_warnings:
          description: >-
            Blocking or misconfiguration warnings (Frigate without MQTT broker when enabled,
            MQTT scales issues). Does not include soft recall tuning hints from `recall_warnings`.
          type: array
          items:
            type: string
    FileTestFileEntry:
      type: object
      properties:
        name:
          type: string
        size:
          type: integer
        duration_sec:
          type: number
          nullable: true
    FileTestFilesResponse:
      type: object
      properties:
        file_dir:
          type: string
        files:
          type: array
          items:
            $ref: "#/components/schemas/FileTestFileEntry"
    FileTestStatusResponse:
      type: object
      properties:
        file_dir:
          type: string
        desired:
          type: object
          additionalProperties: true
        processor:
          type: object
          nullable: true
          additionalProperties: true
        config_loop_default:
          type: boolean
        video_source:
          type: string
        file_test_max_upload_mb:
          type: integer
          description: Effective per-file upload limit (MiB) for POST /system/file-test/upload (config default 10240, clamped 64–65536 in hub code)
    FusionTraceResponse:
      type: object
      properties:
        available:
          type: boolean
        video_id:
          type: integer
        video_path:
          type: string
        message:
          type: string
          description: Present when available is false (e.g. no_decision_trace)
        log_created_at:
          type: string
          format: date-time
          nullable: true
        trace:
          type: object
          nullable: true
          additionalProperties: true
        tracks:
          type: array
          items:
            type: object
            properties:
              bucket:
                type: string
                enum: [persisted, rejected, accepted]
                description: persisted = saved on clip; rejected = not on clip; accepted = legacy alias for persisted
              track_id:
                type: integer
                nullable: true
              species_name:
                type: string
                nullable: true
              steps:
                type: array
                items:
                  type: object
                  properties:
                    stage:
                      type: string
                    lines:
                      type: array
                      items:
                        type: object
                        properties:
                          field:
                            type: string
                          value:
                            type: string
    BirdFood:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        active:
          type: boolean
        description:
          type: string
        image_url:
          type: string
    VideoDetails:
      type: object
      properties:
        id:
          type: integer
        created_at:
          type: string
          format: date-time
        processor_version:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        video_path:
          type: string
        favorite:
          type: boolean
        weather:
          type: object
          properties:
            main:
              type: string
            description:
              type: string
            temp:
              type: number
            humidity:
              type: number
            pressure:
              type: number
            clouds:
              type: number
            wind_speed:
              type: number
        species:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              species_id:
                type: integer
              species_name:
                type: string
              track_id:
                type: integer
                nullable: true
              start_time:
                type: number
              end_time:
                type: number
              confidence:
                type: number
              source:
                type: string
              detection_provider:
                type: string
                nullable: true
              individual_nickname:
                type: string
                nullable: true
              image_url:
                type: string
        food:
          type: array
          items:
            $ref: "#/components/schemas/BirdFood"
        scales:
          type: object
          nullable: true
          description: Estimated feeder scale delta during the recording window (issue #167); null if not computed or scales disabled
          properties:
            delta_kg:
              type: number
            display_value:
              type: number
            display_unit:
              type: string
              enum: [kg, g]
            weight_change_grams:
              type: number
              description: Signed mass change during the visit window (grams); null when scales data missing
            weight_trend:
              type: string
              enum: [up, down, stable]
              description: Direction vs noise threshold (~5 g); stable when change is within sensor noise
        behavior_label:
          type: string
          nullable: true
          description: Runtime or manually set behavior taxonomy label (#416)
        behavior_confidence:
          type: number
          nullable: true
          description: Confidence for behavior_label (0..1)
    VideoNeighbors:
      type: object
      properties:
        day_scope:
          type: string
          enum: [utc, local]
        day_label:
          type: string
          format: date
          description: Calendar date (YYYY-MM-DD) for the chosen scope — UTC date or local date
        timezone_offset_minutes:
          type: integer
          description: Client offset (JS `getTimezoneOffset` style) when `day_scope=local`; 0 for UTC scope
        cross_day:
          type: boolean
          description: Whether neighbors may be taken from adjacent days when at day boundary
        previous_id:
          type: integer
          nullable: true
          description: Previous video id in the day list, or null
        next_id:
          type: integer
          nullable: true
          description: Next video id in the day list, or null
        index:
          type: integer
          description: Zero-based index of this video in the ordered day list
        total:
          type: integer
          description: Number of videos in the day list
      required:
        - day_scope
        - day_label
        - timezone_offset_minutes
        - cross_day
        - previous_id
        - next_id
        - index
        - total
    TopSpecies:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        detections:
          type: array
          items:
            type: integer
        unidentified:
          type: boolean
          description: True for synthetic generic Bird/Rodent rows from detector segments
    OverviewStats:
      type: object
      properties:
        uniqueSpecies:
          type: integer
        totalDetections:
          type: integer
          description: Named-species visits (SpeciesVisit), excludes generic Bird/Rodent
        lastHourDetections:
          type: integer
        unidentifiedBirdDetections:
          type: integer
          description: YOLO/MQTT segments labeled generic Bird (classifier not required)
        rodentDetections:
          type: integer
          description: Detector segments labeled Rodent or rodent-like taxa
        totalActivity:
          type: integer
          description: Named visits plus unidentified bird and rodent detector segments
        busiestHour:
          type: integer
        avgVisitDuration:
          type: integer
          description: Mean duration of one recording (Video) in seconds for the day window
        videoDuration:
          type: integer
          description: Sum of recording durations (video segments) in seconds
        audioDuration:
          type: integer
          description: Sum of audio detection segment durations in seconds
        detectionByProvider:
          type: object
          description: Visit counts by `VideoSpecies.detection_provider` (key `legacy` if null)
          additionalProperties:
            type: integer
    TimelineVisit:
      type: object
      properties:
        id:
          type: integer
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        max_simultaneous:
          type: integer
        total_recording_seconds:
          type: integer
        video_duration_seconds:
          type: integer
          nullable: true
        timeline_kind:
          type: string
          enum: [visit, unlinked_video]
        trigger_source:
          type: string
          nullable: true
          description: Trigger semantics for the visit item (opencv/frigate/motion_sensor/scales/unknown).
        individual_nickname:
          type: string
          nullable: true
        behavior_events:
          type: array
          description: Behavior events produced by behavior recognition model runtime.
          items:
            type: object
            properties:
              label:
                type: string
              confidence:
                type: number
              evidence:
                type: object
                additionalProperties: true
        weather:
          type: object
          nullable: true
          properties:
            temp:
              type: number
              nullable: true
            clouds:
              type: number
              nullable: true
        scales:
          type: object
          nullable: true
          description: Feeder scale delta from the visit's primary (earliest) video; same fields as GET /videos/:id `scales`
          properties:
            delta_kg:
              type: number
            display_value:
              type: number
            display_unit:
              type: string
              enum: [kg, g]
        species:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            image_url:
              type: string
            parent_id:
              type: integer
        detections:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              video_id:
                type: integer
              start_time:
                type: string
                format: date-time
              end_time:
                type: string
                format: date-time
              confidence:
                type: number
              source:
                type: string
              detection_provider:
                type: string
                nullable: true
              individual_nickname:
                type: string
                nullable: true
    UnknownDetection:
      type: object
      properties:
        id:
          type: integer
        video_id:
          type: integer
        species_id:
          type: integer
        species_name:
          type: string
        confidence:
          type: number
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        source:
          type: string
        detection_provider:
          type: string
          nullable: true
        image_url:
          type: string
          nullable: true
        review_state:
          type: string
          nullable: true
          enum: [pending, reviewed, not_applicable]
        review_reason:
          type: string
          nullable: true
          enum: [low_confidence, generic_bird, classifier_uncertainty]
        review_source:
          type: string
          nullable: true
        classifier_entropy:
          type: number
          nullable: true
        classifier_top1_top2_margin:
          type: number
          nullable: true
        classifier_needs_review:
          type: boolean
    SpeciesSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        parent_id:
          type: integer
        created_at:
          type: string
          format: date-time
        image_url:
          type: string
        description:
          type: string
        active:
          type: boolean
        regional_scope:
          type: boolean
          description: >
            True if species is in the eBird regional top (same source as Migration comparison)
            or has any BirdNET MQTT detection (detection_provider birdnet_mqtt). Used for Bird Directory «Regional» filter.
        count:
          type: integer
        catalog_card_incomplete:
          type: boolean
          description: True when photo or description is missing or placeholder (card-quality UI).
        catalog_scope:
          type: string
          enum: [allowlist, observed, all]
          description: Present when the row was returned under a scoped catalog query.
    SpeciesCatalogMeta:
      type: object
      properties:
        db_species_total:
          type: integer
        allowlist_total:
          type: integer
        listed_allowlist:
          type: integer
        allowlist_incomplete:
          type: integer
    SpeciesCatalogListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SpeciesSummary"
        meta:
          $ref: "#/components/schemas/SpeciesCatalogMeta"
    BirdFamily:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
    SpeciesSummaryDetails:
      type: object
      properties:
        species:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            image_url:
              type: string
            description:
              type: string
            metadata_status:
              type: string
              description: Registry enrichment status (pending, ok, error, not_found, …).
            metadata_trust:
              type: string
              enum:
                - low_confidence
                - registry_verified
                - registry_bound
                - unbound
              description: >
                Coarse trust hint: unbound = no canonical taxon link; registry_verified = taxon + ok metadata;
                low_confidence = failed or missing enrichment.
            metadata_source:
              type: string
              nullable: true
            metadata_source_url:
              type: string
              nullable: true
            active:
              type: boolean
            parent:
              type: object
              nullable: true
              properties:
                id:
                  type: integer
                name:
                  type: string
        stats:
          type: object
          properties:
            detections:
              type: object
              properties:
                detections_24h:
                  type: integer
                detections_7d:
                  type: integer
                detections_30d:
                  type: integer
            timeRange:
              type: object
              properties:
                first_sighting:
                  type: string
                  format: date-time
                  nullable: true
                last_sighting:
                  type: string
                  format: date-time
                  nullable: true
            hourlyActivity:
              type: array
              items:
                type: integer
            weather:
              type: array
              items:
                type: object
                properties:
                  temp:
                    type: number
                  clouds:
                    type: number
                  count:
                    type: integer
            food:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  count:
                    type: integer
        subspecies:
          type: array
          items:
            type: object
            properties:
              species:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  image_url:
                    type: string
                  metadata_status:
                    type: string
                  metadata_trust:
                    type: string
                  metadata_source:
                    type: string
                    nullable: true
                  metadata_source_url:
                    type: string
                    nullable: true
              stats:
                type: object
                properties:
                  detections:
                    type: object
                    properties:
                      detections_24h:
                        type: integer
                      detections_7d:
                        type: integer
                      detections_30d:
                        type: integer
                  hourlyActivity:
                    type: array
                    items:
                      type: integer
        recentVisits:
          type: array
          items:
            $ref: "#/components/schemas/TimelineVisit"
    SystemMetrics:
      type: object
      properties:
        cpu:
          type: object
          properties:
            percent:
              type: number
        memory:
          type: object
          properties:
            total:
              type: number
            used:
              type: number
            percent:
              type: number
            total_bytes:
              type: integer
            used_bytes:
              type: integer
        disk:
          type: object
          properties:
            total:
              type: number
            used:
              type: number
            percent:
              type: number
        encoding:
          type: string
          description: Video encoding setting (cpu or intel); hints whether GPU chart may apply.
        gpu_percent:
          type: number
          nullable: true
    VisitorStats:
      type: object
      properties:
        period_days:
          type: integer
        unique_visits:
          type: integer
        active_days:
          type: integer
        method:
          type: string
    SystemMetricsHistorySample:
      type: object
      properties:
        t:
          type: string
          format: date-time
        cpu:
          type: number
        memory:
          type: number
        disk:
          type: number
        gpu:
          type: number
          nullable: true
    SystemMetricsHistory:
      type: object
      properties:
        samples:
          type: array
          items:
            $ref: "#/components/schemas/SystemMetricsHistorySample"
        sample_interval_seconds:
          type: integer
        retention_hours:
          type: integer
        hours_requested:
          type: integer
    ActivityLogEntry:
      type: object
      properties:
        date:
          type: string
          format: date
        totalUptime:
          type: number
    CorrectionHistoryEntry:
      type: object
      properties:
        id:
          type: integer
        created_at:
          type: string
          format: date-time
          nullable: true
        action:
          type: string
          enum: [correct_species, confirm_species]
        source:
          type: string
          enum: [unknowns, video, other]
        detection_id:
          type: integer
          nullable: true
        from_species_name:
          type: string
          nullable: true
        to_species_name:
          type: string
          nullable: true
        updated_count:
          type: integer
          nullable: true
        apply_scope:
          type: string
          enum: [single_track, whole_visit, legacy_fanout]
        reason:
          type: string
          nullable: true
        video_id:
          type: integer
          nullable: true
        track_id:
          type: integer
          nullable: true
        species_visit_id:
          type: integer
          nullable: true
    StorageStats:
      type: object
      properties:
        date:
          type: string
        fileCount:
          type: integer
        totalSize:
          type: integer
    EbirdMappingSuggestion:
      type: object
      properties:
        ebird_name:
          type: string
        birdlense_name:
          type: string
          nullable: true
        kind:
          type: string
          enum: [case_variant, fuzzy, unmatched]
        score:
          type: number
          format: float
          nullable: true
    EbirdMappingSuggestionsResponse:
      type: object
      properties:
        region_code:
          type: string
        ebird_api_configured:
          type: boolean
        top_count:
          type: integer
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/EbirdMappingSuggestion"
    Settings:
      type: object
      properties:
        general:
          type: object
          properties:
            enable_notifications:
              type: boolean
            notification_excluded_species:
              type: array
              items:
                type: string
        notifications:
          type: object
          properties:
            telegram_bot_token:
              type: string
            telegram_chat_id:
              type: string
            base_url:
              type: string
            link_preview_large:
              type: boolean
            send_photo:
              type: boolean
            use_custom_emoji:
              type: boolean
            custom_emoji_id_bird:
              type: string
            custom_emoji_id_chipmunk:
              type: string
            custom_emoji_id_open_live:
              type: string
        processor:
          type: object
          description: >
            Processor tuning; full shape follows `default_config.yaml` / `user_config.yaml`.
            Listed properties are a non-exhaustive subset used by the UI; extra keys are allowed.
          additionalProperties: true
          properties:
            video_width:
              type: integer
            video_height:
              type: integer
            tracker:
              type: string
