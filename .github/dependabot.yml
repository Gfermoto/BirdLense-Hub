# open-pull-requests-limit: 1 на блок — не больше одного открытого PR с веткой на каждый ecosystem+path.
# (Несколько блоков → теоретически до N PR одновременно; глобального «одна ветка на весь репо» у Dependabot нет.)
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "app/ui"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"

  - package-ecosystem: "pip"
    directory: "app/web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"

  - package-ecosystem: "pip"
    directory: "app/processor"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"

  - package-ecosystem: "docker"
    directory: "app"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
