# Dependabot: open-pull-requests-limit: 0 — без автоматических PR (и без лишних веток).
# Обновления зависимостей — вручную или Renovate/одиночные PR с dev. Включить снова: limit ≥ 1.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "app/ui"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"

  - package-ecosystem: "pip"
    directory: "app/web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"

  - package-ecosystem: "pip"
    directory: "app/processor"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"

  - package-ecosystem: "docker"
    directory: "app"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
