name: SOTA Governance Weekly

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  sota-governance-weekly:
    name: sota-governance-weekly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: SOTA governance cycle (weekly)
        run: |
          set -euo pipefail
          chmod +x ./scripts/run_sota_governance_cycle.sh
          GOVERNANCE_MODE=weekly SOTA_FAIL_ON_BLOCKED=1 make sota-governance-cycle

      - name: Upload weekly governance artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sota-governance-cycle-weekly
          path: |
            docs/reports/governance/governance_cycle_latest.json
            docs/reports/governance/governance_cycle_latest.md
            docs/reports/governance/review_board_latest.json
            docs/reports/governance/review_board_latest.md
            docs/reports/domain_finetune/domain_finetune_loop_latest.json
            docs/reports/domain_finetune/domain_finetune_loop_latest.md
          if-no-files-found: error
