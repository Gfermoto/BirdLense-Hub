# Playwright E2E против локально поднятого stack в Docker (как make start + make test-e2e).
# Не required в ruleset — может быть медленным / чувствительным к таймингам.
name: E2E (Playwright)

on:
  workflow_dispatch:
  schedule:
    # Ежедневно 06:30 UTC; отключите cron в форке при нехватке минут GitHub Actions
    - cron: "30 6 * * *"

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    env:
      BIRDLENSE_PORT: "8085"
      BASE_URL: "http://127.0.0.1:8085"
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare .env and data dirs
        run: |
          test -f .env || cp .env.example .env
          mkdir -p data/db data/recordings

      - name: Build birdlense image
        run: docker compose build birdlense
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1

      - name: Start stack
        run: docker compose up -d

      - name: Wait for API health
        run: |
          set -e
          for i in $(seq 1 40); do
            if curl -sf "http://127.0.0.1:8085/api/ui/health" >/dev/null; then
              echo "health OK after ${i} attempts"
              exit 0
            fi
            sleep 3
          done
          echo "health check failed"
          docker compose logs --tail=80 birdlense || true
          exit 1

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/e2e/package-lock.json

      - name: Install Playwright + Chromium
        working-directory: app/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E
        working-directory: app/e2e
        run: npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: app/e2e/playwright-report/
          if-no-files-found: ignore

      - name: Docker logs on failure
        if: failure()
        run: docker compose logs --tail=120 birdlense || true

      - name: Stop stack
        if: always()
        run: docker compose down || true
