# Быстрые проверки на PR / push (без Docker и self-hosted deploy).
name: CI

on:
  pull_request:
    branches: [main, dev, ML]
  push:
    branches: [main, dev, ML]
  # Ежедневно на default branch — регрессии без пушей от людей.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-security:
    name: python-security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Bandit (web/ + processor/src, bandit.yaml)
        run: |
          pip install bandit[toml]==1.8.6
          bandit -r web/ processor/src -c bandit.yaml -ll

      - name: pip-audit (web + processor requirements)
        run: |
          pip install pip-audit==2.9.0
          # py 1.11.0 (транзитивно от interrogate): нет фикса на PyPI; dev/docs зависимость
          # GHSA-r374-rxx8-8654 (paramiko): в advisory feed пока без фикс-версии.
          # Runtime mitigation: strict host key policy by default, no silent trust in production path.
          pip-audit -r web/requirements.txt -r processor/requirements.txt \
            --ignore-vuln PYSEC-2022-42969 \
            --ignore-vuln GHSA-r374-rxx8-8654

  # Roadmap #418 / A1: lock production env gate script into CI (same logic as deploy pre-flight).
  # Synthetic secrets satisfy length/shape checks only — not real deployment values.
  verify-prod-env-smoke:
    name: verify-prod-env-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: scripts/verify-prod-env.sh (--require-mcp-token)
        run: |
          VERIFY_PROD_ENV=1 \
          BIRDLENSE_STRICT_API_AUTH=1 \
          FLASK_SECRET_KEY='0123456789abcdef0123456789abcdef' \
          PROCESSOR_SECRET='fedcba9876543210fedcba9876543210' \
          MCP_TOKEN='0123456789abcdef0123456789abcdef' \
          ./scripts/verify-prod-env.sh --require-mcp-token

  openapi-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/web/requirements.txt

      - name: Install web test dependencies
        run: pip install -r web/requirements.txt

      - name: Ruff lint + format check (web/ + processor/src)
        run: |
          pip install ruff==0.9.2
          ruff check web/ processor/src/
          ruff format web/ processor/src/ --check

      - name: Legacy processor config guard (SOTA 2.0)
        working-directory: ${{ github.workspace }}
        run: |
          pip install pyyaml==6.0.2
          python3 scripts/check_legacy_processor_config.py

      - name: SOTA Golden Gate + offline stress (no Docker)
        working-directory: ${{ github.workspace }}
        env:
          GOLDEN_GATE_MIN_F1: "0.9"
          STRESS_MAX_SILENCE_ACCEPTED: "0"
          STRESS_MIN_STORM_RECALL: "1.0"
        run: |
          pip install opencv-python-headless==4.10.0.84 numpy pyyaml==6.0.2
          make validate-pipeline-golden
          python3 scripts/stress_test_offline.py --no-yolo

      - name: Radon cyclomatic complexity (summary only)
        run: |
          pip install radon==6.0.1
          {
            echo '### Radon cc (web/ + processor/src/)'
            radon cc -a -s web/ processor/src/ || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: VERSION sync (package.json, openapi, mkdocs)
        run: cd .. && python3 scripts/check-docs-version.py

      - name: benchmark-track-regen CLI (--help smoke)
        working-directory: ${{ github.workspace }}
        run: |
          pip install opencv-python-headless==4.10.0.84 numpy
          PYTHONPATH=app:app/processor/src python3 scripts/benchmark-track-regen.py --help
          PYTHONPATH=app:app/processor/src:scripts python3 -c \
            "from benchmark_regen_labels import load_gold_by_basename; print('benchmark_regen_labels:ok')"
          python3 scripts/compare_benchmark_reports.py --help
          python3 scripts/verify_benchmark_report_schema.py --help
          python3 scripts/benchmark_video_decode_resize.py --help
          python3 scripts/federated/simulate_fedavg.py --clients 3 --samples-per-client 50 --dim 6 --seed 0

      - name: Benchmark report helpers (pytest, no Docker)
        working-directory: ${{ github.workspace }}/app
        run: |
          PYTHONPATH=web:processor/src python3 -m pytest \
            processor/tests/test_benchmark_regen_labels.py \
            processor/tests/test_compare_benchmark_reports.py \
            processor/tests/test_verify_benchmark_report_schema.py \
            processor/tests/test_reference_smoke_compare.py \
            processor/tests/test_merge_three_class_dataset.py \
            processor/tests/test_auto_benchmark.py \
            processor/tests/test_inference_weight_contract.py \
            -q --tb=short

      - name: OpenAPI contract smoke tests
        run: python -m pytest web/tests/test_openapi_contract.py -q

      - name: Species registry smoke tests
        run: python -m pytest web/tests/test_species_registry.py -q

      - name: Dataset export smoke tests
        run: python -m pytest web/tests/test_dataset_export_service.py -q

      - name: Util metadata / URL parsing tests
        run: python -m pytest web/tests/test_util_metadata.py -q

      - name: Bird food seed idempotency
        run: python -m pytest web/tests/test_bird_food_seed.py -q

      - name: Xeno-canto service (mocked HTTP)
        run: python -m pytest web/tests/test_xeno_canto_service.py -q

      - name: Birdfood / push subscribe smoke (auth gates)
        run: python -m pytest web/tests/test_settings_mutations_smoke.py -q

      - name: Strict UI API auth (production gate #279)
        run: python -m pytest web/tests/test_strict_ui_api_auth.py -q

      - name: Critical production hardening coverage
        run: |
          python -m coverage run -m pytest \
            web/tests/test_csrf_service.py \
            web/tests/test_strict_ui_api_auth.py \
            web/tests/test_config.py -q
          python -m coverage report \
            --include="web/config.py,web/services/csrf_service.py,web/services/strict_ui_api_auth_service.py" \
            --fail-under=80

      - name: Processor POST /videos smoke
        run: python -m pytest web/tests/test_processor_videos_smoke.py -q

      - name: System routes smoke (activity, logs, metrics history)
        run: python -m pytest web/tests/test_system_routes_smoke.py -q

      - name: Settings UI coverage guard regression
        run: python -m pytest web/tests/test_settings_ui_coverage_guard.py -q

  ui-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/ui
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci

      - name: OpenAPI → TypeScript (drift check vs committed file)
        working-directory: ${{ github.workspace }}
        run: |
          (cd app/ui && npm run codegen:openapi)
          git diff --exit-code -- app/ui/src/generated/openapi-types.ts

      - name: Lint & build UI
        working-directory: app/ui
        run: |
          npm run test -- --run
          npm run coverage
          npm run coverage:critical
          npm run typecheck
          npm run lint
          npm run build

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install MkDocs
        run: pip install -r requirements-docs.txt

      - name: Check docs version vs VERSION file
        run: python3 scripts/check-docs-version.py

      - name: Check SITE_MAP vs mkdocs Meta/Repository
        run: python3 scripts/check_site_map_meta_paths.py

      - name: Check Settings UI coverage
        run: |
          python3 scripts/check-settings-ui-coverage.py \
            --report-path .artifacts/settings-ui-coverage.json \
            --summary-path .artifacts/settings-ui-coverage.md

      - name: Publish Settings UI coverage summary
        if: always()
        run: cat .artifacts/settings-ui-coverage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Settings UI coverage artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: settings-ui-coverage
          path: |
            .artifacts/settings-ui-coverage.json
            .artifacts/settings-ui-coverage.md

      - name: MkDocs build (strict)
        run: mkdocs build --strict

  # Те же тесты, что локально: processor (pytest, not heavy) + web (pytest) в образе birdlense.
  # Требует места на диске раннера (база Ultralytics). Required в ruleset **Protect** (main).
  docker-tests:
    name: docker-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space (large Docker image)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare .env and data dirs
        run: |
          test -f .env || cp .env.example .env
          mkdir -p data/db data/recordings

      - name: Processor .pt weights for integration tests
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./scripts/fetch-processor-weights.sh; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "Failed to fetch processor weights after retries" >&2
          exit 1

      - name: Build birdlense image
        run: docker compose build birdlense
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1

      - name: Processor unit tests
        run: make test

      - name: Web API tests (pytest)
        run: make test-web

      - name: E2E smoke (Playwright, local compose)
        env:
          BIRDLENSE_PORT: "8085"
        run: |
          set -euo pipefail
          docker compose up -d
          # После cd e2e / cd .. trap иначе вызывает compose не из app/ → «no configuration file provided».
          cleanup() { (cd "${GITHUB_WORKSPACE}/app" && docker compose down); }
          trap cleanup EXIT
          BASE="http://127.0.0.1:${BIRDLENSE_PORT}"
          # Nginx на хосте появляется только после ожидания Gunicorn в entrypoint (до ~400 с); 60×2 с мало → curl 56.
          bash ../scripts/wait-hub-http.sh "$BASE"
          cd e2e
          npm ci
          npx playwright install --with-deps chromium
          BASE_URL="${BASE}" npx playwright test tests/smoke.spec.ts
        working-directory: app

      - name: Strict quality verify (domain-health gate)
        continue-on-error: true
        env:
          BIRDLENSE_PORT: "8085"
        run: |
          set -euo pipefail
          docker compose up -d
          cleanup() { (cd "${GITHUB_WORKSPACE}/app" && docker compose down); }
          trap cleanup EXIT
          BASE="http://127.0.0.1:${BIRDLENSE_PORT}"
          bash ../scripts/wait-hub-http.sh "$BASE"
          cd ..
          make verify-strict-quality BASE_URL="${BASE}"
        working-directory: app

      - name: Catalog cards audit (local stack)
        env:
          BIRDLENSE_PORT: "8085"
        run: |
          set -euo pipefail
          docker compose up -d
          cleanup() { (cd "${GITHUB_WORKSPACE}/app" && docker compose down); }
          trap cleanup EXIT
          BASE="http://127.0.0.1:${BIRDLENSE_PORT}"
          bash ../scripts/wait-hub-http.sh "$BASE"
          python3 ../scripts/audit_species_cards.py \
            --base-url "${BASE}" \
            --workers 4 \
            --limit 200 \
            --ignore-direct-image-429 \
            --ignore-empty-description \
            --ignore-empty-image-url \
            --report-path ../.artifacts/catalog-cards-audit.local.json
        working-directory: app

      - name: Upload catalog cards audit artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: catalog-cards-audit-local
          path: .artifacts/catalog-cards-audit.local.json
          if-no-files-found: ignore
