# Быстрые проверки на PR / push (без Docker и self-hosted deploy).
name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openapi-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/web/requirements.txt

      - name: Install web test dependencies
        run: pip install -r web/requirements.txt

      - name: Ruff lint (web/tests only)
        run: pip install ruff==0.9.2 && ruff check web/tests/

      - name: VERSION sync (package.json, openapi, mkdocs)
        run: cd .. && python3 scripts/check-docs-version.py

      - name: OpenAPI contract smoke tests
        run: python -m pytest web/tests/test_openapi_contract.py -q

      - name: Species registry smoke tests
        run: python -m pytest web/tests/test_species_registry.py -q

      - name: Dataset export smoke tests
        run: python -m pytest web/tests/test_dataset_export_service.py -q

      - name: Util metadata / URL parsing tests
        run: python -m pytest web/tests/test_util_metadata.py -q

      - name: Bird food seed idempotency
        run: python -m pytest web/tests/test_bird_food_seed.py -q

      - name: Xeno-canto service (mocked HTTP)
        run: python -m pytest web/tests/test_xeno_canto_service.py -q

      - name: Birdfood / push subscribe smoke (auth gates)
        run: python -m pytest web/tests/test_settings_mutations_smoke.py -q

      - name: Processor POST /videos smoke
        run: python -m pytest web/tests/test_processor_videos_smoke.py -q

      - name: System routes smoke (activity, logs, metrics history)
        run: python -m pytest web/tests/test_system_routes_smoke.py -q

  ui-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/ui
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      - name: Install & build UI
        run: |
          npm ci
          npm run build

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install MkDocs
        run: pip install -r requirements-docs.txt

      - name: Check docs version vs VERSION file
        run: python3 scripts/check-docs-version.py

      - name: Check Settings UI coverage
        run: |
          python3 scripts/check-settings-ui-coverage.py \
            --report-path .artifacts/settings-ui-coverage.json \
            --summary-path .artifacts/settings-ui-coverage.md

      - name: Publish Settings UI coverage summary
        if: always()
        run: cat .artifacts/settings-ui-coverage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Settings UI coverage artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: settings-ui-coverage
          path: |
            .artifacts/settings-ui-coverage.json
            .artifacts/settings-ui-coverage.md

      - name: MkDocs build (strict)
        run: mkdocs build --strict

  # Те же тесты, что локально: processor (unittest) + web (pytest) в образе birdlense.
  # Требует места на диске раннера (база Ultralytics). Required в ruleset **Protect** (main).
  docker-tests:
    name: docker-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space (large Docker image)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare .env and data dirs
        run: |
          test -f .env || cp .env.example .env
          mkdir -p data/db data/recordings

      - name: Build birdlense image
        run: docker compose build birdlense
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1

      - name: Processor unit tests
        run: make test

      - name: Web API tests (pytest)
        run: make test-web

      - name: E2E smoke (Playwright, local compose)
        env:
          BIRDLENSE_PORT: "8085"
        run: |
          set -euo pipefail
          docker compose up -d
          cleanup() { docker compose down; }
          trap cleanup EXIT
          BASE="http://127.0.0.1:${BIRDLENSE_PORT}"
          for i in $(seq 1 60); do
            if curl -sf "${BASE}/api/ui/health" >/dev/null; then
              echo "hub healthy"
              break
            fi
            sleep 2
          done
          curl -sf "${BASE}/api/ui/health" >/dev/null
          cd e2e
          npm ci
          npx playwright install --with-deps chromium
          BASE_URL="${BASE}" npx playwright test tests/smoke.spec.ts
        working-directory: app

      - name: Catalog cards audit (local stack)
        env:
          BIRDLENSE_PORT: "8085"
        run: |
          set -euo pipefail
          docker compose up -d
          cleanup() { docker compose down; }
          trap cleanup EXIT
          BASE="http://127.0.0.1:${BIRDLENSE_PORT}"
          for i in $(seq 1 60); do
            if curl -sf "${BASE}/api/ui/health" >/dev/null; then
              echo "hub healthy for catalog audit"
              break
            fi
            sleep 2
          done
          curl -sf "${BASE}/api/ui/health" >/dev/null
          python3 ../scripts/audit_species_cards.py \
            --base-url "${BASE}" \
            --workers 4 \
            --limit 200 \
            --ignore-direct-image-429 \
            --ignore-empty-description \
            --ignore-empty-image-url \
            --report-path ../.artifacts/catalog-cards-audit.local.json
        working-directory: app

      - name: Upload catalog cards audit artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: catalog-cards-audit-local
          path: .artifacts/catalog-cards-audit.local.json
          if-no-files-found: ignore
