# MkDocs → GitHub Pages. Deploy only from main (tag refs fail github-pages environment rules).
name: Documentation site

on:
  push:
    branches: [main, dev]
    paths:
      - "docs/**"
      - "overrides/**"
      - "mkdocs.yml"
      - "VERSION"
      - "requirements-docs.txt"
      - "scripts/check-docs-version.py"
      - "scripts/check_site_map_meta_paths.py"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install MkDocs
        run: pip install -r requirements-docs.txt

      - name: Check docs version vs VERSION file
        run: python3 scripts/check-docs-version.py

      - name: Check SITE_MAP vs mkdocs Meta/Repository
        run: python3 scripts/check_site_map_meta_paths.py

      - name: Build site
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
