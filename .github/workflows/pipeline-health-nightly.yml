name: Pipeline Health Gate

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

jobs:
  pipeline-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python deps (report scripts only)
        run: pip install --quiet pyyaml

      - name: Fetch prod DB and run gates
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOY_HOST:-}" ]]; then
            echo "DEPLOY_HOST secret missing — skip prod fetch (run make pipeline-health-gate locally)"
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' \
            "Host ${DEPLOY_HOST}" \
            "  StrictHostKeyChecking accept-new" \
            >> ~/.ssh/config
          chmod +x scripts/pipeline-health-gate.sh scripts/fetch_prod_db_snapshot.sh
          PIPELINE_HEALTH_FETCH_PROD=1 make pipeline-health-gate
