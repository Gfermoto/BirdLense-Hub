# Nightly governance on production metrics (#585).
# Runs on self-hosted runner (same host as BirdLense) — reads live SQLite, no SSH fetch.
name: SOTA Governance Prod Nightly

on:
  schedule:
    - cron: "15 4 * * *" # 04:15 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sota-governance-prod:
    name: sota-governance-prod-nightly
    runs-on: [self-hosted, birdlense]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: SOTA governance cycle (prod DB)
        env:
          OUTCOME_DB_PATH: /root/BirdLense/app/data/db/birdlense.db
          GOVERNANCE_MODE: nightly
          SOTA_FAIL_ON_BLOCKED: "0"
          SOTA_FAIL_ON_BBOX_KPI: "0"
          FIRST_BBOX_FAIL_S: "2"
          CREATE_VIDEO_FAIL_MS: "60000"
        run: |
          set -euo pipefail
          test -f "${OUTCOME_DB_PATH}"
          chmod +x ./scripts/run_sota_governance_cycle.sh
          ./scripts/run_sota_governance_cycle.sh

      - name: Upload prod governance artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sota-governance-prod-nightly
          path: |
            docs/reports/governance/governance_cycle_latest.json
            docs/reports/governance/governance_cycle_latest.md
            docs/reports/quality_outcome/quality_outcome_metrics_latest.json
            docs/reports/quality_outcome/failure_mode_funnel_latest.json
            docs/reports/perf/runtime_pipeline_profile_latest.json
            docs/reports/sota_reality/sota_reality_check_latest.json
          if-no-files-found: error
