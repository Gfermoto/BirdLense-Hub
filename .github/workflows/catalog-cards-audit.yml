name: Catalog Cards Audit

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Hub base URL (https://...). Leave empty to use repo variable CATALOG_CARDS_AUDIT_URL.
        required: false
        default: ""
  schedule:
    - cron: "30 4 * * *"

concurrency:
  group: catalog-cards-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install requests
        run: python3 -m pip install requests

      - name: Run full cards audit
        env:
          BASE_URL_INPUT: ${{ github.event.inputs.base_url }}
          HUB_AUDIT_DEFAULT: ${{ vars.CATALOG_CARDS_AUDIT_URL }}
        run: |
          set -euo pipefail
          BASE_URL="${BASE_URL_INPUT:-}"
          if [ -z "$BASE_URL" ]; then BASE_URL="${HUB_AUDIT_DEFAULT:-}"; fi
          if [ -z "$BASE_URL" ]; then
            echo "::error::No base URL: set repository variable CATALOG_CARDS_AUDIT_URL (Settings → Secrets and variables → Actions → Variables) or run workflow_dispatch with base_url."
            exit 1
          fi
          echo "Auditing ${BASE_URL}"
          # full_eu may contain species without image_url; Wikimedia often returns 429 under parallel CI fetches.
          # Report still lists all issues in the artifact; exit 0 unless a non-ignored issue remains.
          python3 scripts/audit_species_cards.py \
            --base-url "${BASE_URL}" \
            --workers 12 \
            --ignore-direct-image-429 \
            --ignore-empty-image-url \
            --report-path .artifacts/catalog-cards-audit.json

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: catalog-cards-audit
          path: .artifacts/catalog-cards-audit.json
          if-no-files-found: ignore
