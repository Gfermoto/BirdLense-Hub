name: Catalog Cards Audit

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Base URL to audit
        required: false
        default: https://birdlense.eyera.info
  schedule:
    - cron: "30 4 * * *"

concurrency:
  group: catalog-cards-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install requests
        run: python3 -m pip install requests

      - name: Run full cards audit
        env:
          BASE_URL_INPUT: ${{ github.event.inputs.base_url }}
        run: |
          set -euo pipefail
          BASE_URL="${BASE_URL_INPUT:-https://birdlense.eyera.info}"
          echo "Auditing ${BASE_URL}"
          python3 scripts/audit_species_cards.py \
            --base-url "${BASE_URL}" \
            --workers 20 \
            --ignore-direct-image-429 \
            --report-path .artifacts/catalog-cards-audit.json

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: catalog-cards-audit
          path: .artifacts/catalog-cards-audit.json
          if-no-files-found: ignore
