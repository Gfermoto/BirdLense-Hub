name: Docker image smoke (published)

on:
  workflow_dispatch:
  schedule:
    # Every day at 04:30 UTC: verify published latest image is runnable.
    - cron: "30 4 * * *"

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  # Docker/OCI: имя репозитория в reference должно быть в нижнем регистре.
  IMAGE: ghcr.io/${{ toLower(github.repository_owner) }}/birdlense-hub:latest
  CONTAINER: birdlense-smoke
  HOST_PORT: "18085"

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pull published latest image
        run: docker pull "$IMAGE"

      - name: Start container from published image
        run: |
          # BIRDLENSE_PORT defaults to 8080 in entrypoint.sh; expose that port.
          docker run -d --rm \
            --name "$CONTAINER" \
            -p "${HOST_PORT}:8080" \
            "$IMAGE"

      - name: Wait for /api/ui/readiness
        run: |
          set -e
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:${HOST_PORT}/api/ui/readiness" | tee /tmp/readiness.json | tr -d '\n\r\t ' | grep -q '"ready":true'; then
              echo "readiness OK after ${i} attempts"
              exit 0
            fi
            sleep 3
          done
          echo "readiness check failed for ${IMAGE}"
          docker logs "$CONTAINER" || true
          exit 1

      - name: Check /api/ui/status
        run: |
          curl -sf "http://127.0.0.1:${HOST_PORT}/api/ui/status" | tee /tmp/status.json
          tr -d '\n\r\t ' < /tmp/status.json | grep -q '"web":"ok"'

      - name: Container logs on failure
        if: failure()
        run: docker logs "$CONTAINER" || true

      - name: Stop container
        if: always()
        run: docker rm -f "$CONTAINER" || true
