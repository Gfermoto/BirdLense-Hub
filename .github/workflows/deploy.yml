# Автодеплой при push в main.
# Требует: self-hosted runner на сервере BirdLense (см. scripts/setup-auto-deploy.sh).
# Если workflow «висит» в Queued: runner offline или не зарегистрирован с метками self-hosted + birdlense.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, birdlense]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Sync to deploy dir
        run: |
          DEPLOY_DIR="${DEPLOY_DIR:-/root/BirdLense}"
          mkdir -p "$DEPLOY_DIR"/app/data/recordings "$DEPLOY_DIR"/app/data/db "$DEPLOY_DIR"/app/app_config
          UC="$DEPLOY_DIR/app/app_config/user_config.yaml"
          if [ -f "$UC" ]; then cp "$UC" "${UC}.bak.deploy-$(date +%Y%m%d%H%M%S)"; fi
          rsync -a --delete \
            --exclude='.git' \
            --exclude='app/data' \
            --exclude='app/.env' \
            --exclude='app/app_config/user_config.yaml' \
            --filter='P app/app_config/user_config.yaml' \
            --exclude='node_modules' \
            --exclude='__pycache__' \
            --exclude='.venv-docs-tmp' \
            --exclude='.venv-docs' \
            --exclude='site' \
            --exclude='app/.venv' \
            --exclude='.venv-datasets' \
            ./ "$DEPLOY_DIR"/

      # Сборка UI на runner: Dockerfile использует pre-built dist/index.html и не вызывает npm внутри образа
      # (на сервере npm до registry.npmjs.org часто ETIMEDOUT — см. app/Dockerfile stage ui).
      - name: Setup Node (UI host build)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/ui/package-lock.json

      - name: Build UI on host (pre-built dist for Docker)
        run: |
          set -euo pipefail
          DEPLOY_DIR="${DEPLOY_DIR:-/root/BirdLense}"
          cd "$DEPLOY_DIR/app/ui"
          npm config set fetch-retries 7
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          for attempt in 1 2 3; do
            npm ci --legacy-peer-deps && break
            [ "$attempt" -eq 3 ] && exit 1
            sleep 45
          done
          npm run build
          test -f dist/index.html

      # Intel GPU compose override skipped — Jetson-only platform

      - name: Build and restart
        run: |
          cd "${DEPLOY_DIR:-/root/BirdLense}/app"
          make stop 2>/dev/null || true
          make build
          make start

      # Blocking post-deploy verification: domain-health + strict-quality must pass.
      - name: Verify
        env:
          BIRDLENSE_UI_API_KEY: ${{ secrets.BIRDLENSE_UI_API_KEY }}
          RUN_VERIFY_RELEASE: ${{ vars.RUN_VERIFY_RELEASE || '0' }}
        run: |
          set -euo pipefail
          DEPLOY_DIR="${DEPLOY_DIR:-/root/BirdLense}"
          ENV_FILE="$DEPLOY_DIR/app/.env"
          PORT=8085
          if [ -f "$ENV_FILE" ]; then
            V=$(grep -E '^[[:space:]]*BIRDLENSE_PORT=' "$ENV_FILE" | tail -1 || true)
            if [ -n "$V" ]; then
              PORT="${V#*=}"
              PORT="${PORT//\"/}"
              PORT="${PORT//\'/}"
            fi
          fi
          BASE_URL="http://127.0.0.1:${PORT}"
          echo "Verify stack: ${BASE_URL}"
          sleep 10
          EFFECTIVE_UI_KEY="${BIRDLENSE_UI_API_KEY:-}"
          EFFECTIVE_MCP_TOKEN=""
          if [ -f "$ENV_FILE" ]; then
            if [ -z "${EFFECTIVE_UI_KEY}" ]; then
              V=$(grep -E '^[[:space:]]*BIRDLENSE_UI_API_KEY=' "$ENV_FILE" | tail -1 || true)
              if [ -n "$V" ]; then
                EFFECTIVE_UI_KEY="${V#*=}"
                EFFECTIVE_UI_KEY="${EFFECTIVE_UI_KEY//\"/}"
                EFFECTIVE_UI_KEY="${EFFECTIVE_UI_KEY//\'/}"
              fi
            fi
            V2=$(grep -E '^[[:space:]]*MCP_TOKEN=' "$ENV_FILE" | tail -1 || true)
            if [ -n "$V2" ]; then
              EFFECTIVE_MCP_TOKEN="${V2#*=}"
              EFFECTIVE_MCP_TOKEN="${EFFECTIVE_MCP_TOKEN//\"/}"
              EFFECTIVE_MCP_TOKEN="${EFFECTIVE_MCP_TOKEN//\'/}"
            fi
          fi
          # Strict verify uses either credential (same as verify-stack.sh / check-runtime-sli.sh /
          # perf_gate_runtime.py): prefer X-Birdlense-Api-Key when BIRDLENSE_UI_API_KEY is non-empty,
          # else Authorization: Bearer with MCP_TOKEN. Passing an empty string for the unused var is OK.
          if [ -z "${EFFECTIVE_UI_KEY}" ] && [ -z "${EFFECTIVE_MCP_TOKEN}" ]; then
            echo "FAIL: strict verify needs at least one of BIRDLENSE_UI_API_KEY or MCP_TOKEN (GitHub secret and/or ${ENV_FILE})." >&2
            exit 1
          fi
          if [ -n "${EFFECTIVE_UI_KEY}" ]; then
            echo "Verify auth: BIRDLENSE_UI_API_KEY (API key header); MCP_TOKEN unused when UI key is set."
          else
            echo "Verify auth: MCP_TOKEN (Bearer) only."
          fi
          cd "$DEPLOY_DIR"
          BIRDLENSE_UI_API_KEY="${EFFECTIVE_UI_KEY}" MCP_TOKEN="${EFFECTIVE_MCP_TOKEN}" \
            scripts/verify-stack.sh --base-url "${BASE_URL}" --check-domain-health --strict-quality
          BIRDLENSE_UI_API_KEY="${EFFECTIVE_UI_KEY}" MCP_TOKEN="${EFFECTIVE_MCP_TOKEN}" \
            MAX_HEARTBEAT_AGE_SECONDS=240 MAX_HTTP_OVER_1000MS_RATIO=0.20 MIN_HTTP_SAMPLE_COUNT=20 \
            scripts/check-runtime-sli.sh --base-url "${BASE_URL}"
          BIRDLENSE_UI_API_KEY="${EFFECTIVE_UI_KEY}" MCP_TOKEN="${EFFECTIVE_MCP_TOKEN}" \
            python3 scripts/perf_gate_runtime.py \
              --base-url "${BASE_URL}" \
              --burst-requests 120 \
              --burst-concurrency 12 \
              --metrics-scrapes 60 \
              --metrics-concurrency 8 \
              --soak-seconds 20 \
              --soak-interval-sec 0.8 \
              --max-error-rate 0.02 \
              --max-p95-ms 3000 \
              --max-p99-ms 5000 \
              --out /tmp/runtime_perf_gate.deploy.v1.json
          if [ "${RUN_VERIFY_RELEASE}" = "1" ]; then
            REQUIRE_SETTINGS_HEALTH=1 BIRDLENSE_UI_API_KEY="${EFFECTIVE_UI_KEY}" MCP_TOKEN="${EFFECTIVE_MCP_TOKEN}" BASE_URL="${BASE_URL}" \
              scripts/verify-release.sh
          else
            echo "Skip verify-release.sh (set repository variable RUN_VERIFY_RELEASE=1 to enable)."
          fi

      - name: Test recognition (optional)
        if: success()
        continue-on-error: true
        run: |
          VIDEO=$(find "${DEPLOY_DIR:-/root/BirdLense}/app/data/recordings" -name "video.mp4" -printf "%T@ %p\n" 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2)
          [ -n "$VIDEO" ] || exit 0
          CONTAINER_VIDEO="/app/data/recordings/${VIDEO#*recordings/}"
          docker exec birdlense python /app/processor/src/main.py "$CONTAINER_VIDEO" --fake-motion true
