# Регулярный аудит npm-зависимостей UI (не required в ruleset — может шуметь при новых advisory).
# pip-audit для Python остаётся в CI PR (job python-security).
name: npm audit (UI, scheduled)

on:
  workflow_dispatch:
  schedule:
    # Раз в неделю: понедельник 04:15 UTC (смещение относительно E2E вс 05:00 и smoke 04:30).
    - cron: "15 4 * * 1"

concurrency:
  group: npm-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: npm audit (app/ui)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/ui
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      - name: Install dependencies (frozen lockfile)
        run: npm ci

      # Политика (issue #284):
      # - Сканируем только runtime-зависимости (--omit=dev), как у собранного прод-артефакта.
      # - Падаем (exit ≠ 0), если есть хотя бы одна уязвимость уровня moderate и выше;
      #   low/info остаются в выводе npm, но не роняют job при moderate+ пороге.
      # Чтобы ослабить до high/critical: заменить на --audit-level=high.
      - name: npm audit (production deps, fail on moderate+)
        run: npm audit --omit=dev --audit-level=moderate
