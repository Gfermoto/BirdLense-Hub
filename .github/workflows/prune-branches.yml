# Опционально: снять с origin ветки кроме main и dev (ручной запуск мейнтейнером).
# Обычная уборка — только автоматическое удаление head-ветки после merge PR (delete_branch_on_merge).
name: Prune remote branches

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete remote branches except main and dev (manual only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          REPO="${{ github.repository }}"
          gh api "repos/${REPO}/branches" --paginate -q '.[].name' | while read -r b; do
            case "$b" in
              main|dev) ;;
              *)
                echo "DELETE heads/$b"
                enc=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "heads/${b}")
                gh api --method DELETE "repos/${REPO}/git/refs/${enc}" || true
                ;;
            esac
          done
