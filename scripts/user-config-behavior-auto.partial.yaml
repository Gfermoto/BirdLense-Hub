# Switch from canary to auto after v2 validation (use only when discrepancy <20%).
processor:
  behavior_recognition:
    enabled: true
    engine: auto
    video_model_kind: video_v2
    video_model_version: video-v2
    video_openvino_path: models/behavior_v2_openvino
    video_weights_path: models/behavior_v2_openvino/behavior_video_export.json
    video_confidence_store_min: 0.45
    canary_log_discrepancies: true
