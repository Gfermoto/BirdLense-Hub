# УСТАРЕЛО для detect substream: используйте user-config-yolo-thresholds.partial.yaml
# или scripts/apply-yolo-production-defaults.py (OV iGPU, пороги 0.08/0.10).
# Оставлено для истории; не мержить вместе с yolo-thresholds без ревью.

detection:
  min_confidence_to_store: 0.08

processor:
  tracker: models/tracker/bytetrack_birdlense_unstick.yaml
  min_box_size_px: 14
  min_confidence_binary_bird: 0.08
  min_confidence_binary: 0.08
  min_confidence_to_process: 0.20
  generic_bird_min_detector_conf: 0.10
  # Короткие слоты кормушки
  min_track_duration: 0.8
  # Меньше скипов при Frigate+OpenCV подряд
  min_seconds_between_recordings: 6
  adaptive_profiles:
    night:
      overrides:
        min_confidence_binary_bird: 0.28
        min_confidence_to_process: 0.30

triggers:
  frigate:
    # Оставляем MQTT-триггер включённым, если брокер задан на площадке (пустой broker — безопасно)
    enabled: true
