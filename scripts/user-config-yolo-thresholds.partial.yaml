# Soft YOLO/decision thresholds (2026-02) — deep-merge в user_config через apply_user_config_patch.py
# См. scripts/server-apply-user-config-patch.sh
# Геометрия дня выровнена с night overrides — меньше отсева мелких боксов (DINO/Re-ID кропы).
detection:
  min_confidence_to_store: 0.22
processor:
  min_box_size_px: 40
  min_center_dist: 0.03
  max_classifications_per_frame: 4
  min_confidence_binary: 0.24
  min_confidence_binary_bird: 0.26
  min_confidence_to_process: 0.24
  min_track_duration: 0.75
  generic_bird_min_detector_conf: 0.36
  generic_bird_min_best_frame_score: 5.5
  adaptive_profiles:
    night:
      overrides:
        min_confidence_binary: 0.22
        min_confidence_binary_bird: 0.26
        min_confidence_to_process: 0.24
        min_track_duration: 0.65
