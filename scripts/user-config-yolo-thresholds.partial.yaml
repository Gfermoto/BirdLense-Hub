# YOLO / ByteTrack / fusion tuning — deep-merge в user_config через apply_user_config_patch.py
# См. scripts/server-apply-user-config-patch.sh
detection:
  min_confidence_to_store: 0.22
  fusion_non_species_confidence_slack: 0.02
processor:
  # Пауза между клипами — меньше «эхо» подряд при OpenCV+Frigate (см. default_config).
  min_seconds_between_recordings: 12
  inference_lores_px: 640
  track_regen_lores_px: 640
  binary_imgsz: 640
  binary_track_iou: 0.72
  binary_track_max_det: 384
  min_box_size_px: 40
  min_center_dist: 0.03
  max_classifications_per_frame: 4
  min_confidence_binary: 0.24
  min_confidence_binary_bird: 0.26
  min_confidence_to_process: 0.24
  min_track_duration: 0.75
  generic_bird_min_detector_conf: 0.36
  generic_bird_min_best_frame_score: 5.5
  adaptive_profiles:
    night:
      overrides:
        min_confidence_binary: 0.22
        min_confidence_binary_bird: 0.26
        min_confidence_to_process: 0.24
        min_track_duration: 0.65
        binary_imgsz: 640
